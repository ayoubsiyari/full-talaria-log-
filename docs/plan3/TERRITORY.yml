# Open questions for the Director. Each is operative as written above until ruled.
open_rulings:
  - id: SH-1
    question: are docs/plan3/evidence, worker-reports and probes shared across all three managers, or should each manager write only under a manager-scoped subdirectory
    default_in_force: shared for all three managers
  - id: TB-1
    question: does Manager A own every chart v 1.4/chart/modules file not explicitly carved out to B, or should the module tree be enumerated file by file
    default_in_force: A owns the tree; B's five named modules win on specificity
  - id: TB-2
    question: V6 remains ungranted per A11.3 until the call-site audit reports; B's order-module grant is inferred and may need withdrawal if order-line paint lives in chart.js
    default_in_force: B owns order-manager.js, order-service.js, order-event-bus.js
  - id: TB-3
    question: unowned paths (journal-backend, deploy, homepage outside chart, tickets, shared) are currently RED for every manager by fail-closed default
    default_in_force: any packet touching them fails and requires a Director grant
  - id: TB-4
    question: does Manager C own package.json for npm gate-script registration, or must gate entry points be registered elsewhere
    default_in_force: C owns package.json
  - id: TB-5
    question: does Manager C own .gitignore for the governance-artifact negations, or should that change be Director-authored
    default_in_force: C owns .gitignore
  - id: TB-7
    question: Phase 4 runs four concurrent A lanes (chart.js spine, modules DOM scoping,
      chart-embed.html shell strip, bridge deletion). All four sit inside A's existing grant,
      so the territory preflight cannot detect a collision between them - it enforces
      BETWEEN managers, never WITHIN one. The single-writer rule for chart.js is therefore
      convention, not a CI control. Stated plainly per VER-01 rather than implied away.
    default_in_force: A partitions its own lanes by file and holds one writer on chart.js;
      a second concurrent chart.js writer is a defect the gate will not catch
  - id: TB-6
    question: docs/plan3 holds 340 untracked files against 56 tracked, and DIRECTOR-RULINGS-20260727.md is one of the untracked ones, so standing policy currently has no history, no diff and no attribution. Manager C did not un-ignore it, because whether policy documents enter version control is a Director decision. Ruling needed on which plan3 documents must be tracked.
    default_in_force: only the governance artifacts C owns are un-ignored (TERRITORY.yml, the four journals, GATE-NAME-RESERVATIONS.md, BOARD-VIEW.md, PO-QUEUE.md); every other plan3 document remains local-only and outside history
    status: RULED 2026-07-28 - standing policy, FINDING-*.md, PO-SWEEP-RESULTS and
      journal/FORMAT.md are tracked at ced58667c. Evidence for the ruling - a Director
      script overwrote two manager journals and git reported nothing, because they were
      untracked. Evidence documents (evidence/, probes/, worker-reports/) stay local.
