      - pattern: docs/plan3/oracles/**
        provenance: ruling
        authority: A11.2 item 3
      - pattern: docs/plan3/fixtures/**
        provenance: ruling
      - pattern: package.json
        provenance: inferred
        reason: gate entry points are registered as npm scripts; this is CI configuration in practice
      - pattern: .gitignore
        provenance: inferred
        reason: docs/ is ignored, so the territory manifest and the append-only journals could not enter history at all; narrow negations for the governance artifacts are a precondition for every gate C owns
    denied_paths:
      - pattern: chart v 1.4/chart/chart.js
        reason: C ships no product code and touches no chart.js
        provenance: ruling
        authority: A11.2 - you ship no product code, you touch no chart.js, and you deploy to no product surface
      - pattern: chart v 1.4/chart/modules/**
        reason: product code
        provenance: ruling
      - pattern: chart v 1.4/talaria-design/**
        reason: product surface
        provenance: ruling
      - pattern: homepage/public/chart/**
        reason: product surface
        provenance: ruling
      - pattern: homepage/out/chart/**
        reason: product surface
        provenance: ruling
      - pattern: docs/plan3/journal/MANAGER-A.md
