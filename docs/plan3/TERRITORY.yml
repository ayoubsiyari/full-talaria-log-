# Talaria territory manifest — manager -> owned paths -> owned mechanism rows.
#
# OWNER: Director, sole owner. No manager may commit a change to this file; the
# ownership preflight (scripts/territory-preflight.mjs) rejects any packet whose
# authoring manager is not Director and whose touched-file list includes it.
#
# WHAT THIS ENFORCES, AND WHAT IT DOES NOT (Director ruling A16.2). The `Manager:`
# commit trailer is SELF-DECLARED. The gate reads it; it does not authenticate it.
# A commit claiming `Manager: Director` is therefore not proof of Director
# authorship, and this file's governance is not cryptographically enforced.
# Two real controls exist and are the ones to rely on:
#   1. The manifest governing a packet is read from the packet's BASE commit, never
#      its head, so a packet cannot widen its own territory in the same diff.
#   2. Director commits land only on a `director/` branch (A14.4); `--manager` is a
#      branch cross-check, not an identity proof.
# Deliberate trailer forgery is out of band and is a trust boundary, not a CI
# control. Stated plainly rather than implied away, per VER-01: a gate must not
# claim a guarantee it cannot enforce.
#
# AUTHORITY: DIRECTOR-RULINGS-20260727.md Part A section A11 (three managers,
# continuously parallel) and A11.2 (Manager C queue item 1).
#
# PROVENANCE DISCIPLINE. Every grant below carries a `provenance` field:
#   ruling   - stated in DIRECTOR-RULINGS-20260727.md; quote in `authority`.
#   inferred - derived by Manager C from a ruling but not stated in it.
# `inferred` grants are operative (the gate is fail-closed and cannot wait) but
# are open Director questions, listed in `open_rulings` at the foot of this file
# and in docs/plan3/journal/MANAGER-C.md. Manager C may not promote an inferred
# grant to `ruling`; only the Director may.

schema: talaria.territory.v1
version: 20260727-C-001
owner: Director
authored_by: Manager C
authority: DIRECTOR-RULINGS-20260727.md#A11.2
manifest_path: docs/plan3/TERRITORY.yml

# Paths only the Director may touch. A packet from any manager that touches one
# of these is RED regardless of any other grant.
director_only:
  - pattern: docs/plan3/TERRITORY.yml
    reason: this manifest; a manager who can edit its own territory has no territory
    provenance: ruling
    authority: A11.2 - the Director is its sole owner and CI must reject any manager commit that touches it
  - pattern: docs/plan3/DIRECTOR-RULINGS-20260727.md
    reason: standing policy; managers may not author or relax policy
    provenance: ruling
    authority: DIRECTOR-RULINGS-20260727.md header - standing rules, not case-by-case
  - pattern: docs/plan3/journal/DIRECTOR.md
    reason: Director journal
    provenance: inferred

# Paths the Director may write, granted because standing policy, findings and the
# journal grammar are Director-authored artifacts that no manager owns. Without
# this grant the preflight is RED on the Director's own commits (ced58667c).
# Manager C's exact-pattern grants win on specificity; the manager journals are
# carved out below and are NOT covered by this grant.
# AUTHORITY: A14.4.
director_paths:
  - pattern: docs/plan3/*.md
    reason: standing policy, findings, PO-sweep results and intake documents
    provenance: ruling
    authority: A14.4
    except:
      - docs/plan3/BOARD-VIEW.md
      - docs/plan3/PO-QUEUE.md
      - docs/plan3/GATE-NAME-RESERVATIONS.md
  - pattern: docs/plan3/journal/FORMAT.md
    reason: journal grammar is normative and Director-ratified (DIR-003)
    provenance: ruling
    authority: A14.4

# Append-only journals. A diff that modifies or removes an existing line in any
# of these files fails the packet, and only the owning manager may append.
journals:
  - path: docs/plan3/journal/DIRECTOR.md
    owner: Director
  - path: docs/plan3/journal/MANAGER-A.md
    owner: A
  - path: docs/plan3/journal/MANAGER-B.md
    owner: B
  - path: docs/plan3/journal/MANAGER-C.md
    owner: C
  - path: docs/plan3/journal/MANAGER-D.md
    owner: D
  - path: docs/plan3/journal/MANAGER-E.md
    owner: E

# Artifact trees every manager writes into, because each manager's own gates emit
# their own evidence. Collision risk is low (paths are packet-named) and blocking
# them would stop all three managers from recording evidence.
# PROVISIONAL - awaiting Director confirmation, see open_rulings SH-1.
shared_paths:
  - pattern: docs/plan3/evidence/**
    reason: per-packet RED/GREEN evidence, packet-named, written by each manager's own gates
    provenance: inferred
  - pattern: docs/plan3/worker-reports/**
    reason: per-worker reports, worker-named
    provenance: inferred
  - pattern: docs/plan3/probes/**
    reason: per-probe diagnostics, probe-named
    provenance: inferred

