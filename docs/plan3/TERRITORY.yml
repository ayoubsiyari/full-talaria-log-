      - pattern: docs/plan3/journal/MANAGER-B.md
        provenance: ruling
        authority: A16.1
    denied_paths:
      - pattern: chart v 1.4/chart/chart.js
        reason: A11.3 - V6 order-line paint and drag preview must not be authored in chart.js by B until the ownership audit reports
        provenance: ruling
        authority: A11.3
      - pattern: docs/plan3/journal/MANAGER-A.md
        reason: another manager's journal
        provenance: ruling
      - pattern: docs/plan3/journal/MANAGER-C.md
        reason: another manager's journal
        provenance: ruling

  - id: C
    role: verification infrastructure - harnesses, oracles, fixtures, CI configuration, journal tooling
    deploy_surface: none
    provenance: ruling
    authority: A11.2 - C deploys nowhere; its customers are the other two managers' gates
    owned_rows:
