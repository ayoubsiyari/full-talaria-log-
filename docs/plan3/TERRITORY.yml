    role: chart engine and product surface
    deploy_surface: TEST-1
    provenance: ruling
    authority: A11.4 - A and B deploy to different surfaces (TEST-1 / TEST-2) while C deploys nowhere
    owned_rows:
      - M21-C3a-narrow
      - M21-C3a-full
      - M21-scheduler-consolidation
      - M19-I
      - M20
      - M20-Q9
      - M1
      - M2
      - M4
      - M5
      - A4c-loader
    owned_paths:
      - pattern: chart v 1.4/chart/chart.js
        provenance: ruling
        authority: A11.3 - if any of that lives in chart.js rather than order-manager.js, B collides with A immediately
      - pattern: chart v 1.4/chart/modules/**
        provenance: inferred
        reason: chart engine modules; B's order and preference modules are carved out in B.owned_paths and win on specificity
      - pattern: chart v 1.4/chart/*.html
        provenance: inferred
        reason: servable chart shells are product surface
      - pattern: chart v 1.4/chart/dist/**
        provenance: inferred
      - pattern: chart v 1.4/chart/dist-v9/**
        provenance: inferred
      - pattern: chart v 1.4/chart/dist-admin/**
        provenance: inferred
      - pattern: chart v 1.4/chart/multichart/**
        provenance: inferred
      - pattern: chart v 1.4/chart/multichart-prod/**
        provenance: inferred
      - pattern: chart v 1.4/talaria-design/**
        provenance: inferred
        reason: canonical V9 host source template
      - pattern: homepage/public/chart/**
        provenance: inferred
        reason: generated product mirrors of the above
      - pattern: homepage/out/chart/**
        provenance: inferred
      - pattern: docs/plan3/journal/MANAGER-A.md
        provenance: ruling
        authority: A16.1 - each manager holds a positive grant to its own journal; the
          journals block alone conferred no write right, so A and B were unowned
    denied_paths:
      - pattern: docs/plan3/journal/MANAGER-B.md
        reason: another manager's journal
        provenance: ruling
      - pattern: docs/plan3/journal/MANAGER-C.md
        reason: another manager's journal
        provenance: ruling

  - id: B
    role: orders, order-line interaction, preference persistence
    deploy_surface: TEST-2
    provenance: ruling
    authority: A11.4 - A and B deploy to different surfaces (TEST-1 / TEST-2)
    owned_rows:
      - V8
      - M15
      - M23
      - M24
    unresolved_rows:
      - row: V6
        reason: A11.3 - do not grant the territory on assumption; the cheap-tier call-site audit must report which file owns order-line paint, hit-testing and drag preview before V6 is granted
        provenance: ruling
        authority: A11.3
    owned_paths:
      - pattern: chart v 1.4/chart/modules/order-manager.js
        provenance: inferred
        reason: A11.3 names order-manager.js as B's expected home for V6; granted pending the A11.3 audit
      - pattern: chart v 1.4/chart/modules/order-service.js
