        reason: E confirmed this file live on 20260730 but it remains A's; E writes oracles
          against it and does not edit it. Prevents the collision that NOTE-E-IS-ABOUT-TO-FIX-POSSIBLY-DEAD-CODE flagged
        provenance: ruling
      - pattern: docs/plan3/journal/MANAGER-A.md
