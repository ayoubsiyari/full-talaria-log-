# Security headers for the static homepage (nginx, HTTP :80 behind docker 3000:80).
#
# Chart + Next.js need external CDNs (D3, Google Fonts). Do NOT use
# upgrade-insecure-requests or HSTS on this listener unless TLS terminates here.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://accounts.google.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://api.stripe.com wss: ws:; frame-src 'self' https://js.stripe.com https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'" always;

# Strip upstream fingerprint headers (§2.3)
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;
