# Security headers for the static homepage (nginx, HTTP :80 behind docker 3000:80).
#
# Do NOT use upgrade-insecure-requests or HSTS here unless TLS terminates on this
# nginx listener — otherwise every asset is rewritten to https:// and fails with
# ERR_SSL_PROTOCOL_ERROR when the server only speaks HTTP.
#
# Next.js static export needs script-src 'unsafe-inline' (no per-request CSP nonces).
# Stricter CSP + HSTS belong on the HTTPS terminator (see nginx-security-headers-https.conf).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://api.stripe.com wss: ws:; frame-src https://js.stripe.com https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'" always;

# Strip upstream fingerprint headers (§2.3)
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;
