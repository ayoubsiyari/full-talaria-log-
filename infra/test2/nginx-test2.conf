server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Talaria-Environment "TEST-2 QA ONLY" always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    proxy_hide_header Content-Security-Policy;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '</body>' '<div id="talaria-test2-permanent-badge" role="status" style="position:fixed;z-index:2147483647;inset:0 0 auto 0;padding:8px;background:#ff2d55;color:#fff;font:900 16px/1.2 sans-serif;text-align:center;letter-spacing:.12em;box-shadow:0 2px 10px #000">TEST-2 · QA ONLY · ISOLATED DATA</div></body>';
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ^~ /api/ {
        proxy_pass http://chart-test2:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Talaria-Environment "TEST-2";
    }

    location ^~ /journal/api/ {
        proxy_pass http://journal-test2:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Talaria-Environment "TEST-2";
    }

    location @chart_test2 {
        proxy_pass http://chart-test2:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Talaria-Environment "TEST-2";
    }

    location / {
        try_files $uri $uri/ $uri.html @chart_test2;
    }
}
