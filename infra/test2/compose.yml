name: talaria-test2

x-test2-service: &test2-service
  restart: unless-stopped
  networks: [test2_private]
  labels:
    talaria.environment: TEST-2
    talaria.qa-only: "true"

x-app-env: &app-env
  TALARIA_ENVIRONMENT: TEST-2
  QA_ONLY: "true"
  DATABASE_URL: postgresql://talaria_test2_app:${TEST2_POSTGRES_PASSWORD:?set in TEST2 secrets file}@postgres-test2:5432/talaria_test2
  REDIS_URL: redis://redis-test2:6379
  QUESTDB_PG_URL: postgresql://test2_qdb:${TEST2_QUESTDB_PASSWORD:?set in TEST2 secrets file}@questdb-test2:8812/qdb
  QUESTDB_ILP_HOST: questdb-test2
  QUESTDB_ILP_PORT: "9009"
  AUTH_ENABLED: "true"
  SESSION_COOKIE_NAME: talaria_test2_qa_session
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: strict
  CORS_ORIGINS: ${TEST2_ORIGIN:?set distinct TEST2 origin}
  TRUSTED_ORIGINS: ${TEST2_ORIGIN:?set distinct TEST2 origin}
  FRONTEND_URL: ${TEST2_ORIGIN:?set distinct TEST2 origin}
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  SENTRY_DSN: ""
  SECRET_KEY: ${TEST2_SECRET_KEY:?set in TEST2 secrets file}
  JWT_SECRET_KEY: ${TEST2_JWT_SECRET_KEY:?set in TEST2 secrets file}

services:
  postgres-test2:
    <<: *test2-service
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=60"]
    environment:
      POSTGRES_DB: talaria_test2
      POSTGRES_USER: test2_bootstrap_admin
      POSTGRES_PASSWORD: ${TEST2_POSTGRES_ADMIN_PASSWORD:?set in TEST2 secrets file}
      TEST2_POSTGRES_APP_PASSWORD: ${TEST2_POSTGRES_PASSWORD:?set in TEST2 secrets file}
    volumes:
      - test2_postgres:/var/lib/postgresql/data
    configs:
      - source: test2_postgres_init
        target: /docker-entrypoint-initdb.d/10-test2-role.sh
        mode: 0555
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talaria_test2_app -d talaria_test2"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-test2:
    <<: *test2-service
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    volumes:
      - test2_redis:/data
    mem_limit: 320m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  questdb-test2:
    <<: *test2-service
    image: questdb/questdb:8.2.2
    environment:
      QDB_PG_USER: test2_qdb
      QDB_PG_PASSWORD: ${TEST2_QUESTDB_PASSWORD:?set in TEST2 secrets file}
      QDB_SHARED_WORKER_COUNT: "1"
      QDB_PG_WORKER_COUNT: "1"
      QDB_HTTP_WORKER_COUNT: "1"
      QDB_LINE_TCP_WRITER_WORKER_COUNT: "1"
      QDB_SHARED_WORKER_YIELD_THRESHOLD: "1"
      QDB_SHARED_WORKER_SLEEP_THRESHOLD: "1"
    volumes:
      - test2_questdb:/var/lib/questdb
    mem_limit: 3g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8812'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  chart-test2:
    <<: *test2-service
    image: ${TEST2_CHART_IMAGE:?immutable TEST2 chart image required}
    environment:
      <<: *app-env
      APP_ROLE: api
      WEB_CONCURRENCY: "1"
      FIrstrate_SCHEDULE_ENABLED: "false"
      BINARY_WORKER_THREADS: "1"
    volumes:
      - test2_chart_uploads:/app/uploads
      - test2_chart_data:/app/data
    mem_limit: 1536m
    cpus: 1.0
    depends_on:
      postgres-test2: {condition: service_healthy}
      redis-test2: {condition: service_healthy}
      questdb-test2: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

  journal-test2:
    <<: *test2-service
    image: ${TEST2_JOURNAL_IMAGE:?immutable TEST2 journal image required}
    environment:
      <<: *app-env
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      CORS_ALLOWED_ORIGINS: ${TEST2_ORIGIN:?set distinct TEST2 origin}
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - test2_journal_uploads:/app/uploads
    mem_limit: 768m
    cpus: 0.5
    depends_on:
      postgres-test2: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker-test2:
    <<: *test2-service
    image: ${TEST2_CHART_IMAGE:?immutable TEST2 chart image required}
    command: ["gunicorn", "api_server:app", "-w", "1", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--timeout", "1800"]
    environment:
      <<: *app-env
      APP_ROLE: worker
      AUTH_ENABLED: "false"
      FIrstrate_SCHEDULE_ENABLED: "false"
      BINARY_WORKER_THREADS: "1"
    volumes:
      - test2_chart_uploads:/app/uploads
      - test2_chart_data:/app/data
    mem_limit: 1280m
    cpus: 0.75
    depends_on:
      postgres-test2: {condition: service_healthy}
      redis-test2: {condition: service_healthy}
      questdb-test2: {condition: service_healthy}

  homepage-test2:
    <<: *test2-service
    image: ${TEST2_HOMEPAGE_IMAGE:?immutable TEST2 homepage image required}
    ports:
      - "3001:80"
    configs:
      - source: test2_nginx
        target: /etc/nginx/conf.d/default.conf
    mem_limit: 192m
    cpus: 0.25
    depends_on:
      chart-test2: {condition: service_healthy}
      journal-test2: {condition: service_healthy}

networks:
  test2_private:
    name: talaria-test2-private
    internal: true

configs:
  test2_nginx:
    file: ./nginx-test2.conf
  test2_postgres_init:
    file: ./postgres-init.sh

volumes:
  test2_postgres:
    name: talaria-test2-postgres
  test2_redis:
    name: talaria-test2-redis
  test2_questdb:
    name: talaria-test2-questdb
  test2_chart_uploads:
    name: talaria-test2-chart-uploads
  test2_chart_data:
    name: talaria-test2-chart-data
  test2_journal_uploads:
    name: talaria-test2-journal-uploads
