# Dependency + static security scans. Runs on PRs and main.
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: journal-frontend, dir: journal-frontend }
          - { name: homepage, dir: homepage }
          - { name: chart, dir: "chart v 1.4/chart" }
          - { name: root, dir: "." }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=moderate

  python-audit:
    name: Python (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: journal-backend/requirements.txt

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit "bandit[toml]>=1.7.0"

      - name: pip-audit (journal-backend)
        run: python -m pip_audit -r journal-backend/requirements.txt

      - name: bandit (journal-backend)
        run: bandit -c bandit.yaml -r journal-backend -ll -ii

      - name: bandit (chart API)
        run: bandit -c bandit.yaml -r "chart v 1.4/chart" -ll -ii

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
