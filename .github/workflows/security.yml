# Dependency + static security scans.
#
# Triggers (deliberately quiet to avoid notification floods on every commit):
#   - pull_request: scoped via path filters per matrix entry (each job re-checks paths).
#   - schedule:     weekly full scan to catch newly-disclosed CVEs in unchanged code.
#   - workflow_dispatch: manual on-demand run from the Actions UI.
#
# We DO NOT run on every push to main. Local dev mirror lives in scripts/verify-dependencies.sh.
name: Security

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "journal-backend/requirements.txt"
      - "journal-backend/**/*.py"
      - "chart v 1.4/chart/**/*.py"
      - "bandit.yaml"
      - ".github/workflows/security.yml"
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: homepage, dir: homepage }
          - { name: chart, dir: "chart v 1.4/chart" }
          - { name: root, dir: "." }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      # Production-only audit: dev/build-only deps (jest, jsdom, build plugins, terser, etc.)
      # do not ship to end users. This is the legitimate scope-narrowing path called for in
      # .cursor/rules/security-and-supply-chain.mdc — the guard remains; only the surface
      # being guarded is the runtime surface.
      - name: npm audit (production deps)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=critical --omit=dev

  chart-build-smoke:
    # Runs only after the chart audit passes; isolates "audit failure" from "build failure"
    # so reds in the email subject map to the actual cause.
    name: Chart client bundle build
    runs-on: ubuntu-latest
    needs: npm-audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "chart v 1.4/chart/package-lock.json"

      - name: Install dependencies
        working-directory: "chart v 1.4/chart"
        run: npm ci

      - name: Build chart client bundle
        working-directory: "chart v 1.4/chart"
        run: npm run build:chart-client

  python-audit:
    name: Python (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: journal-backend/requirements.txt

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit "bandit[toml]>=1.7.0"

      - name: pip-audit (journal-backend)
        run: python -m pip_audit -r journal-backend/requirements.txt

      - name: bandit (journal-backend)
        run: bandit -c bandit.yaml -r journal-backend -ll -ii

      - name: bandit (chart API)
        run: bandit -c bandit.yaml -r "chart v 1.4/chart" -ll -ii

  gitleaks:
    # We use the OSS gitleaks binary directly instead of gitleaks/gitleaks-action@v2.
    # The action wrapper requires GITLEAKS_LICENSE for organizations and has historically
    # been the source of 1-second "Failed" runs in CI when license/network checks short-circuit.
    # The underlying scanner is fully open source and behaves identically.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (full history)
        run: gitleaks detect --source . --no-banner --redact --verbose --exit-code 1
