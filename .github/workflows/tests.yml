# Automated test gate for pull requests.
#
# Mirrors the quiet trigger style of security.yml: runs only on PRs that touch
# the relevant backend code (and on manual dispatch), not on every push to main.
# Each job installs that service's own dependencies and runs its existing pytest
# suite so regressions are caught before deploy.
name: Tests

on:
  pull_request:
    paths:
      - "chart v 1.4/chart/**/*.py"
      - "journal-backend/**/*.py"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart-tests:
    name: chart API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "chart v 1.4/chart/requirements.txt"

      - name: Install dependencies
        working-directory: "chart v 1.4/chart"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        working-directory: "chart v 1.4/chart"
        # Tests fall back to SQLite + fakeredis when no Postgres/Redis is present.
        env:
          AUTH_ENABLED: "false"
        run: python -m pytest tests/ -q

  journal-tests:
    name: journal-backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: journal-backend/requirements.txt

      - name: Install dependencies
        working-directory: journal-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run pytest
        working-directory: journal-backend
        # Uses the default SQLite dev database; no external services required.
        env:
          FLASK_ENV: development
        run: python -m pytest tests/ -q
