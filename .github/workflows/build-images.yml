# Build the heavy app images in CI (NOT on the production VPS).
#
# Why: the VPS deploy used `git pull && docker compose up -d --build`, which ran
# `npm ci` (~12 min), `npm run build:live:chart` (~4 min) and `npm run build:chart-client`
# (Terser, ~8–10 min) ON the production host every deploy — a multi-minute, multi-core
# CPU spike. Here we build once on GitHub runners, push to GHCR, and the VPS only does
# `docker compose pull && docker compose up -d` (no compile on the box).
#
# GitHub Actions cache (type=gha) keeps unchanged layers warm so most pushes are fast.
# These automatic images are development/CI artifacts (strict=0). Production
# deploy.sh accepts only separately published strict checkpoint images recorded
# by immutable digest in a validated provenance manifest.
name: Build & push images

on:
  push:
    branches: ["main"]
    paths:
      - "chart v 1.4/**"
      - "homepage/**"
      - "Sources Handoff/TalariaV16.jsx"
      - "Sources Handoff/scoreEngine.js"
      - "Sources Handoff/v16AppliedSourceStorage.js"
      - "journal-backend/**"
      - "securty/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # M1 remainder (§A4c): both preflights on the deploy/image path, not only multichart-harness.
  preflight:
    name: deploy-path preflights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Module-contract preflight
        run: node scripts/module-contract-preflight.mjs
      - name: Shell-inventory preflight (deploy-path; same ratchet as shell-inventory.yml)
        id: shell_inv
        run: |
          set -uo pipefail
          set +e
          node scripts/shell-inventory-preflight.mjs \
            --allow-kinds=conditional-exposure:2,exclusion-count-undeclared:1,proof-of-derouting-unsatisfied:38,shell-parse-incomplete:12
          status=$?
          set -e
          case "$status" in
            0|2) exit 0 ;;
            *) exit "$status" ;;
          esac
      - name: Cache-stamp coherence
        run: node scripts/cache-stamp-coherence-gate.mjs

  build:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trading-chart
            image: talaria-trading-chart
            context: .
            dockerfile: chart v 1.4/chart/Dockerfile.local
          - name: homepage
            image: talaria-homepage
            context: .
            dockerfile: homepage/Dockerfile
          - name: journal-backend
            image: talaria-journal-backend
            context: ./journal-backend
            dockerfile: Dockerfile
            build_contexts: talaria-security=./securty/python
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          push: true
          build-args: |
            CHECKPOINT_BUILD=0
            SOURCE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
