name: Multichart harness

on:
  pull_request:
    paths:
      - "chart v 1.4/chart/**"
      - "chart v 1.4/talaria-design/src/Multichart*"
      - "chart v 1.4/talaria-design/vite.config.live.js"
      - "chart v 1.4/chart/multichart-prod/harness/**"
      - ".github/workflows/multichart-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multichart-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "chart v 1.4/chart/multichart-prod/harness/package-lock.json"

      - name: Enforce chart module contracts
        run: node scripts/module-contract-preflight.mjs

      - name: Install harness dependencies
        working-directory: "chart v 1.4/chart/multichart-prod/harness"
        run: npm ci

      - name: Prove module contracts in Chromium
        run: npm run test:module-contracts

      - name: Run multichart regression gate
        working-directory: "chart v 1.4/chart/multichart-prod/harness"
        run: npm run gate

  gate-react:
    name: react parity gate (real iframe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            chart v 1.4/talaria-design/package-lock.json
            chart v 1.4/chart/multichart-prod/harness/package-lock.json

      - name: Install talaria-design dependencies
        working-directory: "chart v 1.4/talaria-design"
        run: npm ci

      - name: Build dist-v9 (built product for real-iframe parity)
        working-directory: "chart v 1.4/talaria-design"
        run: npm run build:live

      - name: Install harness dependencies
        working-directory: "chart v 1.4/chart/multichart-prod/harness"
        run: npm ci

      - name: Run react parity gate (built dist-v9 + real iframes)
        working-directory: "chart v 1.4/chart/multichart-prod/harness"
        run: npm run gate:react
