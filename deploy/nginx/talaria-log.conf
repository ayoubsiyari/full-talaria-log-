# Host nginx (on the VPS, NOT in Docker) — reverse proxy for talaria-log.com that
# forwards to the homepage container published on 127.0.0.1:3000.
#
# This file intentionally contains ONLY the port-80 server. Run certbot --nginx
# and it will (a) obtain the certificate, (b) add the `listen 443 ssl` block with
# the cert paths, and (c) add an HTTP->HTTPS redirect. Defining an `ssl` listener
# here with no certificate makes `nginx -t` fail, which blocks certbot itself.
#
# Install on the server:
#   sudo cp deploy/nginx/talaria-log.conf /etc/nginx/sites-available/talaria-log.conf
#   sudo ln -sf /etc/nginx/sites-available/talaria-log.conf /etc/nginx/sites-enabled/talaria-log.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d talaria-log.com -d www.talaria-log.com   # adds HTTPS + redirect
#   sudo certbot renew --dry-run                                     # auto-renew is via systemd timer

# WebSocket upgrade support (support inbox pings, chart stream).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# SECURITY NOTES (verified 2026-07-12 against the live site):
#   * The domain is fronted by Cloudflare, which already does the HTTP->HTTPS 301
#     and serves a valid cert. HSTS is NOT set at the edge or origin yet — enable
#     "HSTS" under Cloudflare › SSL/TLS › Edge Certificates, OR rely on the origin
#     app now emitting HSTS over TLS (homepage nginx $hsts_header + FastAPI). The
#     Cloudflare toggle is preferred (covers every response, not just the shell).
#   * The origin IP (51.20.190.169) is directly reachable, which BYPASSES Cloudflare
#     WAF / bot / rate-limit rules. Restrict inbound 80/443 to Cloudflare's published
#     IP ranges (ufw / cloud security group) or use Authenticated Origin Pulls /
#     Cloudflare Tunnel so only the edge can reach the origin.
server {
    listen 80;
    listen [::]:80;
    server_name talaria-log.com www.talaria-log.com;

    # Hide nginx version in the Server header (info-disclosure reduction). For
    # domain traffic Cloudflare already masks it; this covers direct-origin hits.
    server_tokens off;

    # Let's Encrypt HTTP-01 challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Uploads / large chart state payloads.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # CRITICAL: tell the stack the original request scheme so backends set
        # Secure cookies and build https URLs. After certbot adds the 443 block and
        # the HTTP->HTTPS redirect, real traffic arrives here over TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 75s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }
}
