# Host nginx (on the VPS, NOT in Docker) — terminates TLS for talaria-log.com and
# proxies to the homepage container published on 127.0.0.1:3000. This is the piece
# that makes https:// work and forwards X-Forwarded-Proto: https so Secure session
# cookies stick (fixes the login-loop that appears on plain HTTP).
#
# Install on the server:
#   sudo apt-get update && sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/talaria-log.conf /etc/nginx/sites-available/talaria-log.conf
#   sudo ln -s /etc/nginx/sites-available/talaria-log.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   # Issue + auto-install the certificate (edits the 443 block for you):
#   sudo certbot --nginx -d talaria-log.com -d www.talaria-log.com
#   # certbot sets up auto-renew via a systemd timer; verify with:
#   sudo certbot renew --dry-run

# WebSocket upgrade support (support inbox pings, chart stream).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect apex -> www (optional; keeps one canonical host). Comment out if you
# want the apex to serve directly.
server {
    listen 80;
    listen [::]:80;
    server_name talaria-log.com www.talaria-log.com;

    # Allow Let's Encrypt HTTP-01 challenges before the cert exists.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talaria-log.com www.talaria-log.com;

    # certbot --nginx fills in ssl_certificate / ssl_certificate_key below.
    # ssl_certificate     /etc/letsencrypt/live/talaria-log.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/talaria-log.com/privkey.pem;

    # Uploads / large chart state payloads.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # CRITICAL: tell the stack the ORIGINAL request was HTTPS so backends set
        # Secure cookies and generate https URLs. The Docker nginx passes this on.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 75s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }
}
