<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talaria — Multichart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Absolute paths required: this page is served at /chart/multi (no trailing slash),
         so relative URLs resolve against /chart/ and 404. /chart/multi/* is the static mount. -->
    <link rel="stylesheet" href="/chart/multi/shell.css?v=20260509T2230" />
</head>
<body>
<div class="app log-collapsed">

    <header class="topbar">
        <h1 title="Talaria multichart — production v1. Each panel is a full Talaria chart in its own iframe (dist-v9 with ?multichart=1). Tools, indicators, drawings, orders, replay all work per-panel. Sync (crosshair / visible range / symbol) is governed by the verified allowlist + loop guard from multi_chart_rebuild_roadmap.md.">
            Talaria <span class="ver">Multichart v1</span><span class="badge" id="version-badge">2026-05-09</span>
        </h1>

        <div class="group">
            <label>Layout</label>
            <select id="layout-select">
                <option value="1">1</option>
                <option value="2v" selected>2 ⬌</option>
                <option value="2h">2 ⬍</option>
                <option value="3l">3 (L)</option>
                <option value="3r">3 (R)</option>
                <option value="2x2">2×2</option>
            </select>
        </div>

        <div class="group">
            <label class="checkbox" title="Move the crosshair on one panel — peers follow at the matching time bucket. Price is never sent."><input type="checkbox" id="sync-crosshair" checked /> Crosshair</label>
            <label class="checkbox" title="Pan/zoom one panel — peers show the same time window snapped to their own bar buckets. Each panel's price axis auto-fits its OWN visible candles."><input type="checkbox" id="sync-visible" checked /> Visible range</label>
            <label class="checkbox" title="Symbol sync requires a Phase 7.2 React-state hook in dist-v9 — disabled in v1. Each panel picks its own file/symbol via the native dist-v9 UI."><input type="checkbox" id="sync-symbol" disabled title="Phase 7.2" /> Symbol (v1.1)</label>
        </div>

        <div class="spacer"></div>

        <div class="group">
            <button id="diagnose" title="Dump the current state of every panel + manager to the log + console">Diagnose</button>
            <button id="self-test" title="Run the engine-API guard self-test on every iframe (verifies the price-axis lockdown is intact)">Self-test</button>
            <button id="toggle-log" title="Show/hide the diagnostic log panel at the bottom">Show log</button>
            <button id="reset-session" title="Clear saved layout + per-panel state from this browser">Reset</button>
        </div>

        <span class="help">Each panel = full Talaria chart. All tools, indicators, drawings, orders work per-panel.</span>
    </header>

    <section class="charts" id="charts-area"></section>

    <section class="bottom">
        <div class="log" id="log"></div>
        <div class="assertions" id="assertions">
            <h3>Per-panel status</h3>
            <div id="chart-states"></div>
        </div>
    </section>
</div>

<!-- Sandbox-verified core (verbatim copies). Absolute paths (see CSS link above for reasoning). -->
<script src="/chart/multi/engine-api-guards.js?v=20260509T2230"></script>
<script src="/chart/multi/multichart-manager.js?v=20260509T2230"></script>
<script>
(function () {
    'use strict';

    // ─── DOM handles ─────────────────────────────────────────────────────
    const chartsArea = document.getElementById('charts-area');
    const logEl      = document.getElementById('log');
    const layoutSel  = document.getElementById('layout-select');
    const versionBadge = document.getElementById('version-badge');

    if (window.MultichartGuards && versionBadge) {
        versionBadge.title = 'guards: ' + window.MultichartGuards.VERSION;
    }

    // ─── Layout definitions ──────────────────────────────────────────────
    //
    // Each layout describes a CSS-grid template + cell positions. v1 panels
    // are identified by id only (A, B, C, D); each iframe loads dist-v9 and
    // the user picks file/tf/symbol with the native chart UI inside the
    // panel. No per-panel cfg here — that comes later.
    const LAYOUTS = {
        '1':   { gridCols: '1fr',                   gridRows: '1fr',
                 charts: [{ id: 'A' }] },
        '2v':  { gridCols: '1fr 8px 1fr',           gridRows: '1fr',
                 charts: [{ id: 'A' }, { id: 'B' }],
                 dividers: [{ orient: 'col', after: 0 }] },
        '2h':  { gridCols: '1fr',                   gridRows: '1fr 8px 1fr',
                 charts: [{ id: 'A' }, { id: 'B' }],
                 dividers: [{ orient: 'row', after: 0 }] },
        '3l':  { gridCols: '1fr 8px 1fr',           gridRows: '1fr 8px 1fr',
                 charts: [
                     { id: 'A', col: '1', row: '1 / span 3' },
                     { id: 'B', col: '3', row: '1' },
                     { id: 'C', col: '3', row: '3' },
                 ],
                 manualDividers: [
                     { orient: 'col', col: '2', row: '1 / span 3' },
                     { orient: 'row', col: '3', row: '2' },
                 ] },
        '3r':  { gridCols: '1fr 8px 1fr',           gridRows: '1fr 8px 1fr',
                 charts: [
                     { id: 'A', col: '1', row: '1' },
                     { id: 'B', col: '1', row: '3' },
                     { id: 'C', col: '3', row: '1 / span 3' },
                 ],
                 manualDividers: [
                     { orient: 'col', col: '2', row: '1 / span 3' },
                     { orient: 'row', col: '1', row: '2' },
                 ] },
        '2x2': { gridCols: '1fr 8px 1fr',           gridRows: '1fr 8px 1fr',
                 charts: [
                     { id: 'A', col: '1', row: '1' },
                     { id: 'B', col: '3', row: '1' },
                     { id: 'C', col: '1', row: '3' },
                     { id: 'D', col: '3', row: '3' },
                 ],
                 manualDividers: [
                     { orient: 'col', col: '2', row: '1 / span 3' },
                     { orient: 'row', col: '1 / span 3', row: '2' },
                 ] },
    };

    let manager = null;

    // ─── Session persistence (Phase 6.4 design, ported verbatim) ─────────
    //
    // localStorage key + version + allowlist. ONLY layout + sync mode +
    // log-panel visibility are persisted in v1; per-panel session restore
    // (file/tf/visible range) needs a React-state hook in dist-v9 that we
    // haven't built yet, so we don't fake it. The forbidden-fields guard
    // still runs as defense in depth in case a future schema change adds
    // them.
    const SESSION_KEY = 'talaria-multichart-session-v1';
    const SESSION_VERSION = 1;
    const PERSIST_SHELL_FIELDS = Object.freeze([
        'version', 'layout', 'syncMode', 'logVisible',
    ]);

    function _pickAllowed(src, allow) {
        const out = {};
        for (const k of allow) if (src[k] !== undefined && src[k] !== null) out[k] = src[k];
        return out;
    }

    function loadSession() {
        let raw;
        try { raw = localStorage.getItem(SESSION_KEY); } catch (_) { return null; }
        if (!raw) return null;
        let parsed;
        try { parsed = JSON.parse(raw); } catch (_) { return null; }
        if (!parsed || typeof parsed !== 'object') return null;
        if (parsed.version !== SESSION_VERSION) return null;
        try {
            const f = window.MultichartGuards
                && window.MultichartGuards.filterForbiddenFields
                && window.MultichartGuards.filterForbiddenFields(parsed);
            if (f && f.dropped && f.dropped.length) {
                console.error('[shell] session-restore: dropped forbidden fields:', f.dropped);
            }
        } catch (_) {}
        return _pickAllowed(parsed, PERSIST_SHELL_FIELDS);
    }

    let _saveSessionTimer = 0;
    function saveSession() {
        if (_saveSessionTimer) clearTimeout(_saveSessionTimer);
        _saveSessionTimer = setTimeout(_doSaveSession, 500);
    }
    function _doSaveSession() {
        _saveSessionTimer = 0;
        const session = {
            version: SESSION_VERSION,
            layout: layoutSel.value,
            syncMode: {
                crosshair:    document.getElementById('sync-crosshair').checked,
                visibleRange: document.getElementById('sync-visible').checked,
                symbol:       document.getElementById('sync-symbol').checked,
            },
            logVisible: !document.querySelector('.app').classList.contains('log-collapsed'),
        };
        try {
            const f = window.MultichartGuards.filterForbiddenFields(session);
            if (f && f.dropped && f.dropped.length) {
                console.error('[shell] session-save: dropped forbidden fields BEFORE write:', f.dropped);
            }
        } catch (_) {}
        try {
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        } catch (e) {
            console.warn('[shell] session-save failed:', e && e.message);
        }
    }

    // ─── Logging ─────────────────────────────────────────────────────────
    function appendLog(entry) {
        if (typeof entry === 'string') {
            entry = { ts: Date.now(), level: 'info', text: entry };
        }
        const ts = Number.isFinite(entry && entry.ts) ? entry.ts : Date.now();
        const level = (entry && entry.level) || 'info';
        const text  = (entry && entry.text) || '';
        const div = document.createElement('div');
        div.className = 'row ' + level;
        let tsStr;
        try { tsStr = new Date(ts).toISOString().slice(11, 23); }
        catch (_) { tsStr = '--:--:--.---'; }
        div.innerHTML = '<span class="ts">' + tsStr + '</span>' + escapeHtml(text);
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
        while (logEl.childElementCount > 1500) logEl.removeChild(logEl.firstChild);
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
        });
    }

    function renderChartStates() {
        const host = document.getElementById('chart-states');
        host.innerHTML = '';
        if (!manager) return;
        for (const c of manager.getCharts()) {
            const s = c.state || {};
            const div = document.createElement('div');
            div.className = 'item ' + (c.ready ? 'pass' : 'fail');
            const readyMark = c.ready ? '\u2713' : '\u26A0';
            const sym = s.symbol || '—';
            const tf  = s.timeframe || '—';
            const bars = (s.candleCount || 0).toLocaleString();
            div.innerHTML =
                '<span class="name">' + readyMark + ' ' + c.id + '</span>'
              + '<span class="val">' + sym + ' · ' + tf + ' · ' + bars + ' bars</span>';
            host.appendChild(div);
        }
    }
    setInterval(renderChartStates, 750);

    // ─── iframe URL builder ──────────────────────────────────────────────
    //
    // Each panel loads the COMPLETE dist-v9 React app with ?multichart=1
    // added so dist-v9 knows to (a) add body.multichart-embed (room for
    // future CSS to hide chrome that doesn't make sense per-panel) and
    // (b) inject embed-bridge.js, which installs the proven sync-bridge.js
    // on `window.chart` once it appears.
    //
    // panelId becomes the chartId for the bridge — it must be unique per
    // iframe so PEER fan-out can address each one.
    function buildIframeSrc(cfg) {
        const params = new URLSearchParams();
        params.set('multichart', '1');
        params.set('panelId', cfg.id);
        // verbose=1 turns on bridge debug logging — intentionally off in
        // production unless ?debug=1 is present on the shell URL.
        if (window.__multichartDebug) params.set('verbose', '1');
        return '/chart/dist-v9/index.html?' + params.toString();
    }

    // ─── Build a layout ──────────────────────────────────────────────────
    function applyLayout(name) {
        const cfg = LAYOUTS[name];
        if (!cfg) return;

        if (manager) manager.dispose();
        chartsArea.innerHTML = '';

        chartsArea.style.gridTemplateColumns = cfg.gridCols;
        chartsArea.style.gridTemplateRows    = cfg.gridRows;

        manager = new MultichartManager({
            container: chartsArea,
            iframeSrcBuilder: buildIframeSrc,
            onLog:    appendLog,
            onState:  function () { /* read directly from manager.getCharts() */ },
            onAssertion: function () { /* assertion counts available on manager.counters */ },
        });
        window.__manager = manager;

        // Predefined layouts use one of two placement schemes:
        //   - simple (charts only, alternating with auto dividers): used by 1,
        //     2v, 2h. Matches the sandbox layout placement.
        //   - manual (charts have explicit col/row, manualDividers list): used
        //     by 3l, 3r, 2x2 where dividers don't fall between siblings.
        if (cfg.charts[0] && cfg.charts[0].col) {
            // Manual placement
            for (const ch of cfg.charts) {
                const cell = makeCell(ch);
                if (ch.col) cell.style.gridColumn = ch.col;
                if (ch.row) cell.style.gridRow    = ch.row;
                chartsArea.appendChild(cell);
                manager.addChart(ch, cell);
            }
            for (const d of (cfg.manualDividers || [])) {
                const div = makeDivider(d.orient);
                if (d.col) div.style.gridColumn = d.col;
                if (d.row) div.style.gridRow    = d.row;
                chartsArea.appendChild(div);
                installDividerDrag(div, d.orient);
            }
        } else {
            // Simple placement: charts in source order with dividers between
            const orient = (cfg.dividers && cfg.dividers[0] && cfg.dividers[0].orient) || 'col';
            for (let i = 0; i < cfg.charts.length; i++) {
                const cell = makeCell(cfg.charts[i]);
                chartsArea.appendChild(cell);
                manager.addChart(cfg.charts[i], cell);
                if (i < cfg.charts.length - 1) {
                    const div = makeDivider(orient);
                    chartsArea.appendChild(div);
                    installDividerDrag(div, orient);
                }
            }
        }

        manager.setSyncMode({
            crosshair:    document.getElementById('sync-crosshair').checked,
            visibleRange: document.getElementById('sync-visible').checked,
            symbol:       document.getElementById('sync-symbol').checked,
        });

        // Resize cascade (from sandbox v10.4.4): chart.js inside each iframe
        // computes margin.r at first paint, but the iframe is in a transient
        // size when the second/third panels are still being created. Force a
        // resize at three checkpoints.
        setTimeout(notifyChartsResized,  150);
        setTimeout(notifyChartsResized,  500);
        setTimeout(notifyChartsResized, 1500);

        saveSession();
    }

    function makeCell(chartCfg) {
        const cell = document.createElement('div');
        cell.className = 'chart-cell';
        cell.setAttribute('data-id', chartCfg.id);
        return cell;
    }

    function makeDivider(orient) {
        const d = document.createElement('div');
        d.className = 'divider' + (orient === 'row' ? ' row' : '');
        d.title = 'Drag to resize';
        const handle = document.createElement('div');
        handle.className = 'divider-handle';
        d.appendChild(handle);
        return d;
    }

    let _resizeRaf = 0;
    function notifyChartsResized() {
        if (_resizeRaf) return;
        _resizeRaf = requestAnimationFrame(function () {
            _resizeRaf = 0;
            if (!manager) return;
            for (const c of manager.getCharts()) {
                try {
                    const cw = c.frame && c.frame.contentWindow;
                    if (!cw) continue;
                    const ch = cw.chart;
                    if (!ch) {
                        const Ev = cw.Event || Event;
                        cw.dispatchEvent(new Ev('resize'));
                        continue;
                    }
                    if (typeof ch.resize === 'function') ch.resize();
                    if (typeof ch.scheduleRender === 'function') ch.scheduleRender();
                    else if (typeof ch.render === 'function') ch.render();
                    const Ev = cw.Event || Event;
                    cw.dispatchEvent(new Ev('resize'));
                } catch (e) {
                    console.warn('[shell] resize call failed for', c.id, e);
                }
            }
        });
    }

    function installDividerDrag(divEl, orient) {
        let dragging = false;
        let startPos = 0;
        let prevSize = 0, nextSize = 0, prevEl = null, nextEl = null;
        let totalSize = 0;
        let prevTrackIdx = -1, nextTrackIdx = -1;
        let activePointerId = null;

        function getTracks() {
            const cs = window.getComputedStyle(chartsArea);
            const tpl = orient === 'col' ? cs.gridTemplateColumns : cs.gridTemplateRows;
            return tpl.split(/\s+/).map(s => parseFloat(s) || 0);
        }
        function setTracks(tracks) {
            const css = tracks.map(v => v + 'px').join(' ');
            if (orient === 'col') chartsArea.style.gridTemplateColumns = css;
            else                  chartsArea.style.gridTemplateRows    = css;
        }
        function findTrackNeighbours() {
            // Walk DOM siblings to find the cells immediately before/after
            // this divider. For manual layouts, the divider may be in a row
            // or column that doesn't have direct sibling cells — fall back
            // to nearest cell on each side via grid coordinates.
            prevEl = divEl.previousElementSibling;
            nextEl = divEl.nextElementSibling;
            // Grid auto-flow may have placed things in unexpected document
            // order; the actual track index needs to be found by which cell
            // is positioned just before/after the divider in document order.
            const kids = Array.prototype.slice.call(chartsArea.children);
            prevTrackIdx = kids.indexOf(prevEl);
            nextTrackIdx = kids.indexOf(nextEl);
        }

        divEl.addEventListener('pointerdown', function (e) {
            if (e.button !== 0) return;
            dragging = true;
            activePointerId = e.pointerId;
            try { divEl.setPointerCapture(e.pointerId); } catch (_) {}
            divEl.classList.add('dragging');
            startPos = (orient === 'col' ? e.clientX : e.clientY);
            findTrackNeighbours();
            const tracks = getTracks();
            prevSize  = tracks[prevTrackIdx] || 0;
            nextSize  = tracks[nextTrackIdx] || 0;
            totalSize = prevSize + nextSize;
            const frames = chartsArea.querySelectorAll('iframe');
            for (let i = 0; i < frames.length; i++) {
                frames[i].style.pointerEvents = 'none';
            }
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });
        divEl.addEventListener('pointermove', function (e) {
            if (!dragging || e.pointerId !== activePointerId) return;
            const cur = (orient === 'col' ? e.clientX : e.clientY);
            const delta = cur - startPos;
            const newPrev = Math.max(120, Math.min(totalSize - 120, prevSize + delta));
            const newNext = totalSize - newPrev;
            const tracks = getTracks();
            tracks[prevTrackIdx] = newPrev;
            tracks[nextTrackIdx] = newNext;
            setTracks(tracks);
            notifyChartsResized();
        });
        function endDrag(e) {
            if (!dragging) return;
            if (e && e.pointerId !== activePointerId) return;
            dragging = false;
            try { divEl.releasePointerCapture(activePointerId); } catch (_) {}
            activePointerId = null;
            divEl.classList.remove('dragging');
            const frames = chartsArea.querySelectorAll('iframe');
            for (let i = 0; i < frames.length; i++) frames[i].style.pointerEvents = '';
            document.body.style.userSelect = '';
            notifyChartsResized();
            setTimeout(notifyChartsResized, 130);
        }
        divEl.addEventListener('pointerup',     endDrag);
        divEl.addEventListener('pointercancel', endDrag);
        window.addEventListener('mouseup', function () { if (dragging) endDrag(null); });
    }
    window.addEventListener('resize', notifyChartsResized);

    // ─── UI wiring ───────────────────────────────────────────────────────
    layoutSel.addEventListener('change', function () { applyLayout(layoutSel.value); });

    function setSyncMode() {
        if (!manager) return;
        manager.setSyncMode({
            crosshair:    document.getElementById('sync-crosshair').checked,
            visibleRange: document.getElementById('sync-visible').checked,
            symbol:       document.getElementById('sync-symbol').checked,
        });
        saveSession();
    }
    document.getElementById('sync-crosshair').addEventListener('change', setSyncMode);
    document.getElementById('sync-visible').addEventListener('change', setSyncMode);
    document.getElementById('sync-symbol').addEventListener('change', setSyncMode);

    document.getElementById('self-test').addEventListener('click', function () {
        if (manager) manager.runGuardSelfTest();
    });

    document.getElementById('diagnose').addEventListener('click', function () {
        if (!manager) { alert('No manager'); return; }
        const charts = manager.getCharts();
        const lines = [];
        lines.push('=== TALARIA MULTICHART DIAGNOSE ===');
        lines.push('Layout selected: ' + layoutSel.value);
        lines.push('Charts in manager: ' + charts.length);
        lines.push('Counters: ' + JSON.stringify(manager.counters));
        lines.push('Guards: ' + (window.MultichartGuards ? window.MultichartGuards.VERSION : 'NOT LOADED'));
        lines.push('');
        for (const c of charts) {
            lines.push('  ' + c.id + ': ready=' + c.ready
                + ' iframe=' + (c.frame && c.frame.src ? c.frame.src : 'NONE'));
            lines.push('    state=' + JSON.stringify(c.state));
        }
        const txt = lines.join('\n');
        console.log(txt);
        appendLog({ ts: Date.now(), level: 'info', text: txt });
    });

    document.getElementById('reset-session').addEventListener('click', function () {
        if (!confirm('Clear saved layout + sync settings from this browser?')) return;
        try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
        location.reload();
    });

    // ─── Log panel toggle ────────────────────────────────────────────────
    (function () {
        const appEl = document.querySelector('.app');
        const btn = document.getElementById('toggle-log');
        function apply(visible) {
            if (visible) {
                appEl.classList.remove('log-collapsed');
                btn.textContent = 'Hide log';
            } else {
                appEl.classList.add('log-collapsed');
                btn.textContent = 'Show log';
            }
            try { window.dispatchEvent(new Event('resize')); } catch (_) {}
            saveSession();
        }
        // Default: collapsed (production users don't need the log).
        // Developers can toggle it on; state persists.
        btn.addEventListener('click', function () {
            const next = appEl.classList.contains('log-collapsed');
            apply(next);
        });
        // Restore from session below in boot.
        window.__applyLogVisible = apply;
    })();

    // ─── Boot ────────────────────────────────────────────────────────────
    // Optional debug mode toggled via ?debug=1 on shell URL.
    (function () {
        const p = new URLSearchParams(location.search);
        if (p.get('debug') === '1') {
            window.__multichartDebug = true;
            appendLog({ ts: Date.now(), level: 'info', text: 'debug mode ON (?debug=1) — bridge verbose, log visible' });
            window.__applyLogVisible(true);
        }
        // Optional ?layout=... URL override
        const lp = p.get('layout');
        if (lp && LAYOUTS[lp]) layoutSel.value = lp;
    })();

    const __session = loadSession();
    if (__session) {
        try {
            if (__session.layout && LAYOUTS[__session.layout]) {
                layoutSel.value = __session.layout;
            }
            if (__session.syncMode) {
                if (typeof __session.syncMode.crosshair === 'boolean')
                    document.getElementById('sync-crosshair').checked = __session.syncMode.crosshair;
                if (typeof __session.syncMode.visibleRange === 'boolean')
                    document.getElementById('sync-visible').checked = __session.syncMode.visibleRange;
                if (typeof __session.syncMode.symbol === 'boolean')
                    document.getElementById('sync-symbol').checked = __session.syncMode.symbol;
            }
            if (typeof __session.logVisible === 'boolean' && window.__applyLogVisible) {
                window.__applyLogVisible(__session.logVisible);
            }
            appendLog({ ts: Date.now(), level: 'info',
                text: 'session-restore: layout=' + layoutSel.value
                    + ' (file/tf state lives inside each dist-v9 iframe via its own React state)' });
        } catch (e) {
            appendLog({ ts: Date.now(), level: 'warn',
                text: 'session-restore failed: ' + (e && e.message || e) });
        }
    }

    appendLog({ ts: Date.now(), level: 'info',
        text: 'Talaria Multichart v1 — guards ' + (window.MultichartGuards ? window.MultichartGuards.VERSION : '?')
            + ' — each panel loads /chart/dist-v9/?multichart=1 (full Talaria chart)' });

    applyLayout(layoutSel.value);
})();
</script>
</body>
</html>
