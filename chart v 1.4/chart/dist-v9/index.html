<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talaria — V9 Live</title>
    <script>
    (function () {
        try {
            var p = new URLSearchParams(window.location.search);
            var m = p.get('mode');
            if (m === 'backtest' || m === 'propfirm') document.documentElement.classList.add('bt-preload');
        } catch (e) {}
    })();
    </script>

    <!-- ──────────────────────────────────────────────────────────────────
         MULTICHART EMBED SHIM (Phase 7.2.1 foundation — SOURCE OF TRUTH)
         `npm run build:live` ships this to chart/dist-v9/index.html, then
         sync-v9-to-homepage.mjs mirrors it to homepage/public/chart/dist-v9.
         FULLY GATED on ?multichart=1 — no-op on plain /chart/.
         When present (only inside future MultichartGrid iframes from Phase
         7.2.2), hides [data-v9-chrome="1"] chrome and loads the verified
         bridge stack from /chart/multichart-prod/.
         ────────────────────────────────────────────────────────────────── -->
    <script>
    (function () {
        try {
            var p = new URLSearchParams(window.location.search);
            if (p.get('multichart') !== '1') return;
            document.documentElement.classList.add('multichart-embed');
            // Defense in depth: even though MultichartGrid no longer forwards
            // mode=backtest|propfirm into iframe panels, strip bt-preload here
            // in case anything else (legacy code, future regressions) sets it.
            // Without this strip the bt-preload script's css rule
            //   html.bt-preload #root { visibility: hidden; }
            // would keep the React tree invisible and the #backtestingLoader
            // splash (the "Talaria-Log" loading screen) would cover every
            // panel for ~1-2s while the per-iframe autoLoadBacktestingData
            // pipeline runs. We don't want either inside multichart panels.
            try { document.documentElement.classList.remove('bt-preload'); } catch (_) {}
            var styleEl = document.createElement('style');
            styleEl.id = 'multichart-embed-style';
            styleEl.textContent = [
                'html.multichart-embed [data-v9-chrome="1"] { display: none !important; }',
                'html.multichart-embed body { background: #07080E !important; }',
                'html.multichart-embed #root { padding: 0 !important; margin: 0 !important; visibility: visible !important; }',
                /* Force the splash overlay off in iframe panels regardless of any later
                   class additions (chart.js can re-add active to #backtestingLoader). */
                'html.multichart-embed #backtestingLoader,',
                'html.multichart-embed #backtestingLoader.active { display: none !important; }',
            ].join('\n');
            document.head.appendChild(styleEl);
            document.addEventListener('DOMContentLoaded', function () {
                document.body.classList.add('multichart-embed');
                /* Belt-and-suspenders: if bt-preload got re-added between the head
                   strip above and DOMContentLoaded (race with the bt-preload script
                   in some load orders), strip it again now. */
                try { document.documentElement.classList.remove('bt-preload'); } catch (_) {}
            }, { once: true });
            var V = '20260515T1800';
            function inject(src) {
                var s = document.createElement('script');
                s.src = src + '?v=' + V;
                // Dynamic scripts default to async=true → execution order is NOT guaranteed.
                // sync-bridge.js requires MultichartGuards from engine-api-guards.js first.
                s.async = false;
                document.head.appendChild(s);
            }
            inject('/chart/multichart-prod/engine-api-guards.js');
            inject('/chart/multichart-prod/sync-bridge.js');
            inject('/chart/multichart-prod/embed-bridge.js');
            // Phase 7.2.4: per-panel command receiver. Listens for
            // `panel-cmd` postMessages from the parent topbar (timeframe
            // buttons, file picker, future indicator/drawing commands)
            // and applies them to this iframe's window.chart.
            inject('/chart/multichart-prod/panel-cmd-bridge.js');
        } catch (e) {
            try { console.error('[multichart-shim] failed:', e); } catch (_) {}
        }
    })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Zain:wght@200;300;400;700;800;900&display=swap"
          rel="stylesheet" />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #07080E; }

        /* Single-layout default for main tiles. Multi-panel: panel-manager.applyLayout() sets
           width/height/left/top as INLINE styles — React must not own #chartWrapper geometry or
           each re-render replaces the whole style attribute and drops panel placement (wrapper
           goes full #chart-container and paints over #panels-container → duplicate main UI). */
        #chartWrapper.chart-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* Canvas + drawing-svg sit inside the V9 chart-area div.
           They fill their parent so chart.js renders into the available space.
           Pointer events stay on the canvas; SVG is for drawings only. */
        #chartCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            background: transparent;
        }
        /* Drawing overlay — layout only here; pointer-events + z-index are driven by chart.js / drawingToolsManager
           (see DrawingManager._updateAxisZonePointerEvents, Chart.updateSVGPointerEvents). */
        #drawingSvg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: visible;
        }
        #drawingSvg.drawing {
            pointer-events: all;
            cursor: crosshair;
        }
        /* Drawing hover: do not mirror old line/rect/circle :hover + drop-shadow (sub-element
           flash + jank). Selection + resize handles are driven in JS (drawing-tools-manager). */
        #chart-container #drawingSvg text {
            transition: opacity 0.15s ease;
            user-select: none;
        }
        #priceAxisZone, #timeAxisZone {
            position: absolute;
            background: transparent;
            z-index: 5;
        }
        /* Match chart.js margin (30px bottom). Time strip = grab zone only — thin so canvas labels
           sit above it (Chromium can occlude fillText under a full-width transparent sibling). */
        /* Narrow strip — canvas draws price labels in the 60px margin; full-width overlay hid them in Chromium. */
        #priceAxisZone { right: 0; top: 5px; bottom: 30px; width: 14px; cursor: ns-resize; }
        #timeAxisZone  { left: 0; right: 60px; bottom: 0; height: 10px; cursor: ew-resize; }

        /* ──────────────────────────────────────────────────────────────
           Crosshair + price/time labels.
           chart.js scopes those nodes to `canvas.parentElement` (same as legacy
           chart-wrapper): never use `document.querySelector` for crosshair DOM,
           because V9 puts `#panels-container` before `#chartWrapper` — the first
           match would be a panel slot and mouse coords (main canvas) would
           misalign. The styling here mirrors legacy chart/index.html.
           ────────────────────────────────────────────────────────────── */
        .crosshair-vertical,
        .crosshair-horizontal {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        .crosshair-vertical {
            width: 1px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(150, 155, 165, 0.8) 0px,
                rgba(150, 155, 165, 0.8) 6px,
                transparent 6px,
                transparent 10px
            );
        }
        .crosshair-horizontal {
            width: 100%;
            height: 1px;
            background: repeating-linear-gradient(
                to right,
                rgba(150, 155, 165, 0.8) 0px,
                rgba(150, 155, 165, 0.8) 6px,
                transparent 6px,
                transparent 10px
            );
        }
        .price-label,
        .time-label {
            position: absolute;
            background: #434651;
            color: #ffffff;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 2px;
            pointer-events: none;
            z-index: 20;
            display: none;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0.2px;
        }
        .time-label {
            bottom: 6px;
            top: auto !important;
        }

        /* ── Multi-panel selection ring + resize handles (mirror chart/legacy-index.html) ──
           panel-manager adds .panel-selected, .panel-selection-frame, .panel-resize-handle */
        /* Exclude .panel-resize-handle — #chart-container * loses borders via border:none !important,
           which strips the thin side borders that widen the grab hit area (legacy keeps handles usable).
           Also exclude the V9 multi-panel focus frame ([data-multichart-focus-frame]) and the legacy
           per-iframe focus border ([data-multichart-focus-border]) — see MultichartGrid.jsx. Without
           these exclusions the unified blue selection ring (3px solid #2962ff + outer/inset glow)
           that React paints over the focused panel was being stripped, so clicking a panel showed
           no visual "this is selected" state. */
        #chart-container canvas,
        #chart-container *:not(.panel-resize-handle):not([data-multichart-focus-frame]):not([data-multichart-focus-border]) {
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }

        /* ── Forced visibility for the V9 unified focus frame ──
           Belt-and-suspenders: even if the strip rule above ever matches the
           focus overlay because of a future selector regression, the
           [data-multichart-focus-frame] / [data-multichart-focus-border]
           elements WILL still paint their TradingView-style blue ring. These
           rules are intentionally id-anchored at #chart-container so they win
           against the universal selector strip rule by specificity alone, and
           they come AFTER the strip rule in source order, so on specificity
           ties they win the cascade. */
        #chart-container [data-multichart-focus-frame],
        #chart-container [data-multichart-focus-border] {
            border: 3px solid #2962ff !important;
            box-shadow:
                0 0 0 1px #2962ff,
                0 0 8px 2px rgba(41, 98, 255, 0.55),
                inset 0 0 8px rgba(41, 98, 255, 0.30) !important;
            outline: none !important;
            pointer-events: none !important;
            box-sizing: border-box !important;
        }

        .panel-select-bar {
            display: none;
        }
        #chart-container .panel-selected {
            position: relative;
            z-index: 6;
        }
        #chart-container .panel-selected::after {
            content: '';
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border: 3px solid rgba(65, 154, 255, 0.84) !important;
            box-shadow: inset 0 0 0 1px rgba(65, 154, 255, 0.24), 0 0 10px rgba(41, 98, 255, 0.32) !important;
            border-radius: 2px;
            pointer-events: none;
            z-index: 5000;
        }
        #chart-container > .panel-selection-frame {
            position: absolute;
            border: 3px solid rgba(65, 154, 255, 0.84) !important;
            box-shadow: 0 0 10px rgba(41, 98, 255, 0.32) !important;
            border-radius: 2px;
            pointer-events: none;
            box-sizing: border-box;
            z-index: 250;
        }
        .chart-panel,
        #chartWrapper {
            border: none !important;
            box-sizing: border-box !important;
            overflow: hidden;
        }
        .panel-resize-handle {
            position: absolute;
            z-index: 200;
            pointer-events: auto;
            transition: background-color 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }
        .panel-resize-handle.vertical {
            cursor: col-resize;
            width: 1.875px;
            transform: translateX(-0.9375px);
            background: transparent;
            border-left: 0.75px solid transparent;
            border-right: 0.75px solid transparent;
            border-top: none;
            border-bottom: none;
            box-sizing: border-box;
            background-clip: content-box;
            background-color: #ffffff;
        }
        .panel-resize-handle.horizontal {
            cursor: row-resize;
            height: 1.875px;
            transform: translateY(-0.9375px);
            background: transparent;
            border-top: 0.75px solid transparent;
            border-bottom: 0.75px solid transparent;
            border-left: none;
            border-right: none;
            box-sizing: border-box;
            background-clip: content-box;
            background-color: #ffffff;
        }
        .panel-resize-handle.vertical:hover {
            background-color: #ffffff;
            box-shadow: 0 0 0 1px rgba(41, 98, 255, 0.55), 0 0 14px rgba(41, 98, 255, 0.85) !important;
            filter: drop-shadow(0 0 8px rgba(41, 98, 255, 0.8)) !important;
        }
        .panel-resize-handle.horizontal:hover {
            background-color: #ffffff;
            box-shadow: 0 0 0 1px rgba(41, 98, 255, 0.55), 0 0 14px rgba(41, 98, 255, 0.85) !important;
            filter: drop-shadow(0 0 8px rgba(41, 98, 255, 0.8)) !important;
        }
        #chart-container .panel-resize-handle.vertical:hover,
        #chart-container .panel-resize-handle.horizontal:hover {
            box-shadow: 0 0 0 1px rgba(41, 98, 255, 0.55), 0 0 14px rgba(41, 98, 255, 0.85) !important;
            filter: drop-shadow(0 0 8px rgba(41, 98, 255, 0.8)) !important;
        }
        .panel-resize-handle.vertical.dragging {
            background-color: #2962ff !important;
        }
        .panel-resize-handle.horizontal.dragging {
            background-color: #2962ff !important;
        }
        body.light-mode .panel-resize-handle.vertical,
        body.light-mode .panel-resize-handle.horizontal {
            background-color: #ffffff;
        }
        body.light-mode .panel-resize-handle.vertical:hover,
        body.light-mode .panel-resize-handle.horizontal:hover {
            background-color: #ffffff;
        }
        body.light-mode .panel-resize-handle.vertical.dragging,
        body.light-mode .panel-resize-handle.horizontal.dragging {
            background-color: #2962ff !important;
        }

        /* Multi-panel + main #chartWrapper: same OHLC layout as panel-manager (chart.js updates these).
           Panel .panel-canvas is z-index:1 — OHLC needs stacking above canvas. */
        #chart-container #chartWrapper .ohlc-info,
        #panels-container .panel-chart-container .ohlc-info {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #d1d4dc;
            pointer-events: none;
            box-sizing: border-box;
            /* max-width set per-frame in chart.js (_syncOhlcLegendMaxWidth) so legend stays left of price axis */
            max-width: min(560px, calc(100% - 96px));
        }
        #chart-container #chartWrapper .ohlc-header,
        #panels-container .ohlc-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-symbol-block,
        #panels-container .ohlc-symbol-block {
            flex: 0 0 auto;
        }
        #chart-container #chartWrapper .ohlc-stats,
        #panels-container .ohlc-stats {
            position: relative;
            display: flex;
            align-items: center;
            flex: 0 1 auto;
            min-width: 0;
            max-width: 100%;
            flex-wrap: nowrap;
            gap: 0;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-stats-flow,
        #panels-container .ohlc-stats-flow {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 6px;
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-item,
        #panels-container .ohlc-item {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        #chart-container #chartWrapper .ohlc-item-close-change,
        #panels-container .ohlc-item-close-change {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-item-close-change .ohlc-change,
        #panels-container .ohlc-item-close-change .ohlc-change {
            margin-left: 0;
            width: 14ch;
            min-width: 14ch;
            flex: 0 0 14ch;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
            box-sizing: border-box;
        }

        /* Legend collapse control below studies; expanded chevron ^ , collapsed v */
        #chart-container #chartWrapper .ohlc-legend-footer,
        #panels-container .ohlc-legend-footer {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 3px;
            padding: 0;
            pointer-events: auto;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron,
        #panels-container .ohlc-legend-chevron {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            margin: 0;
            padding: 2px 4px;
            background: transparent;
            color: #787b86;
            cursor:default;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            line-height: 0;
            flex-shrink: 0;
            pointer-events: auto;
            opacity: 0.88;
            transition: color 0.12s, background 0.12s, opacity 0.12s;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron:hover,
        #panels-container .ohlc-legend-chevron:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #b2b5be;
            opacity: 1;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron svg,
        #panels-container .ohlc-legend-chevron svg {
            width: 13px;
            height: 13px;
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }
        #chart-container #chartWrapper .ohlc-info:not(.collapsed) .ohlc-legend-chevron svg,
        #panels-container .ohlc-info:not(.collapsed) .ohlc-legend-chevron svg {
            transform: rotate(180deg);
        }
        #chart-container #chartWrapper .ohlc-info.collapsed .ohlc-legend-chevron svg,
        #panels-container .ohlc-info.collapsed .ohlc-legend-chevron svg {
            transform: rotate(0deg);
        }
        #chart-container #chartWrapper .ohlc-info.collapsed .ohlc-body,
        #panels-container .ohlc-info.collapsed .ohlc-body {
            display: none !important;
        }

        /* chart.js loads FlagCDN `w80` PNGs into #ohlcSymbolDot / #ohlcSymbolDot1 … */
        #chart-container #chartWrapper .ohlc-symbol-dot,
        #panels-container .ohlc-symbol-dot {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            background: rgba(255, 198, 0, 0.18);
            border: 1px solid rgba(255, 198, 0, 0.45);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            vertical-align: middle;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-symbol-dot.ohlc-dot-flags,
        #panels-container .ohlc-symbol-dot.ohlc-dot-flags {
            width: 29px;
            height: 16px;
            border-radius: 0;
            background: none;
            border: none;
            position: relative;
            overflow: visible;
        }
        #chart-container #chartWrapper .ohlc-dot-flag,
        #panels-container .ohlc-dot-flag {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
            box-sizing: border-box;
            pointer-events: none;
        }
        #chart-container #chartWrapper .ohlc-dot-flag-base,
        #panels-container .ohlc-dot-flag-base {
            left: 0;
            top: 0;
            z-index: 2;
        }
        #chart-container #chartWrapper .ohlc-dot-flag-quote,
        #panels-container .ohlc-dot-flag-quote {
            left: 11px;
            top: 0;
            z-index: 1;
        }

        /* Replay rollback: fixed 32px column after OHLC flow — icon does not slide when %/change text grows (chart.js sets #ohlc-info width). */
        #chart-container #chartWrapper .ohlc-nav-badge-slot,
        #panels-container .ohlc-nav-badge-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: visible;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-nav-badge-slot .nav-integrity-badge,
        #panels-container .ohlc-nav-badge-slot .nav-integrity-badge {
            position: relative !important;
            right: auto !important;
            top: auto !important;
            transform: none !important;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: 0 !important;
            cursor: default;
            pointer-events: auto;
            z-index: 2;
        }
        #chart-container #chartWrapper .nav-badge-icon,
        #panels-container .nav-badge-icon {
            position: relative;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            box-sizing: border-box;
            border-radius: 50%;
            border: 1.5px solid currentColor;
            background: rgba(0, 0, 0, 0.15);
        }
        #chart-container #chartWrapper .nav-badge-go-back,
        #panels-container .nav-badge-go-back {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            display: block;
        }
        #chart-container #chartWrapper .nav-integrity-badge.enabled .nav-badge-icon,
        #panels-container .nav-integrity-badge.enabled .nav-badge-icon {
            color: #f87171;
        }
        #chart-container #chartWrapper .nav-integrity-badge.disabled .nav-badge-icon,
        #panels-container .nav-integrity-badge.disabled .nav-badge-icon {
            color: #4ade80;
        }
        /* Replay nav hint — same chrome as path brush hint + Objects Tree panel (V9 sliding panel). */
        #chart-container #chartWrapper .nav-badge-tooltip,
        #panels-container .nav-badge-tooltip {
            position: fixed;
            left: 50%;
            bottom: 50px;
            top: auto;
            transform: translateX(-50%);
            margin: 0;
            padding: 10px 18px 9px 14px;
            overflow: hidden;
            background: var(--sp-bg, #0a0c14);
            color: var(--sp-text, rgba(255, 255, 255, 0.92));
            border: 1px solid rgba(140, 160, 255, 0.22);
            border-left: 3px solid rgba(74, 106, 255, 0.95);
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: 0.02em;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            white-space: nowrap;
            z-index: 10001;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.12s, visibility 0.12s;
        }
        #chart-container #chartWrapper .nav-badge-tooltip::after,
        #panels-container .nav-badge-tooltip::after {
            display: none;
        }
        #chart-container #chartWrapper .nav-badge-tooltip::before,
        #panels-container .nav-badge-tooltip::before {
            display: block;
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 2px;
            background: linear-gradient(90deg, rgba(38, 67, 247, 1), rgba(74, 106, 255, 1), rgba(38, 67, 247, 1));
            pointer-events: none;
        }
        #chart-container #chartWrapper .nav-integrity-badge:hover .nav-badge-tooltip,

      ─────────────────────────────────────────────────────────────────────
      AUTH BOOTSTRAP + userStorage SHIM
      ─────────────────────────────────────────────────────────────────────
      These two inline scripts mirror chart/index.html exactly. They MUST
      run synchronously before any deferred module so `window.userStorage`
      is defined when chart.js, drawing-tools-manager, favorites-manager,
      keyboard-shortcuts, etc. call `userStorage.getItem(...)` at load time.
      Without them every module logs "ReferenceError: userStorage is not
      defined" and fails to initialize.
    -->
    <script>
    // 1. Auth check: confirm user is logged in; store user id in localStorage
    //    so userStorage's per-user key prefix works. Redirects to /login on 401.
    (function() {
        function redirectToLogin() {
            var next = window.location.pathname + window.location.search;
            var loginUrl = '/login/?next=' + encodeURIComponent(next);
            try {
                if (window.top && window.top !== window.self) {
                    window.top.location.href = loginUrl;
                    return;
                }
            } catch (e) {}
            window.location.href = loginUrl;
        }
        fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' })
            .then(function(res) {
                if (!res.ok) { redirectToLogin(); return null; }
                return res.json();
            })
            .then(function(data) {
                if (data && data.user && data.user.id) {
                    window.__talariaUserId = data.user.id;
                    try { localStorage.setItem('_uid', String(data.user.id)); } catch(e) {}
                }
            })
            .catch(function() { redirectToLogin(); });
    })();
    </script>
    <script>
    // 2. Per-user localStorage isolation. All user-specific data is prefixed
    //    with the user ID so different accounts on the same browser stay separate.
    (function() {
        var uid = null;
        try { uid = localStorage.getItem('_uid'); } catch(e) {}

        window.userKey = function(key) {
            var id = uid || window.__talariaUserId;
            if (!id) { try { id = localStorage.getItem('_uid'); } catch(e) {} }
            if (id) { uid = id; return 'u' + id + '_' + key; }
            return key;
        };

        window.userStorage = {
            getItem: function(key) {
                var scoped = localStorage.getItem(window.userKey(key));
                if (scoped !== null) return scoped;
                // Migrate: check legacy un-scoped key
                var legacy = localStorage.getItem(key);
                if (legacy !== null && uid) {
                    try { localStorage.setItem(window.userKey(key), legacy); localStorage.removeItem(key); } catch(e) {}
                }
                return legacy;
            },
            setItem: function(key, val) { localStorage.setItem(window.userKey(key), val); },
            removeItem: function(key) { localStorage.removeItem(window.userKey(key)); }
        };
    })();
    </script>

        var target = document.getElementById("loaderTypedQuote");
        var cursor = document.getElementById("loaderQuoteCursor");
        if (!target) {

          try { window.dispatchEvent(new Event("talariaLoaderTypingDone")); } catch (e) {}
          return;

        var i = 0;
        var stepMs = 28;

            var hasCls = (typeof ScreenshotManager !== 'undefined');

            if (!hasCls || !ch) {
