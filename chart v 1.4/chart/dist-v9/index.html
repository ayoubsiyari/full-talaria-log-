<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talaria — V9 Live</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Zain:wght@200;300;400;700;800;900&display=swap"
          rel="stylesheet" />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #07080E; }

        /* Canvas + drawing-svg sit inside the V9 chart-area div.
           They fill their parent so chart.js renders into the available space.
           Pointer events stay on the canvas; SVG is for drawings only. */
        #chartCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            background: transparent;
        }
        #drawingSvg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #priceAxisZone, #timeAxisZone {
            position: absolute;
            background: transparent;
            z-index: 5;
        }
        #priceAxisZone { right: 0; top: 0; bottom: 18px; width: 60px; cursor: ns-resize; }
        #timeAxisZone  { left: 0; right: 60px; bottom: 0; height: 18px; cursor: ew-resize; }

        /* ──────────────────────────────────────────────────────────────
           Crosshair + price/time labels.
           chart.js looks up `.crosshair-vertical/.crosshair-horizontal/
           .price-label/.time-label` in `document` for the main chart and
           positions them based on mouse coords. The styling here mirrors
           legacy chart/index.html so behaviour matches exactly.
           ────────────────────────────────────────────────────────────── */
        .crosshair-vertical,
        .crosshair-horizontal {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        .crosshair-vertical {
            width: 1px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(150, 155, 165, 0.8) 0px,
                rgba(150, 155, 165, 0.8) 6px,
                transparent 6px,
                transparent 10px
            );
        }
        .crosshair-horizontal {
            width: 100%;
            height: 1px;
            background: repeating-linear-gradient(
                to right,
                rgba(150, 155, 165, 0.8) 0px,
                rgba(150, 155, 165, 0.8) 6px,
                transparent 6px,
                transparent 10px
            );
        }
        .price-label,
        .time-label {
            position: absolute;
            background: #434651;
            color: #ffffff;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 2px;
            pointer-events: none;
            z-index: 20;
            display: none;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0.2px;
        }
        .time-label {
            bottom: 6px;
            top: auto !important;
        }
    </style>

    <!--
      ─────────────────────────────────────────────────────────────────────
      AUTH BOOTSTRAP + userStorage SHIM
      ─────────────────────────────────────────────────────────────────────
      These two inline scripts mirror chart/index.html exactly. They MUST
      run synchronously before any deferred module so `window.userStorage`
      is defined when chart.js, drawing-tools-manager, favorites-manager,
      keyboard-shortcuts, etc. call `userStorage.getItem(...)` at load time.
      Without them every module logs "ReferenceError: userStorage is not
      defined" and fails to initialize.
    -->
    <script>
    // 1. Auth check: confirm user is logged in; store user id in localStorage
    //    so userStorage's per-user key prefix works. Redirects to /login on 401.
    (function() {
        function redirectToLogin() {
            var next = window.location.pathname + window.location.search;
            var loginUrl = '/login/?next=' + encodeURIComponent(next);
            try {
                if (window.top && window.top !== window.self) {
                    window.top.location.href = loginUrl;
                    return;
                }
            } catch (e) {}
            window.location.href = loginUrl;
        }
        fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' })
            .then(function(res) {
                if (!res.ok) { redirectToLogin(); return null; }
                return res.json();
            })
            .then(function(data) {
                if (data && data.user && data.user.id) {
                    window.__talariaUserId = data.user.id;
                    try { localStorage.setItem('_uid', String(data.user.id)); } catch(e) {}
                }
            })
            .catch(function() { redirectToLogin(); });
    })();
    </script>
    <script>
    // 2. Per-user localStorage isolation. All user-specific data is prefixed
    //    with the user ID so different accounts on the same browser stay separate.
    (function() {
        var uid = null;
        try { uid = localStorage.getItem('_uid'); } catch(e) {}

        window.userKey = function(key) {
            var id = uid || window.__talariaUserId;
            if (!id) { try { id = localStorage.getItem('_uid'); } catch(e) {} }
            if (id) { uid = id; return 'u' + id + '_' + key; }
            return key;
        };

        window.userStorage = {
            getItem: function(key) {
                var scoped = localStorage.getItem(window.userKey(key));
                if (scoped !== null) return scoped;
                // Migrate: check legacy un-scoped key
                var legacy = localStorage.getItem(key);
                if (legacy !== null && uid) {
                    try { localStorage.setItem(window.userKey(key), legacy); localStorage.removeItem(key); } catch(e) {}
                }
                return legacy;
            },
            setItem: function(key, val) { localStorage.setItem(window.userKey(key), val); },
            removeItem: function(key) { localStorage.removeItem(window.userKey(key)); }
        };
    })();
    </script>

    <!--
      D3 must load before chart.js. We use waitForD3 promise to coordinate;
      chart.js awaits this in its init function.
    -->
    <script>
        window.waitForD3 = new Promise((resolve, reject) => {
            window.__resolveD3 = resolve;
            window.__rejectD3  = reject;
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            onload="window.__resolveD3 && window.__resolveD3();"
            onerror="window.__rejectD3 && window.__rejectD3(new Error('d3 cdn failed'));"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <!-- ──────────────────────────────────────────────────────────────────
         All chart scripts are loaded with `defer` so they execute in
         source order AFTER HTML parsing but BEFORE DOMContentLoaded.
         This gives chart.js's init handler the right canvas DOM by the
         time it runs (React's main.jsx is also deferred).
         ────────────────────────────────────────────────────────────── -->

    <!-- Tier A — pure helpers (no DOM dependencies). -->
    <script defer src="/chart/modules/preferences-init.js"></script>
    <script defer src="/chart/modules/preferences-sync.js"></script>
    <script defer src="/chart/modules/market-calculations.js"></script>
    <script defer src="/chart/modules/chart-env.defaults.js"></script>
    <script defer src="/chart/modules/chart-env.generated.js"></script>

    <!-- Drawing tool base classes + individual tool registrations.
         Order matters within this block:
         - drawing-tools-base.js defines the base Tool class.
         - Each drawing-tools-*.js registers tools into the global registry.
         - drawing-tools-ui.js provides shared UI helpers used by tools.
         - drawing-tools-manager.js orchestrates everything (loaded later). -->
    <script defer src="/chart/modules/drawing-tools-base.js"></script>
    <script defer src="/chart/modules/drawing-tools-lines.js"></script>
    <script defer src="/chart/modules/drawing-tools-shapes.js"></script>
    <script defer src="/chart/modules/drawing-tools-fibonacci.js"></script>
    <script defer src="/chart/modules/drawing-tools-text.js"></script>
    <script defer src="/chart/modules/drawing-tools-emoji.js"></script>
    <script defer src="/chart/modules/drawing-tools-image.js"></script>
    <script defer src="/chart/modules/emoji-picker.js"></script>
    <script defer src="/chart/modules/emoji-picker-simple.js"></script>
    <script defer src="/chart/modules/drawing-tools-advanced-volume.js"></script>
    <script defer src="/chart/modules/drawing-tools-advanced.js"></script>
    <script defer src="/chart/modules/drawing-tools-extended.js"></script>
    <script defer src="/chart/modules/drawing-tools-patterns.js"></script>
    <script defer src="/chart/modules/drawing-tools-fib-gann.js"></script>
    <script defer src="/chart/modules/drawing-tools-channels.js"></script>
    <script defer src="/chart/modules/drawing-tools-ui.js"></script>

    <!-- Drawing-tool support (color picker, toolbar UI, undo/redo). -->
    <script defer src="/chart/modules/color-picker.js"></script>
    <script defer src="/chart/modules/drawing-toolbar.js"></script>
    <script defer src="/chart/modules/undo-redo-manager.js"></script>

    <!-- Drawing-tools manager — orchestrator. Must load AFTER all individual
         drawing-tools-*.js so the registry is populated before init. -->
    <script defer src="/chart/modules/drawing-tools-manager.js"></script>
    <script defer src="/chart/modules/favorites-manager.js"></script>
    <script defer src="/chart/modules/keyboard-shortcuts.js"></script>

    <!-- Chart engine.
         chart.js exposes window.Chart synchronously and window.initializeChart
         as a callable. Its DOMContentLoaded handler fires after main.jsx has
         mounted React (deferred too), so the #chartCanvas element exists. -->
    <script defer src="/chart/chart.js"></script>

    <!-- Replay system — must load AFTER chart.js (depends on it). -->
    <script defer src="/chart/modules/replay-system.js"></script>

    <!-- Indicators: extend Chart.prototype, must load after chart.js. -->
    <script defer src="/chart/modules/chart-indicators-full.js"></script>
  <script type="module" crossorigin src="/chart/dist-v9/assets/index-CjKM2Y4o.js"></script>
</head>
<body>
    <div id="root"></div>
    <!-- Module scripts are deferred too, so this runs AFTER all defers above. -->
</body>
</html>
