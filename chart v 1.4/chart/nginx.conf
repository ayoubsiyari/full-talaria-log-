events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting — keep auth strict; chart/backtest data needs far higher headroom
    # (candle/smart/session bursts are normal product traffic, not attacks).
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=chart_data:10m rate=120r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream for the trading chart app
    upstream trading_chart {
        server trading-chart:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security headers (HTTP listener — no HSTS / upgrade-insecure-requests)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

        # Max upload size for CSV files
        client_max_body_size 100M;

        # Auth endpoints (stricter rate limiting)
        location ^~ /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://trading_chart;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Chart / backtest / candle paths — generous product limits (not security).
        location ^~ /api/file/ {
            limit_req zone=chart_data burst=200 nodelay;
            proxy_pass http://trading_chart;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }

        location ^~ /api/sessions/ {
            limit_req zone=chart_data burst=200 nodelay;
            proxy_pass http://trading_chart;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }

        location ^~ /api/analytics/backtest/ {
            limit_req zone=chart_data burst=200 nodelay;
            proxy_pass http://trading_chart;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }

        # Other API routes — stricter general limit
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://trading_chart;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files and HTML
        location / {
            proxy_pass http://trading_chart;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Versioned JS/CSS (query string v=... handles busting) — cache 7 days
            location ~* \.(js|css)$ {
                proxy_pass http://trading_chart;
                add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
                add_header Vary "Accept-Encoding";
            }

            # HTML — no-store, not merely no-cache. LIFE-3-BFCACHE-DEFEAT-V1: no-cache still permits the
            # browser to park the document in the back/forward cache, which keeps a whole chart engine
            # and its bitmaps resident behind a Back button. no-store makes the page bfcache-ineligible.
            # proxy_hide_header first so the app's own Cache-Control does not arrive alongside this one —
            # two Cache-Control headers is an ambiguity, not a stricter policy.
            location ~* \.html$ {
                proxy_pass http://trading_chart;
                proxy_hide_header Cache-Control;
                proxy_hide_header Pragma;
                add_header Cache-Control "no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
            
            # Cache images and fonts only
            location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://trading_chart;
                proxy_cache_valid 200 7d;
                add_header Cache-Control "public, max-age=604800";
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://trading_chart/api/status;
        }
    }

    # HTTPS server (uncomment and configure for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     # Same location blocks as above...
    # }
}
