<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talaria — Page not found</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #07080e;
      color: #e8ecff;
    }
    .wrap { text-align: center; max-width: 520px; }
    .code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 28px;
      font-size: clamp(72px, 18vw, 112px);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: rgba(232, 236, 255, 0.78);
    }
    .logo {
      width: clamp(72px, 16vw, 108px);
      height: clamp(72px, 16vw, 108px);
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(74, 106, 255, 0.25));
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.15;
    }
    p {
      margin: 0 0 28px;
      font-size: 18px;
      line-height: 1.55;
      color: rgba(180, 190, 220, 0.88);
    }
    a.btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1e38e8, #4a6aff);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.03em;
      box-shadow: 0 2px 10px rgba(38, 67, 247, 0.35);
    }
    a.btn:hover { filter: brightness(1.08); }
    .hint {
      margin-top: 28px;
      font-size: 13px;
      color: rgba(140, 160, 200, 0.75);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code" aria-hidden="true">
      <span id="code-left">404</span>
      <img class="logo" src="/logo-04.png" alt="" />
      <span id="code-right">404</span>
    </div>
    <h1 id="title">Boo! Page missing!</h1>
    <p id="message">This page must be a ghost — it's not here.</p>
    <a class="btn" href="/">Back home</a>
    <p class="hint"><a id="wiki" href="https://en.wikipedia.org/wiki/HTTP_404" style="color:inherit">What does 404 mean?</a></p>
  </div>
  <script>
    (function () {
      var status = 404;
      var q = new URLSearchParams(window.location.search);
      if (q.get("status") === "403") status = 403;
      if (status === 403) {
        document.title = "Talaria — Access denied";
        document.getElementById("code-right").textContent = "3";
        document.getElementById("title").textContent = "Boo! Access denied!";
        document.getElementById("message").textContent = "You don't have permission to open this page.";
        var wiki = document.getElementById("wiki");
        wiki.href = "https://en.wikipedia.org/wiki/HTTP_403";
        wiki.textContent = "What does 403 mean?";
      }
    })();
  </script>
</body>
</html>
