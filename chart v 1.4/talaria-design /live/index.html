<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talaria — V9 Live</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Zain:wght@200;300;400;700;800;900&display=swap"
          rel="stylesheet" />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #07080E; }

        /* Canvas + drawing-svg sit inside the V9 chart-area div.
           They fill their parent so chart.js renders into the available space.
           Pointer events stay on the canvas; SVG is for drawings only. */
        #chartCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            background: transparent;
        }
        #drawingSvg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        /* Axis cursor zones — invisible event-capture overlays.
           chart.js forwards events from these to the canvas. */
        #priceAxisZone, #timeAxisZone {
            position: absolute;
            background: transparent;
            z-index: 5;
        }
        #priceAxisZone { right: 0; top: 0; bottom: 18px; width: 60px; cursor: ns-resize; }
        #timeAxisZone  { left: 0; right: 60px; bottom: 0; height: 18px; cursor: ew-resize; }
    </style>

    <!--
      Legacy chart engine.

      D3 must load before chart.js. chart.js exposes `window.Chart` synchronously
      and exposes `window.initializeChart()` that React calls in a useEffect
      after it mounts the #chartCanvas element.

      The /chart/* paths are proxied to the FastAPI backend in dev (see
      vite.config.live.js). In prod they're served by the same backend that
      hosts the V9 build at /chart/index.html.
    -->
    <script>
        // Tell chart.js to wait for d3 before initializing.
        window.waitForD3 = new Promise((resolve, reject) => {
            window.__resolveD3 = resolve;
            window.__rejectD3  = reject;
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            onload="window.__resolveD3 && window.__resolveD3();"
            onerror="window.__rejectD3 && window.__rejectD3(new Error('d3 cdn failed'));"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <!-- Tier A modules (no DOM coupling, just window globals). -->
    <script src="/chart/modules/preferences-init.js"></script>
    <script src="/chart/modules/preferences-sync.js"></script>
    <script src="/chart/modules/market-calculations.js"></script>
    <script src="/chart/modules/chart-env.defaults.js"></script>
    <script src="/chart/modules/chart-env.generated.js"></script>

    <!-- Chart engine.
         chart.js's DOMContentLoaded handler will fire once HTML is parsed,
         but #chartCanvas isn't in the DOM yet (React hasn't mounted). The
         handler bails safely when the canvas is missing; React then calls
         window.initializeChart() in a useEffect after mount. -->
    <script src="/chart/chart.js"></script>

    <!-- Indicators: must load AFTER chart.js because they extend Chart.prototype. -->
    <script src="/chart/modules/chart-indicators-full.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
</body>
</html>
