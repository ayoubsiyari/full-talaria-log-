<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talaria — V9 Live</title>
    <script>
    (function () {
        try {
            var p = new URLSearchParams(window.location.search);
            var m = p.get('mode');
            if (m === 'backtest' || m === 'propfirm') document.documentElement.classList.add('bt-preload');
        } catch (e) {}
    })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Zain:wght@200;300;400;700;800;900&display=swap"
          rel="stylesheet" />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #07080E; }

        /* Single-layout default for main tiles. Multi-panel: panel-manager.applyLayout() sets
           width/height/left/top as INLINE styles — React must not own #chartWrapper geometry or
           each re-render replaces the whole style attribute and drops panel placement (wrapper
           goes full #chart-container and paints over #panels-container → duplicate main UI). */
        #chartWrapper.chart-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* Canvas + drawing-svg sit inside the V9 chart-area div.
           They fill their parent so chart.js renders into the available space.
           Pointer events stay on the canvas; SVG is for drawings only. */
        #chartCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            background: transparent;
        }
        /* Drawing overlay — layout only here; pointer-events + z-index are driven by chart.js / drawingToolsManager
           (see DrawingManager._updateAxisZonePointerEvents, Chart.updateSVGPointerEvents). */
        #drawingSvg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: visible;
        }
        #drawingSvg.drawing {
            pointer-events: all;
            cursor: crosshair;
        }
        /* Drawing hover: do not mirror old line/rect/circle :hover + drop-shadow (sub-element
           flash + jank). Selection + resize handles are driven in JS (drawing-tools-manager). */
        #chart-container #drawingSvg text {
            transition: opacity 0.15s ease;
            user-select: none;
        }
        #priceAxisZone, #timeAxisZone {
            position: absolute;
            background: transparent;
            z-index: 5;
        }
        /* Match chart.js margin (30px bottom). Time strip = grab zone only — thin so canvas labels
           sit above it (Chromium can occlude fillText under a full-width transparent sibling). */
        /* Narrow strip — canvas draws price labels in the 60px margin; full-width overlay hid them in Chromium. */
        #priceAxisZone { right: 0; top: 5px; bottom: 30px; width: 14px; cursor: ns-resize; }
        #timeAxisZone  { left: 0; right: 60px; bottom: 0; height: 10px; cursor: ew-resize; }

        /* ──────────────────────────────────────────────────────────────
           Crosshair + price/time labels.
           chart.js scopes those nodes to `canvas.parentElement` (same as legacy
           chart-wrapper): never use `document.querySelector` for crosshair DOM,
           because V9 puts `#panels-container` before `#chartWrapper` — the first
           match would be a panel slot and mouse coords (main canvas) would
           misalign. The styling here mirrors legacy chart/index.html.
           ────────────────────────────────────────────────────────────── */
        .crosshair-vertical,
        .crosshair-horizontal {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        .crosshair-vertical {
            width: 1px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(150, 155, 165, 0.8) 0px,
                rgba(150, 155, 165, 0.8) 6px,
                transparent 6px,
                transparent 10px
            );
        }
        .crosshair-horizontal {
            width: 100%;
            height: 1px;
            background: repeating-linear-gradient(
                to right,
                rgba(150, 155, 165, 0.8) 0px,
                rgba(150, 155, 165, 0.8) 6px,
                transparent 6px,
                transparent 10px
            );
        }
        .price-label,
        .time-label {
            position: absolute;
            background: #434651;
            color: #ffffff;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 2px;
            pointer-events: none;
            z-index: 20;
            display: none;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0.2px;
        }
        .time-label {
            bottom: 6px;
            top: auto !important;
        }

        /* ── Multi-panel selection ring + resize handles (mirror chart/legacy-index.html) ──
           panel-manager adds .panel-selected, .panel-selection-frame, .panel-resize-handle */
        /* Exclude .panel-resize-handle — #chart-container * loses borders via border:none !important,
           which strips the thin side borders that widen the grab hit area (legacy keeps handles usable). */
        #chart-container canvas,
        #chart-container *:not(.panel-resize-handle) {
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        .panel-select-bar {
            display: none;
        }
        #chart-container .panel-selected {
            position: relative;
            z-index: 6;
        }
        #chart-container .panel-selected::after {
            content: '';
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border: 3px solid rgba(65, 154, 255, 0.84) !important;
            box-shadow: inset 0 0 0 1px rgba(65, 154, 255, 0.24), 0 0 10px rgba(41, 98, 255, 0.32) !important;
            border-radius: 2px;
            pointer-events: none;
            z-index: 5000;
        }
        #chart-container > .panel-selection-frame {
            position: absolute;
            border: 3px solid rgba(65, 154, 255, 0.84) !important;
            box-shadow: 0 0 10px rgba(41, 98, 255, 0.32) !important;
            border-radius: 2px;
            pointer-events: none;
            box-sizing: border-box;
            z-index: 250;
        }
        .chart-panel,
        #chartWrapper {
            border: none !important;
            box-sizing: border-box !important;
            overflow: hidden;
        }
        .panel-resize-handle {
            position: absolute;
            z-index: 200;
            pointer-events: auto;
            transition: background-color 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }
        .panel-resize-handle.vertical {
            cursor: col-resize;
            width: 1.875px;
            transform: translateX(-0.9375px);
            background: transparent;
            border-left: 0.75px solid transparent;
            border-right: 0.75px solid transparent;
            border-top: none;
            border-bottom: none;
            box-sizing: border-box;
            background-clip: content-box;
            background-color: #ffffff;
        }
        .panel-resize-handle.horizontal {
            cursor: row-resize;
            height: 1.875px;
            transform: translateY(-0.9375px);
            background: transparent;
            border-top: 0.75px solid transparent;
            border-bottom: 0.75px solid transparent;
            border-left: none;
            border-right: none;
            box-sizing: border-box;
            background-clip: content-box;
            background-color: #ffffff;
        }
        .panel-resize-handle.vertical:hover {
            background-color: #ffffff;
            box-shadow: 0 0 0 1px rgba(41, 98, 255, 0.55), 0 0 14px rgba(41, 98, 255, 0.85) !important;
            filter: drop-shadow(0 0 8px rgba(41, 98, 255, 0.8)) !important;
        }
        .panel-resize-handle.horizontal:hover {
            background-color: #ffffff;
            box-shadow: 0 0 0 1px rgba(41, 98, 255, 0.55), 0 0 14px rgba(41, 98, 255, 0.85) !important;
            filter: drop-shadow(0 0 8px rgba(41, 98, 255, 0.8)) !important;
        }
        #chart-container .panel-resize-handle.vertical:hover,
        #chart-container .panel-resize-handle.horizontal:hover {
            box-shadow: 0 0 0 1px rgba(41, 98, 255, 0.55), 0 0 14px rgba(41, 98, 255, 0.85) !important;
            filter: drop-shadow(0 0 8px rgba(41, 98, 255, 0.8)) !important;
        }
        .panel-resize-handle.vertical.dragging {
            background-color: #2962ff !important;
        }
        .panel-resize-handle.horizontal.dragging {
            background-color: #2962ff !important;
        }
        body.light-mode .panel-resize-handle.vertical,
        body.light-mode .panel-resize-handle.horizontal {
            background-color: #ffffff;
        }
        body.light-mode .panel-resize-handle.vertical:hover,
        body.light-mode .panel-resize-handle.horizontal:hover {
            background-color: #ffffff;
        }
        body.light-mode .panel-resize-handle.vertical.dragging,
        body.light-mode .panel-resize-handle.horizontal.dragging {
            background-color: #2962ff !important;
        }

        /* Multi-panel + main #chartWrapper: same OHLC layout as panel-manager (chart.js updates these).
           Panel .panel-canvas is z-index:1 — OHLC needs stacking above canvas. */
        #chart-container #chartWrapper .ohlc-info,
        #panels-container .panel-chart-container .ohlc-info {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #d1d4dc;
            pointer-events: none;
            box-sizing: border-box;
            /* max-width set per-frame in chart.js (_syncOhlcLegendMaxWidth) so legend stays left of price axis */
            max-width: min(560px, calc(100% - 96px));
        }
        #chart-container #chartWrapper .ohlc-header,
        #panels-container .ohlc-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        #chart-container #chartWrapper .ohlc-stats,
        #panels-container .ohlc-stats {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        #chart-container #chartWrapper .ohlc-item,
        #panels-container .ohlc-item {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        /* Legend collapse control below studies; expanded chevron ^ , collapsed v */
        #chart-container #chartWrapper .ohlc-legend-footer,
        #panels-container .ohlc-legend-footer {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 3px;
            padding: 0;
            pointer-events: auto;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron,
        #panels-container .ohlc-legend-chevron {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            margin: 0;
            padding: 2px 4px;
            background: transparent;
            color: #787b86;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            line-height: 0;
            flex-shrink: 0;
            pointer-events: auto;
            opacity: 0.88;
            transition: color 0.12s, background 0.12s, opacity 0.12s;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron:hover,
        #panels-container .ohlc-legend-chevron:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #b2b5be;
            opacity: 1;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron svg,
        #panels-container .ohlc-legend-chevron svg {
            width: 13px;
            height: 13px;
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }
        #chart-container #chartWrapper .ohlc-info:not(.collapsed) .ohlc-legend-chevron svg,
        #panels-container .ohlc-info:not(.collapsed) .ohlc-legend-chevron svg {
            transform: rotate(180deg);
        }
        #chart-container #chartWrapper .ohlc-info.collapsed .ohlc-legend-chevron svg,
        #panels-container .ohlc-info.collapsed .ohlc-legend-chevron svg {
            transform: rotate(0deg);
        }
        #chart-container #chartWrapper .ohlc-info.collapsed .ohlc-body,
        #panels-container .ohlc-info.collapsed .ohlc-body {
            display: none !important;
        }

        /* chart.js loads FlagCDN `w80` PNGs into #ohlcSymbolDot / #ohlcSymbolDot1 … */
        #chart-container #chartWrapper .ohlc-symbol-dot,
        #panels-container .ohlc-symbol-dot {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            background: rgba(255, 198, 0, 0.18);
            border: 1px solid rgba(255, 198, 0, 0.45);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            vertical-align: middle;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-symbol-dot.ohlc-dot-flags,
        #panels-container .ohlc-symbol-dot.ohlc-dot-flags {
            width: 29px;
            height: 16px;
            border-radius: 0;
            background: none;
            border: none;
            position: relative;
            overflow: visible;
        }
        #chart-container #chartWrapper .ohlc-dot-flag,
        #panels-container .ohlc-dot-flag {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
            box-sizing: border-box;
            pointer-events: none;
        }
        #chart-container #chartWrapper .ohlc-dot-flag-base,
        #panels-container .ohlc-dot-flag-base {
            left: 0;
            top: 0;
            z-index: 2;
        }
        #chart-container #chartWrapper .ohlc-dot-flag-quote,
        #panels-container .ohlc-dot-flag-quote {
            left: 11px;
            top: 0;
            z-index: 1;
        }

        /* Back/forward (navigation integrity) badge — last in .ohlc-stats after change % */
        #chart-container #chartWrapper .nav-integrity-badge,
        #panels-container .nav-integrity-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 0;
            cursor: default;
            pointer-events: auto;
        }
        #chart-container #chartWrapper .nav-badge-icon,
        #panels-container .nav-badge-icon {
            position: relative;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            box-sizing: border-box;
            border-radius: 50%;
            border: 1.5px solid currentColor;
            background: rgba(0, 0, 0, 0.15);
        }
        #chart-container #chartWrapper .nav-badge-go-back,
        #panels-container .nav-badge-go-back {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            display: block;
        }
        #chart-container #chartWrapper .nav-integrity-badge.enabled .nav-badge-icon,
        #panels-container .nav-integrity-badge.enabled .nav-badge-icon {
            color: #f87171;
        }
        #chart-container #chartWrapper .nav-integrity-badge.disabled .nav-badge-icon,
        #panels-container .nav-integrity-badge.disabled .nav-badge-icon {
            color: #4ade80;
        }
        #chart-container #chartWrapper .nav-badge-tooltip,
        #panels-container .nav-badge-tooltip {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            padding: 10px 14px;
            background: rgba(5, 0, 40, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.5;
            color: #ffffff;
            white-space: nowrap;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s, visibility 0.2s;
        }
        #chart-container #chartWrapper .nav-badge-tooltip::before,
        #panels-container .nav-badge-tooltip::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid rgba(5, 0, 40, 0.98);
        }
        #chart-container #chartWrapper .nav-integrity-badge:hover .nav-badge-tooltip,
        #chart-container #chartWrapper .nav-integrity-badge.show-tooltip .nav-badge-tooltip,
        #panels-container .nav-integrity-badge:hover .nav-badge-tooltip,
        #panels-container .nav-integrity-badge.show-tooltip .nav-badge-tooltip {
            opacity: 1;
            visibility: visible;
        }
        #chart-container #chartWrapper .nav-badge-tooltip strong,
        #panels-container .nav-badge-tooltip strong {
            color: #ffffff;
        }
        #chart-container #chartWrapper .nav-badge-tooltip.enabled-tip strong,
        #panels-container .nav-badge-tooltip.enabled-tip strong {
            color: #f87171;
        }
        #chart-container #chartWrapper .nav-badge-tooltip.disabled-tip strong,
        #panels-container .nav-badge-tooltip.disabled-tip strong {
            color: #4ade80;
        }

        /* Hide legacy chart.js floating drawing toolbar — V9 renders its own
           tlBar/txtBar floating toolbar (TalariaV8bLive.jsx) which is wired
           via the V9 tool bridge. Keeping the legacy one visible would show
           two duplicate toolbars on every drawing select. */
        #drawing-toolbar { display: none !important; }

        /* Replay follow — V9 chrome (matches dist-v9); resets native button so it isn’t white on Windows/Chrome. */
        body > button.replay-follow-float-btn[data-talaria-replay-follow="injected"],
        #chart-container #replayFollow.replay-follow-float-btn,
        #chart-container button#replayFollow,
        #chart-container #chartWrapper #replayFollow.replay-follow-float-btn,
        #panels-container .panel-chart-container .panel-follow-btn {
            -webkit-appearance: none;
            appearance: none;
            font: inherit;
            outline: none;
            position: absolute;
            bottom: 70px;
            right: 120px;
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            background: rgba(14, 17, 28, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(140, 160, 255, 0.28);
            border-radius: 10px;
            color: rgba(210, 218, 255, 0.9);
            cursor: pointer;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.045);
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
            animation: tlrReplayFollowIdle 3s ease-in-out infinite;
            pointer-events: auto;
        }
        body > button.replay-follow-float-btn[data-talaria-replay-follow="injected"].replay-follow--attention,
        #chart-container #replayFollow.replay-follow--attention,
        #chart-container #chartWrapper #replayFollow.replay-follow--attention,
        #panels-container .panel-chart-container .panel-follow-btn.replay-follow--attention {
            animation: tlrReplayFollowAttention 1s ease-in-out infinite;
            border-color: rgba(99, 132, 255, 0.55);
            color: #e8ecff;
            box-shadow:
                0 0 22px rgba(41, 98, 255, 0.38),
                0 4px 18px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        body > button.replay-follow-float-btn[data-talaria-replay-follow="injected"] svg,
        #chart-container #replayFollow svg,
        #chart-container #chartWrapper #replayFollow svg,
        #panels-container .panel-chart-container .panel-follow-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            flex-shrink: 0;
        }
        body > button.replay-follow-float-btn[data-talaria-replay-follow="injected"]:hover,
        #chart-container #replayFollow:hover,
        #chart-container #chartWrapper #replayFollow:hover,
        #panels-container .panel-chart-container .panel-follow-btn:hover {
            background: rgba(22, 27, 44, 0.96);
            border-color: rgba(160, 176, 255, 0.42);
            color: #f0f3ff;
            transform: scale(1.06);
            animation: none;
            opacity: 1;
        }
        @keyframes tlrReplayFollowIdle {
            0%, 100% { opacity: 0.88; }
            50% { opacity: 1; }
        }
        @keyframes tlrReplayFollowAttention {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.92; }
        }

        /* Backtesting / replay loading overlay (same role as chart/legacy-index.html) */
        #backtestingLoader {
            position: fixed; inset: 0; z-index: 100000;
            display: none; flex-direction: column; justify-content: center; align-items: center; gap: 30px;
            background: #000; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        #backtestingLoader.active, html.bt-preload #backtestingLoader { display: flex; }
        html.bt-preload #root { visibility: hidden; }
        .loader-content { text-align: center; color: #fff; width: min(560px, calc(100vw - 40px));
            padding: 30px 26px 24px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.09);
            background: #000; box-shadow: 0 18px 44px rgba(0,0,0,0.42); }
        .loader-brand { position: relative; width: 120px; height: 120px; margin: 0 auto 18px; display: grid; place-items: center; }
        .loader-brand::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 3px solid rgba(41, 98, 255, 0.28); border-top-color: rgba(41, 98, 255, 0.88);
            animation: loaderBrandSpin 1.5s linear infinite; }
        .loader-brand::after { content: ''; position: absolute; inset: 16px; border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, rgba(41, 98, 255, 0.2), rgba(41, 98, 255, 0.04) 65%, transparent 78%);
            animation: loaderPulse 2.4s ease-in-out infinite; }
        .loader-brand img { width: 52px; height: 52px; position: relative; z-index: 2; filter: drop-shadow(0 0 10px rgba(41, 98, 255, 0.4)); }
        @keyframes loaderBrandSpin { to { transform: rotate(360deg); } }
        @keyframes loaderPulse { 0%, 100% { transform: scale(0.92); opacity: 0.65; } 50% { transform: scale(1.04); opacity: 1; } }
        .loader-title { font-size: 23px; font-weight: 700; margin-bottom: 6px; color: #f3f4f6; }
        .loader-subtitle { font-size: 13px; color: #98a2b8; margin-bottom: 18px; }
        .loader-progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; position: relative; }
        .loader-progress-bar { height: 100%; z-index: 1; position: relative;
            background: linear-gradient(90deg, #2962ff 0%, #3b82f6 55%, #60a5fa 100%);
            border-radius: 999px; width: 0%; transition: width 0.55s cubic-bezier(0.33, 1, 0.68, 1); }
        .loader-progress-shimmer { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; border-radius: inherit; }
        .loader-progress-shimmer::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 42%;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%);
            animation: loaderShimmerSweep 3.6s linear infinite; will-change: transform; }
        .loader-progress-shimmer::after { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 28%;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.14) 50%, transparent 100%);

    <!--
      ─────────────────────────────────────────────────────────────────────
      AUTH BOOTSTRAP + userStorage SHIM
      ─────────────────────────────────────────────────────────────────────
      These two inline scripts mirror chart/index.html exactly. They MUST
      run synchronously before any deferred module so `window.userStorage`
      is defined when chart.js, drawing-tools-manager, favorites-manager,
      keyboard-shortcuts, etc. call `userStorage.getItem(...)` at load time.
      Without them every module logs "ReferenceError: userStorage is not
      defined" and fails to initialize.
    -->
    <script>
    // 1. Auth check: confirm user is logged in; store user id in localStorage
    //    so userStorage's per-user key prefix works. Redirects to /login on 401.
    (function() {
        function redirectToLogin() {
            var next = window.location.pathname + window.location.search;
            var loginUrl = '/login/?next=' + encodeURIComponent(next);
            try {
                if (window.top && window.top !== window.self) {
                    window.top.location.href = loginUrl;
                    return;
                }
            } catch (e) {}
            window.location.href = loginUrl;
        }
        fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' })
            .then(function(res) {
                if (!res.ok) { redirectToLogin(); return null; }
                return res.json();
            })
            .then(function(data) {
                if (data && data.user && data.user.id) {
                    window.__talariaUserId = data.user.id;
                    try { localStorage.setItem('_uid', String(data.user.id)); } catch(e) {}
                }
            })
            .catch(function() { redirectToLogin(); });
    })();
    </script>
    <script>
    // 2. Per-user localStorage isolation. All user-specific data is prefixed
    //    with the user ID so different accounts on the same browser stay separate.
    (function() {
        var uid = null;
        try { uid = localStorage.getItem('_uid'); } catch(e) {}

        window.userKey = function(key) {
            var id = uid || window.__talariaUserId;
            if (!id) { try { id = localStorage.getItem('_uid'); } catch(e) {} }
            if (id) { uid = id; return 'u' + id + '_' + key; }
            return key;
        };

        window.userStorage = {
            getItem: function(key) {
                var scoped = localStorage.getItem(window.userKey(key));
                if (scoped !== null) return scoped;
                // Migrate: check legacy un-scoped key
                var legacy = localStorage.getItem(key);
                if (legacy !== null && uid) {
                    try { localStorage.setItem(window.userKey(key), legacy); localStorage.removeItem(key); } catch(e) {}
                }
                return legacy;
            },
            setItem: function(key, val) { localStorage.setItem(window.userKey(key), val); },
            removeItem: function(key) { localStorage.removeItem(window.userKey(key)); }
        };
    })();
    </script>

    <!-- ──────────────────────────────────────────────────────────────────
         PANEL MANAGER BOOTSTRAP
         Mirrors legacy chart/index.html (~line 47029-47100 + ~47406):
           1) Wait until #panels-container is in the DOM (React mounts it),
              the PanelManager class exists, and window.chart is initialized.
           2) Instantiate window.panelManager once.
           3) Listen to 'panelsCreated' and create a Chart instance for each
              non-main panel using the canvas/svg the panelManager built.
         All V9-side useEffects in TalariaV8bLive.jsx then drive
         panelManager.applyLayout() / panelManager.syncSettings normally.
         ────────────────────────────────────────────────────────────────── -->
    <script>
    (function bootstrapPanelManager() {
        /* chart.js, drawing-tools-manager, indicator-ui, order-manager call this to resolve
           the focused tile. Legacy index defines it; V9 must too or everything targets window.chart. */
        if (typeof window.getActiveChart !== 'function') {
            window.getActiveChart = function() {
                try {
                    var pm = window.panelManager;
                    if (pm && pm.panels && pm.panels.length > 0) {
                        var idx = pm.selectedPanelIndex || 0;
                        var panel = pm.panels[idx];
                        if (panel) {
                            if (idx === 0 && panel.isMainChart) return window.chart;
                            if (panel.chartInstance) return panel.chartInstance;
                        }
                    }
                } catch (e) {}
                return window.chart;
            };
        }

        var attempts = 0;
        var MAX_ATTEMPTS = 200; // ~20s
        function tryBoot() {
            var pc = document.getElementById('panels-container');
            // Top-level `class` declarations in classic scripts don't attach
            // to window in every browser. Use the bare global identifier the
            // same way legacy chart/index.html does (typeof PanelManager).
            var hasCls = (typeof PanelManager !== 'undefined');
            var hasChart = !!window.chart;
            if (!pc || !hasCls || !hasChart) {
                if (++attempts < MAX_ATTEMPTS) return setTimeout(tryBoot, 100);
                console.warn('[V9 panelManager] gave up after', attempts, 'attempts',
                    { pc: !!pc, PanelManager: hasCls, chart: hasChart });
                return;
            }
            if (window.panelManager) return; // idempotent
            try {
                window.panelManager = new PanelManager(pc);
                console.log('[V9 panelManager] initialized');
            } catch (err) {
                console.error('[V9 panelManager] failed to construct:', err);
                return;
            }

            // Per-panel Chart factory — mirrors legacy initPanelChart.
            window.initPanelChart = function(panel) {
                if (!panel) return null;
                if (panel.isMainChart) return panel.chartInstance;
                if (!panel.canvas || !panel.svg) return null;
                if (panel.chartInstance) {
                    try { panel.chartInstance.resize && panel.chartInstance.resize(); } catch(_){}
                    try { panel.chartInstance.render && panel.chartInstance.render(); } catch(_){}
                    return panel.chartInstance;
                }
                try {
                    if (panel.placeholder) panel.placeholder.style.display = 'none';
                    var pcChart = new Chart(panel.canvas, panel.svg, { panelIndex: panel.index });
                    pcChart.panel = panel;
                    pcChart.panelIndex = panel.index;
                    pcChart.isPanel = true;
                    pcChart.syncCrosshair = true;
                    if (panel.timeframe) pcChart.currentTimeframe = panel.timeframe;

                    var main = window.chart;
                    if (main) {
                        if (main.chartSettings) {
                            pcChart.chartSettings = JSON.parse(JSON.stringify(main.chartSettings));
                            if (pcChart.canvas) pcChart.canvas.style.backgroundColor = pcChart.chartSettings.backgroundColor;
                        }
                        if (main.cursorType && pcChart.setCursorType) {
                            try { pcChart.setCursorType(main.cursorType, true); } catch(_){}
                        }
                        if (main.replaySystem) pcChart.replaySystem = main.replaySystem;
                        if (main.orderManager) pcChart.orderManager = main.orderManager;
                        if (main.rawData && main.rawData.length > 0) {
                            pcChart.rawData = main.rawData;
                            try { pcChart.data = pcChart.resampleData(main.rawData, panel.timeframe || '1m'); } catch(_){}
                            pcChart.currentSymbol = main.currentSymbol;
                            pcChart.totalCandles = main.totalCandles;
                        }
                        // Carry over drawings.
                        try {
                            var seed = Array.isArray(main.drawings) ? main.drawings : [];
                            if ((!seed || !seed.length) && main.drawingManager && Array.isArray(main.drawingManager.drawings)) {
                                seed = main.drawingManager.drawings.map(function(d){ return d && typeof d.toJSON === 'function' ? d.toJSON() : null; }).filter(Boolean);
                            }
                            pcChart.drawings = JSON.parse(JSON.stringify(seed || []));
                            if (typeof pcChart.redrawDrawings === 'function') pcChart.redrawDrawings();
                        } catch(_){}
                    }

                    pcChart._chartViewRestored = false;
                    try { pcChart.fitToView(); } catch(_){}
                    try { pcChart.render(); } catch(_){}
                    if (pcChart.currentSymbol && pcChart.updateChartOHLCSymbol) {
                        try { pcChart.updateChartOHLCSymbol(pcChart.currentSymbol); } catch(_){}
                    }

                    panel.chartInstance = pcChart;

                    // Inherit interaction state from main chart.
                    if (main) {
                        pcChart.cursorType = main.cursorType || 'cross';
                        pcChart.showCrosshairLines = main.showCrosshairLines !== false;
                        pcChart.syncCrosshair = main.syncCrosshair !== false;
                        pcChart.syncDrawings = main.syncDrawings !== false;
                        var mMode = main.magnetMode || window.magnetMode || 'off';
                        pcChart.magnetMode = mMode;
                        if (pcChart.drawingManager) pcChart.drawingManager.magnetMode = mMode;
                        if (pcChart.setCursorType) {
                            try { pcChart.setCursorType(pcChart.cursorType, true); } catch(_){}
                        }
                    }

                    if (window.panelManager && window.panelManager.loadPanelSettings) {
                        try { window.panelManager.loadPanelSettings(panel.index); } catch(_){}
                    }

                    requestAnimationFrame(function() {
                        if (pcChart && pcChart.resize) {
                            pcChart._lastResizeDpr = 0;
                            try { pcChart.resize(); } catch(_){}
                            pcChart._chartViewRestored = false;
                            try { pcChart.fitToView(); } catch(_){}
                            try { pcChart.render(); } catch(_){}
                        }
                        if (window.panelManager && typeof window.panelManager.restorePanelChartState === 'function') {
                            try { window.panelManager.restorePanelChartState(panel.index); } catch(_){}
                        }
                    });

                    if (typeof ResizeObserver !== 'undefined' && panel.chartContainer) {
                        var ro = new ResizeObserver(function() {
                            if (pcChart && pcChart.resize) { try { pcChart.resize(); pcChart.render(); } catch(_){} }
                        });
                        ro.observe(panel.chartContainer);
                        panel.resizeObserver = ro;
                    }

                    return pcChart;
                } catch (err) {
                    console.error('[V9 initPanelChart] failed:', err);
                    return null;
                }
            };

            // Same as legacy chart/index.html renderPanelChart — seeds panel data when the main
            // chart finishes loading after panels already exist (V9 React mount order).
            window.renderPanelChart = function(panel, sourceData) {
                var chart = window.chart;
                if (!panel) return;
                if (!panel.chartInstance) window.initPanelChart(panel);
                if (sourceData && panel.chartInstance) {
                    var pcSelf = panel.chartInstance;
                    var alreadyHasData = (Array.isArray(pcSelf.data) && pcSelf.data.length > 0)
                        || (Array.isArray(pcSelf.rawData) && pcSelf.rawData.length > 0)
                        || (Array.isArray(pcSelf._panelFullRawData) && pcSelf._panelFullRawData.length > 0)
                        || pcSelf._isLoadingOwnPairData;
                    if (alreadyHasData) return;
                    if (chart && chart.chartSettings) {
                        panel.chartInstance.chartSettings = JSON.parse(JSON.stringify(chart.chartSettings));
                        if (panel.chartInstance.canvas) {
                            panel.chartInstance.canvas.style.backgroundColor = panel.chartInstance.chartSettings.backgroundColor;
                        }
                    }
                    var hasOwnPairData = panel.chartInstance._isLoadingOwnPairData
                        || (Array.isArray(panel.chartInstance._panelFullRawData) && panel.chartInstance._panelFullRawData.length > 0);
                    if (!hasOwnPairData) {
                        if (chart && chart.currentSymbol) {
                            panel.chartInstance.currentSymbol = chart.currentSymbol;
                        }
                        panel.chartInstance.rawData = chart.rawData || [];
                        panel.chartInstance.data = panel.chartInstance.resampleData(
                            panel.chartInstance.rawData,
                            panel.timeframe || '1m'
                        );
                        panel.chartInstance.fitToView();
                        panel.chartInstance.render();
                        if (panel.chartInstance.currentSymbol && panel.chartInstance.updateChartOHLCSymbol) {
                            panel.chartInstance.updateChartOHLCSymbol(panel.chartInstance.currentSymbol);
                        }
                    }

            };

            window.addEventListener('panelsCreated', function(event) {
                var panels = (event && event.detail && event.detail.panels) || [];
                setTimeout(function() {
                    if (window.chart && window.chart.data && window.chart.data.length > 0) {
                        panels.forEach(function(panel) { window.initPanelChart(panel); });
                    }
                    if (window.chart && window.chart.orderManager
                        && typeof window.chart.orderManager.syncOrderVisualsToActiveChart === 'function') {
                        try { window.chart.orderManager.syncOrderVisualsToActiveChart(); } catch(_){}
                    }
                }, 200);
            });

            window.addEventListener('panelTimeframeChanged', function(event) {
                var d = event && event.detail;
                if (!d) return;
                var panelIndex = d.panelIndex;
                var timeframe = d.timeframe;
                var panel = d.panel;
                if (panel && panel.chartInstance) {
                    panel.chartInstance.setTimeframe(timeframe);
                    if (window.panelManager && window.panelManager.syncSettings && window.panelManager.syncSettings.interval) {
                        window.panelManager.syncInterval(panel, timeframe);
                    }
                } else if (window.panelManager) {
                    var plist = window.panelManager.getPanels();
                    var targetPanel = plist && plist[panelIndex];
                    if (targetPanel && targetPanel.chartInstance) {
                        targetPanel.chartInstance.setTimeframe(timeframe);
                        if (window.panelManager.syncSettings && window.panelManager.syncSettings.interval) {
                            window.panelManager.syncInterval(targetPanel, timeframe);
                        }
                    }
                }
            });

            window.addEventListener('chartDataLoaded', function(event) {
                if (!window.panelManager || window.panelManager.getCurrentLayout() === '1') return;
                var panels = window.panelManager.getPanels();
                if (!panels || !panels.length) return;
                var detail = event && event.detail;
                var sourceData = detail && detail.data;
                panels.forEach(function(panel) {
                    if (!panel.chartInstance) {
                        window.initPanelChart(panel);
                        return;
                    }
                    var pc = panel.chartInstance;
                    var hasData = (Array.isArray(pc.data) && pc.data.length > 0)
                        || (Array.isArray(pc.rawData) && pc.rawData.length > 0)
                        || (Array.isArray(pc._panelFullRawData) && pc._panelFullRawData.length > 0);
                    if (hasData) return;
                    window.renderPanelChart(panel, sourceData);
                });
            });

            // panelDrawingSync stub matching legacy (drawing sync is handled
            // inside Chart.broadcastDrawingChange / Chart.receiveDrawingChange).
            if (!window.panelDrawingSync) {
                window.panelDrawingSync = {
                    enabled: true,
                    hasSameSymbol: function() { return true; },
                    syncDrawing: function() {},
                    syncAllDrawings: function() {},
                    isSameDrawing: function() { return false; },
                    normalizeDrawingForTarget: function(d) { return d; }
                };
            }
        }
        // Kick off after the deferred scripts have run.
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryBoot);
        } else {
            tryBoot();
        }
    })();
    </script>
