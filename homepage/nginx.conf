server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Custom page when upstream is unreachable (502) or overloaded (503/504)
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Next static export emits /404.html for app/not-found.tsx — use it instead of always falling back to /index.html
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Allow larger request lines/query strings so stale long chart URLs don't fail with 414.
    # App code now trims drawings URL params, but this keeps existing bookmarked URLs recoverable.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Serve static files (PDFs, etc.) without auth - must be before other locations
    location ^~ /files/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to trading-chart service
    location /api/ {
        client_max_body_size 64m;
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        # Large PATCH /api/sessions/:id/state (journal + drawings) — defaults (60s) can yield nginx 503 under load
        proxy_connect_timeout 75s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # WebSocket (support chat, chart stream) — must be before generic / proxy
    location /ws/ {
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 86400s;
    }

    # Proxy chart/backtest HTML pages to trading-chart service
    location ~ ^/(backtesting|propfirm-backtest)\.html$ {
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy static assets for chart pages
    location ~ ^/(modules|uploads|chart|styles)/ {
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy JS files at root
    location ~ ^/(chart\.js|chart\.module\.js|chart-main\.js|propfirm-script\.js)$ {
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy CSS files at root
    location ~ ^/(styles\.css|propfirm-styles\.css)$ {
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /_auth {
        internal;
        proxy_pass http://trading-chart:8000/api/auth/me;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /register {
        auth_request /_auth;
        error_page 401 =302 /login/?mode=signin&next=/register/;
        add_header Cache-Control "no-store" always;
        return 301 /register/;
    }

    location ^~ /register/ {
        auth_request /_auth;
        error_page 401 =302 /login/?mode=signin&next=/register/;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Proxy journal API requests directly to backend (^~ prevents regex matching)
    location ^~ /journal/api/ {
        client_max_body_size 64m;
        proxy_pass http://journal-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Legacy journal SPA removed — UI paths go to Next (API proxied via ^~ /journal/api/ above).
    location = /journal/pricing {
        return 301 /pricing/;
    }
    location = /journal/pricing/ {
        return 301 /pricing/;
    }
    location = /journal/subscription-status {
        return 301 /pricing/?browse=1;
    }
    location = /journal/subscription-status/ {
        return 301 /pricing/?browse=1;
    }
    location = /journal {
        return 301 /dashboard/journal/;
    }
    location = /journal/ {
        return 301 /dashboard/journal/;
    }
    location = /journal/login {
        return 301 /login/?next=%2Fdashboard%2Fjournal%2F;
    }
    location = /journal/login/ {
        return 301 /login/?next=%2Fdashboard%2Fjournal%2F;
    }
    location ^~ /journal/ {
        return 301 /dashboard/journal/;
    }

    # Handle Next.js static export routing (homepage). Do not fall back to /index.html — that hides real 404s.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
