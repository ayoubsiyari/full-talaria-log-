<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Talaria Log — Maintenance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1a1a1a;
      background: linear-gradient(160deg, #f8fafc 0%, #eef2f7 45%, #e8ecf4 100%);
    }
    .card {
      max-width: 32rem;
      text-align: center;
    }
    .logo {
      width: min(72vw, 280px);
      height: auto;
      margin: 0 auto 2rem;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(15, 23, 42, 0.12));
    }
    h1 {
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
      line-height: 1.25;
    }
    p {
      margin: 0 0 1rem;
      font-size: 1.05rem;
      line-height: 1.55;
      color: #334155;
    }
    .muted {
      font-size: 0.95rem;
      color: #64748b;
    }
    a {
      color: #0f766e;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo-04.png" alt="Talaria Log" width="280" height="280" />
    <h1>We are under maintenance</h1>
    <p>
      Our systems are temporarily unavailable. We are working to restore service as quickly as possible.
    </p>
    <p class="muted">
      If we are down for more than <strong>24 hours</strong>, please contact
      <a href="mailto:support@talaria-log.com">support@talaria-log.com</a>.
    </p>
  </div>
</body>
</html>
