<!doctype html>
<html lang="en" class="multichart-embed">
<head>

    (function () {

    <title>Talaria — multichart panel</title>
    <link rel="stylesheet" href="/chart/fonts/talaria-fonts.css?v=20260627b365" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #07080E; }
        #chart-container, #chartWrapper { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
        #chartCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
        #drawingSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: hidden; }
        #priceAxisZone { position: absolute; right: 0; top: 5px; bottom: 30px; width: 14px; background: transparent; z-index: 5; cursor: ns-resize; }
        #timeAxisZone { position: absolute; left: 0; right: 60px; bottom: 0; height: 10px; background: transparent; z-index: 5; cursor: ew-resize; }
        .crosshair-vertical, .crosshair-horizontal { position: absolute; pointer-events: none; z-index: 10; display: none; }
        .crosshair-vertical { width: 1px; height: 100%; background: repeating-linear-gradient(to bottom, rgba(150,155,165,.8) 0 6px, transparent 6px 10px); }
        .crosshair-horizontal { width: 100%; height: 1px; background: repeating-linear-gradient(to right, rgba(150,155,165,.8) 0 6px, transparent 6px 10px); }
        .price-label, .time-label { position: absolute; pointer-events: none; z-index: 20; display: none; font: 500 12px Roboto, sans-serif; color: #fff; padding: 3px 6px; background: #434651; }
        .time-label { background: #131722; bottom: 6px; }
        #orderPanel { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; visibility: hidden; pointer-events: none; }

        /* OHLC legend — same layout/stacking as live/index.html main #chartWrapper */
        #chart-container #chartWrapper .ohlc-info {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #d1d4dc;
            pointer-events: none;
            box-sizing: border-box;
            max-width: min(560px, calc(100% - 96px));
            --ohlc-fg: #ffffff;
            --ohlc-muted: rgba(255, 255, 255, 0.82);
            --ohlc-ind: rgba(255, 255, 255, 0.72);
        }
        #chart-container #chartWrapper .ohlc-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            column-gap: 10px;
            row-gap: 2px;
        }
        #chart-container #chartWrapper .ohlc-symbol-block {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            line-height: 1.25;
            color: var(--ohlc-fg, #fff);
        }
        #chart-container #chartWrapper .ohlc-symbol-block #chartSymbol { color: var(--ohlc-fg, #fff); }
        #chart-container #chartWrapper .ohlc-symbol-block #chartTimeframe { color: var(--ohlc-muted, rgba(255, 255, 255, 0.82)); }
        #chart-container #chartWrapper .ohlc-stats {
            position: relative;
            display: flex;
            align-items: center;
            flex: 0 1 auto;
            min-width: 0;
            max-width: 100%;
            flex-wrap: nowrap;
            gap: 0;
            box-sizing: border-box;
            line-height: 1.2;
            min-height: 22px;
            padding-left: 4px;
        }
        #chart-container #chartWrapper .ohlc-stats-flow {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 10px;
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-item {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        #chart-container #chartWrapper .ohlc-item-close-change {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-label {
            font-size: 9px;
            font-weight: 500;
            color: var(--ohlc-muted, rgba(255, 255, 255, 0.82));
        }
        #chart-container #chartWrapper .ohlc-value,
        #chart-container #chartWrapper .ohlc-change {
            font-size: 9px;
            font-weight: 500;
            color: var(--ohlc-muted, rgba(255, 255, 255, 0.82));
            font-variant-numeric: tabular-nums lining-nums;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-item-close-change .ohlc-change {
            margin-left: 0;
            width: 14ch;
            min-width: 14ch;
            flex: 0 0 14ch;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
        }
        #chart-container #chartWrapper .ohlc-nav-badge-slot {
            flex: 0 0 0;
            width: 0;
            min-width: 0;
            max-width: 0;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        #chart-container #chartWrapper .ohlc-body {
            margin-top: 1px;
            pointer-events: none;
        }
        #chart-container #chartWrapper .ohlc-indicators {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            width: 100%;
            max-width: 100%;
            font-size: 10.5px;
            line-height: 1.2;
            color: var(--ohlc-ind, rgba(255, 255, 255, 0.72));
            pointer-events: none;
            position: relative;
            z-index: 100;
        }
        #chart-container #chartWrapper .ohlc-indicators * { color: inherit; }
        #chart-container #chartWrapper .ohlc-indicators > div { max-width: 100%; }
        #chart-container #chartWrapper .ohlc-indicators .talaria-ind-legend-row {
            pointer-events: auto;
            cursor: default;
            width: fit-content;
            max-width: 100%;
            align-self: flex-start;
        }
        #chart-container #chartWrapper .ohlc-legend-footer {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 3px;
            padding: 0;
            pointer-events: auto;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            margin: 0;
            padding: 2px 4px;
            background: transparent;
            color: #787b86;
            cursor: default;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            line-height: 0;
            flex-shrink: 0;
            pointer-events: auto;
            opacity: 0.88;
        }
        #chart-container #chartWrapper .ohlc-legend-chevron svg {
            width: 13px;
            height: 13px;
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }
        #chart-container #chartWrapper .ohlc-info:not(.collapsed) .ohlc-legend-chevron svg { transform: rotate(180deg); }
        #chart-container #chartWrapper .ohlc-info.collapsed .ohlc-legend-chevron svg { transform: rotate(0deg); }
        #chart-container #chartWrapper .ohlc-info.collapsed .ohlc-body { display: none !important; }
        #chart-container #chartWrapper .ohlc-info.ohlc-legend-empty .ohlc-legend-footer { display: flex; }
        #chart-container #chartWrapper .ohlc-info.ohlc-legend-empty .ohlc-legend-chevron {
            color: rgba(255, 255, 255, 0.78);
            opacity: 1;
        }
    </style>
    <script>
    (function () {
        var p = new URLSearchParams(window.location.search);
        if (p.get('multichart') !== '1') {
            try { p.set('multichart', '1'); history.replaceState(null, '', '?' + p.toString()); } catch (_) {}
        }
    })();

    <script>
    (function () {
        function redirectToLogin() {
            var next = window.location.pathname + window.location.search;
            var loginUrl = '/login/?next=' + encodeURIComponent(next);
            try {
                if (window.top && window.top !== window.self) { window.top.location.href = loginUrl; return; }
            } catch (e) {}
            window.location.href = loginUrl;
        }
        fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' })
            .then(function (res) { if (!res.ok) { redirectToLogin(); return null; } return res.json(); })
            .then(function (data) {
                if (data && data.user && data.user.id) {
                    window.__talariaUserId = data.user.id;
                    try { localStorage.setItem('_uid', String(data.user.id)); } catch (e) {}
                }
            })
            .catch(function () { redirectToLogin(); });
    })();
    </script>
    <script>
    (function () {
        var uid = null;
        try { uid = localStorage.getItem('_uid'); } catch (e) {}
        window.userKey = function (key) {
            var id = uid || window.__talariaUserId;
            if (!id) { try { id = localStorage.getItem('_uid'); } catch (e) {} }
            if (id) { uid = id; return 'u' + id + '_' + key; }
            return key;
        };
        window.userStorage = {
            getItem: function (key) {
                var scoped = localStorage.getItem(window.userKey(key));
                if (scoped !== null) return scoped;
                var legacy = localStorage.getItem(key);
                if (legacy !== null && uid) {
                    try { localStorage.setItem(window.userKey(key), legacy); localStorage.removeItem(key); } catch (e) {}
                }
                return legacy;
            },
            setItem: function (key, val) { localStorage.setItem(window.userKey(key), val); },
            removeItem: function (key) { localStorage.removeItem(window.userKey(key)); }
        };
    })();
    </script>

<body class="multichart-embed">
    <div id="chart-container">
        <div id="chartWrapper" class="chart-wrapper">
            <canvas id="chartCanvas"></canvas>
            <svg id="drawingSvg"></svg>
            <div id="priceAxisZone" class="axis-cursor-zone price-axis-zone"></div>
            <div id="timeAxisZone" class="axis-cursor-zone time-axis-zone"></div>
            <div class="crosshair-vertical"></div>
            <div class="crosshair-horizontal"></div>
            <div class="price-label"></div>
            <div class="time-label"></div>
            <div class="ohlc-info" id="ohlcInfo">
                <div class="ohlc-header">
                    <div class="ohlc-symbol-block">
                        <span id="chartSymbol" class="ohlc-symbol-text"></span>
                        <span class="ohlc-separator"> · </span>
                        <span id="chartTimeframe"></span>
                    </div>
                    <div class="ohlc-stats">
                        <div class="ohlc-stats-flow">
                            <div class="ohlc-item">
                                <span class="ohlc-label">O</span>
                                <span class="ohlc-value" id="open">—</span>
                            </div>
                            <div class="ohlc-item">
                                <span class="ohlc-label">H</span>
                                <span class="ohlc-value" id="high">—</span>
                            </div>
                            <div class="ohlc-item">
                                <span class="ohlc-label">L</span>
                                <span class="ohlc-value" id="low">—</span>
                            </div>
                            <div class="ohlc-item ohlc-item-close-change">
                                <span class="ohlc-label">C</span>
                                <span class="ohlc-value" id="close">—</span>
                                <span class="ohlc-change" id="chartChange">—</span>
                            </div>
                        </div>
                        <div class="ohlc-nav-badge-slot" aria-hidden="true"></div>
                    </div>
                </div>
                <div class="ohlc-body">
                    <div id="ohlcIndicators" class="ohlc-indicators"></div>
                </div>
                <div class="ohlc-legend-footer">
                    <button type="button" class="ohlc-legend-chevron" id="ohlcCollapseBtn" aria-label="Toggle indicator list" aria-expanded="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9" stroke-linecap="round" stroke-linejoin="round"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="orderPanel" aria-hidden="true">
        <input id="orderEntryPrice" type="hidden" value="0" />
        <input id="orderQuantity" type="hidden" value="1" />
    </div>
    <div id="replayToolbar" aria-hidden="true" style="display:none">
        <div id="replayToolbarHandle" style="display:none;"></div>
        <button type="button" id="replayModeBtn" tabindex="-1"></button>
    </div>
    <script>
    if (typeof window.getActiveChart !== 'function') {
        window.getActiveChart = function () { return window.chart || null; };
    }
    if (!window.panelDrawingSync) {
        window.panelDrawingSync = {
            enabled: false,
            hasSameSymbol: function () { return true; },
            syncDrawing: function () {},
            syncAllDrawings: function () {},
            isSameDrawing: function () { return false; },
            normalizeDrawingForTarget: function (d) { return d; }
        };
    }

    // Re-stamp OHLC legend after chart.js loads data (same race guard as TalariaV8bLive).
    (function () {
        function flushOhlcLegend() {
            try {
                var ch = window.chart;
                if (!ch) return;
                if (typeof ch.updateOHLCIndicators === 'function') ch.updateOHLCIndicators();
                if (ch.currentSymbol && typeof ch.updateChartOHLCSymbol === 'function') {
                    ch.updateChartOHLCSymbol(ch.currentSymbol);
                }
            } catch (_) {}
        }
        window.addEventListener('chartDataLoaded', flushOhlcLegend);
        window.addEventListener('panelsCreated', flushOhlcLegend);
        var poll = setInterval(function () {
            if (!window.chart) return;
            clearInterval(poll);
            flushOhlcLegend();
        }, 100);
        setTimeout(function () { clearInterval(poll); }, 30000);
    })();
    </script>
