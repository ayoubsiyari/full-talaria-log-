<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaria — Multichart Prototype (Lightweight Charts)</title>
<!--
  PROTOTYPE: TradingView-style multichart architecture.

  One shared data layer (BarService) fetches each (fileId, timeframe) window
  exactly ONCE from the existing /api/file/{id}/bars API. Every panel is a
  dumb lightweight-charts renderer fed from that shared cache. Panning left
  on ANY panel triggers ONE backward fetch; all panels receive the widened
  array. No iframes, no postMessage, no per-panel engine.

  Open as: /chart/multichart-prod/lwc-proto.html?fileId=25&tf=1m&panels=2

  License: lightweight-charts (Apache-2.0, TradingView, Inc.) — attribution
  logo enabled on every chart + notice in the footer, per the license.
-->
<script src="./vendor/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0d1017;
    --panel-bg: #131722;
    --border: #2a2e39;
    --text: #d1d4dc;
    --muted: #787b86;
    --accent: #2962ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header .title { font-weight: 600; }
  header .tf-group { display: flex; gap: 4px; }
  header button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { border-color: var(--muted); }
  header button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  header .status { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  header .status.loading { color: #f7a600; }
  #grid {
    flex: 1 1 auto;
    display: grid;
    gap: 2px;
    background: var(--border);
    min-height: 0;
  }
  #grid.p1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #grid.p2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  #grid.p3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
  #grid.p4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .cell { position: relative; background: var(--panel-bg); min-width: 0; min-height: 0; }
  .cell .label {
    position: absolute;
    top: 6px;
    left: 8px;
    z-index: 5;
    color: var(--muted);
    font-size: 11px;
    background: rgba(19, 23, 34, 0.75);
    padding: 2px 7px;
    border-radius: 3px;
    pointer-events: none;
  }
  footer {
    flex: 0 0 auto;
    padding: 5px 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
  }
  footer a { color: var(--muted); }
  #setup {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 50;
  }
  #setup .box { text-align: center; }
  #setup input {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    width: 120px;
  }
</style>
</head>
<body>
<header>
  <span class="title">Multichart prototype</span>
  <span id="fileLabel" style="color: var(--muted);"></span>
  <span class="tf-group" id="tfGroup"></span>
  <span class="status" id="status">idle</span>
</header>
<div id="grid" class="p2"></div>
<footer>
  Charting by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>
  — Lightweight Charts™, copyright (c) 2025 TradingView, Inc. (Apache License 2.0)
</footer>
<div id="setup"><div class="box">
  <p>No <code>fileId</code> in the URL.</p>
  <p><input id="setupFileId" type="number" placeholder="file id, e.g. 25"></p>
  <p><button onclick="location.search = '?fileId=' + document.getElementById('setupFileId').value">Open</button></p>
</div></div>

<script>
(function () {
  'use strict';

  var LWC = window.LightweightCharts;
  var qs = new URLSearchParams(location.search);
  var FILE_ID = parseInt(qs.get('fileId') || '', 10);
  var PANELS = Math.min(4, Math.max(1, parseInt(qs.get('panels') || '2', 10)));
  var TIMEFRAMES = ['1m', '5m', '15m', '1h', '4h', '1d'];
  var currentTf = TIMEFRAMES.indexOf(qs.get('tf') || '') >= 0 ? qs.get('tf') : '1m';
  var BATCH = 2000; // server max per /bars request

  if (!Number.isFinite(FILE_ID)) {
    document.getElementById('setup').style.display = 'flex';
    return;
  }
  document.getElementById('fileLabel').textContent = 'file ' + FILE_ID;

  var statusEl = document.getElementById('status');
  var fetchCount = 0;
  function setStatus(text, loading) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (loading ? ' loading' : '');
  }

  function tfMs(tf) {
    var m = String(tf).match(/^(\d+)(m|h|d)$/);
    if (!m) return 60000;
    var mult = { m: 60000, h: 3600000, d: 86400000 };
    return parseInt(m[1], 10) * mult[m[2]];
  }
  function toMsEpoch(t) { return t > 1e12 ? t : t * 1000; }

  /* ──────────────────────────────────────────────────────────────────
   * BarService — THE single data layer. One instance per timeframe,
   * shared by every panel. Fetches never overlap (in-flight dedupe),
   * merges are contiguous by construction (we always extend from the
   * exact loaded edge), and subscribers get the full widened array.
   * ────────────────────────────────────────────────────────────────── */
  function BarService(fileId, tf) {
    this.fileId = fileId;
    this.tf = tf;
    this.bars = [];          // ascending, time in SECONDS (lightweight-charts format)
    this.hasMoreLeft = true;
    this.endMs = null;       // dataset end from /meta
    this._inflight = null;
    this._subs = [];
  }

  BarService.prototype.subscribe = function (fn) { this._subs.push(fn); };
  BarService.prototype._notify = function (addedLeft) {
    for (var i = 0; i < this._subs.length; i++) {
      try { this._subs[i](this.bars, addedLeft); } catch (e) { console.error(e); }
    }
  };

  BarService.prototype._fetchWindow = function (fromMs, toMs) {
    var url = '/api/file/' + this.fileId + '/bars'
      + '?from=' + Math.max(0, Math.floor(fromMs))
      + '&to=' + Math.floor(toMs)
      + '&resolution=' + encodeURIComponent(this.tf)
      + '&limit=' + BATCH;
    fetchCount++;
    setStatus('fetch #' + fetchCount + ' ' + this.tf + ' …', true);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('bars HTTP ' + r.status);
      return r.json();
    });
  };

  BarService.prototype._normalize = function (apiBars) {
    var out = [];
    for (var i = 0; i < apiBars.length; i++) {
      var b = apiBars[i];
      var t = Number(b.t);
      if (!Number.isFinite(t)) continue;
      out.push({
        time: Math.floor(toMsEpoch(t) / 1000),
        open: Number(b.o), high: Number(b.h), low: Number(b.l), close: Number(b.c),
      });
    }
    out.sort(function (a, b) { return a.time - b.time; });
    return out;
  };

  /** Initial load: newest BATCH bars anchored at the dataset end. */
  BarService.prototype.loadInitial = function () {
    if (this._inflight) return this._inflight;
    var self = this;
    var metaP = this.endMs != null
      ? Promise.resolve(this.endMs)
      : fetch('/api/file/' + this.fileId + '/meta')
          .then(function (r) { return r.json(); })
          .then(function (meta) {
            self.endMs = Number(meta.end_ts) || Date.now();
            var name = meta.original_name || '';
            if (name) document.getElementById('fileLabel').textContent = name + ' (file ' + self.fileId + ')';
            return self.endMs;
          });
    this._inflight = metaP.then(function (endMs) {
      var span = BATCH * tfMs(self.tf) * 1.05;
      return self._fetchWindow(endMs - span, endMs + tfMs(self.tf));
    }).then(function (payload) {
      self.bars = self._normalize(payload.bars || []);
      self.hasMoreLeft = payload.has_more_left !== false && self.bars.length > 0;
      setStatus('loaded ' + self.bars.length + ' bars (' + fetchCount + ' fetches total)', false);
      self._notify(0);
    }).catch(function (e) {
      setStatus('load failed: ' + e.message, false);
    }).finally(function () { self._inflight = null; });
    return this._inflight;
  };

  /** Backward paging: ONE fetch extends the shared array for ALL panels. */
  BarService.prototype.loadOlder = function () {
    if (this._inflight || !this.hasMoreLeft || this.bars.length === 0) return;
    var self = this;
    var firstMs = this.bars[0].time * 1000;
    var span = BATCH * tfMs(this.tf) * 1.05;
    this._inflight = this._fetchWindow(firstMs - span, firstMs - 1).then(function (payload) {
      var older = self._normalize(payload.bars || []);
      // keep strictly-older bars only → contiguous prepend, no seams
      var cut = self.bars[0].time;
      while (older.length && older[older.length - 1].time >= cut) older.pop();
      if (older.length === 0) {
        self.hasMoreLeft = false;
        setStatus('no more history (' + fetchCount + ' fetches total)', false);
        return;
      }
      self.bars = older.concat(self.bars);
      if (payload.has_more_left === false) self.hasMoreLeft = false;
      setStatus('+' + older.length + ' bars → ' + self.bars.length
        + ' (' + fetchCount + ' fetches total)', false);
      self._notify(older.length);
    }).catch(function (e) {
      setStatus('history load failed: ' + e.message, false);
    }).finally(function () { self._inflight = null; });
  };

  var services = {}; // tf -> BarService (cache: revisited TFs are instant)
  function getService(tf) {
    if (!services[tf]) services[tf] = new BarService(FILE_ID, tf);
    return services[tf];
  }

  /* ──────────────────────────────────────────────────────────────────
   * Panels — dumb renderers. They never fetch; they only display the
   * shared array and report "user panned near the left edge".
   * ────────────────────────────────────────────────────────────────── */
  var grid = document.getElementById('grid');
  grid.className = 'p' + PANELS;

  var panels = [];
  var syncingRange = false;
  var syncingCrosshair = false;

  function makePanel(idx) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    var label = document.createElement('div');
    label.className = 'label';
    label.textContent = String.fromCharCode(65 + idx); // A, B, C, D
    cell.appendChild(label);
    grid.appendChild(cell);

    var chart = LWC.createChart(cell, {
      layout: {
        background: { type: 'solid', color: '#131722' },
        textColor: '#d1d4dc',
        attributionLogo: true, // license: keeps the TradingView link visible
      },
      grid: {
        vertLines: { color: '#1e222d' },
        horzLines: { color: '#1e222d' },
      },
      crosshair: { mode: LWC.CrosshairMode.Normal },
      timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
      rightPriceScale: { borderColor: '#2a2e39' },
      autoSize: true,
    });
    var series = chart.addSeries(LWC.CandlestickSeries, {
      upColor: '#26a69a', downColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
      borderVisible: false,
    });

    var panel = { idx: idx, chart: chart, series: series };

    // ── time-axis sync: one pan/zoom moves every panel (loop-guarded) ──
    chart.timeScale().subscribeVisibleLogicalRangeChange(function (range) {
      if (!range) return;
      if (!syncingRange) {
        syncingRange = true;
        for (var i = 0; i < panels.length; i++) {
          if (panels[i] !== panel) {
            panels[i].chart.timeScale().setVisibleLogicalRange(range);
          }
        }
        syncingRange = false;
      }
      // ── lazy history: ask the SHARED service, never fetch per panel ──
      if (range.from < 80) getService(currentTf).loadOlder();
    });

    // ── crosshair sync ──
    chart.subscribeCrosshairMove(function (param) {
      if (syncingCrosshair) return;
      syncingCrosshair = true;
      for (var i = 0; i < panels.length; i++) {
        if (panels[i] === panel) continue;
        if (param && param.time != null) {
          var d = param.seriesData && param.seriesData.get(series);
          var price = d ? (d.close != null ? d.close : d.value) : null;
          if (price != null) {
            panels[i].chart.setCrosshairPosition(price, param.time, panels[i].series);
            continue;
          }
        }
        panels[i].chart.clearCrosshairPosition();
      }
      syncingCrosshair = false;
    });

    panels.push(panel);
    return panel;
  }

  for (var p = 0; p < PANELS; p++) makePanel(p);

  /* ──────────────────────────────────────────────────────────────────
   * Shared-data plumbing: when the service widens the array, every
   * panel gets setData once, with its viewport pinned in place (indices
   * shift by the prepended count, so we shift the logical range back).
   * ────────────────────────────────────────────────────────────────── */
  function bindService(svc) {
    svc.subscribe(function (bars, addedLeft) {
      syncingRange = true;
      for (var i = 0; i < panels.length; i++) {
        var ts = panels[i].chart.timeScale();
        var range = ts.getVisibleLogicalRange();
        panels[i].series.setData(bars);
        if (range && addedLeft > 0) {
          ts.setVisibleLogicalRange({ from: range.from + addedLeft, to: range.to + addedLeft });
        }
      }
      syncingRange = false;
    });
  }

  function switchTimeframe(tf) {
    currentTf = tf;
    renderTfButtons();
    var svc = getService(tf);
    if (!svc._bound) { bindService(svc); svc._bound = true; }
    if (svc.bars.length > 0) {
      // already cached → instant, zero network
      svc._notify(0);
      for (var i = 0; i < panels.length; i++) panels[i].chart.timeScale().fitContent();
      setStatus('tf ' + tf + ' from cache (' + fetchCount + ' fetches total)', false);
    } else {
      svc.loadInitial().then(function () {
        for (var i = 0; i < panels.length; i++) panels[i].chart.timeScale().fitContent();
      });
    }
  }

  var tfGroup = document.getElementById('tfGroup');
  function renderTfButtons() {
    tfGroup.innerHTML = '';
    TIMEFRAMES.forEach(function (tf) {
      var b = document.createElement('button');
      b.textContent = tf;
      b.className = tf === currentTf ? 'active' : '';
      b.onclick = function () { if (tf !== currentTf) switchTimeframe(tf); };
      tfGroup.appendChild(b);
    });
  }

  renderTfButtons();
  switchTimeframe(currentTf);
}());
</script>
</body>
</html>
