<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multichart — chart host</title>

    <!--
        Per-chart iframe harness for the multi-chart sandbox.

        URL params:
            ?id=chart-A          — bridge identifier (REQUIRED)
            &tf=1m               — initial timeframe (per-panel, NOT synced)
            &fileId=27           — initial file id (passed by shell on layout
                                   build when "Apply file to all" was used).
                                   When omitted, the iframe shows
                                   "pick a file →" until user picks one
                                   from the per-panel dropdown.
            &verbose=1           — verbose bridge logs

        Loads:
            d3 (CDN)
            ../chart.js          — engine (no modules — minimum surface)
            engine-api-guards.js
            sync-bridge.js

        v10 (2026-05-09): synthetic data path removed entirely. The iframe
        always fetches real OHLC from FastAPI (/api/file/{id}/smart). If the
        fetch fails, the chart stays empty and the per-panel badge surfaces
        the error.
    -->

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0c14; color: #d1d4dc; font-family: 'DM Sans', system-ui, sans-serif; }

        #chart-container {
            position: absolute;
            inset: 0;
        }

        #chartCanvas, #drawingSvg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #drawingSvg { pointer-events: none; z-index: 2; }

        .crosshair-vertical, .crosshair-horizontal {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        .crosshair-vertical {
            width: 1px; height: 100%;
            background: repeating-linear-gradient(to bottom, rgba(150,155,165,.8) 0 6px, transparent 6px 10px);
        }
        .crosshair-horizontal {
            width: 100%; height: 1px;
            background: repeating-linear-gradient(to right, rgba(150,155,165,.8) 0 6px, transparent 6px 10px);
        }
        .price-label, .time-label {
            position: absolute;
            background: #2a2e39;
            color: #d1d4dc;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 11;
            display: none;
        }

        /* per-chart toolbar — compact pill at top-left, fades when not hovered */
        #toolbar {
            position: absolute;
            top: 4px;
            left: 4px;
            z-index: 50;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            padding: 3px 5px;
            background: rgba(17, 20, 29, 0.85);
            border: 1px solid #2a2e39;
            border-radius: 5px;
            font-size: 11px;
            opacity: 0.55;
            transition: opacity 0.15s;
        }
        #toolbar:hover { opacity: 1; }
        #toolbar .label { color: #8a8e99; font-size: 10px; }
        #toolbar select {
            background: #1c1f26;
            color: #d1d4dc;
            border: 1px solid #2a2e39;
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 11px;
            max-width: 180px;
        }
        #toolbar #file-select { max-width: 220px; }
        #toolbar .badge {
            display: inline-block;
            padding: 1px 5px;
            background: #2a2e39;
            border-radius: 3px;
            color: #8eb4ff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }
        #toolbar .err { background: rgba(242, 54, 69, 0.4); color: #ffd3d8; }
        /* Loading overlay covering the chart area while a /smart fetch is in flight. */
        #data-loading {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(11, 12, 20, 0.78);
            color: #8eb4ff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            pointer-events: none;
        }
        #data-loading.show { display: flex; }

        /* Price-axis assertion overlay.
           Positioned at TOP-RIGHT (away from chart.js's bottom-edge X-axis
           time scrubber and right-edge price scrubber, which would otherwise
           overlap and create the unreadable mash of "pri$:8?7Axis" we saw in
           v6 screenshots). */
        #assert-banner {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 60;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            background: rgba(8, 153, 129, 0.25);
            color: #b6f3d2;
            border: 1px solid rgba(8, 153, 129, 0.4);
            display: none;
            pointer-events: none;     /* never block mouse on the chart */
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #assert-banner.fail {
            background: rgba(242, 54, 69, 0.35);
            color: #ffd3d8;
            border-color: rgba(242, 54, 69, 0.6);
        }

        /* hide chart context menu (parent shell drives UX) */
        .chart-context-menu { display: none !important; }
    </style>

    <!-- d3 (chart.js hard-requires d3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div id="chart-container">
        <div id="toolbar">
            <span class="badge" id="badge-id">—</span>
            <span class="label">file</span>
            <select id="file-select" title="Pick a CSV file (per-panel — independent of other panels)">
                <option value="">— loading… —</option>
            </select>
            <span class="label">tf</span>
            <select id="tf-select" title="Timeframe (per-panel — NOT synced)">
                <option>1m</option>
                <option>5m</option>
                <option>15m</option>
                <option>1h</option>
                <option>4h</option>
                <option>1d</option>
            </select>
            <span class="badge" id="badge-bars">0 bars</span>
        </div>

        <canvas id="chartCanvas"></canvas>
        <svg id="drawingSvg"></svg>
        <div class="crosshair-vertical"></div>
        <div class="crosshair-horizontal"></div>
        <div class="price-label"></div>
        <div class="time-label"></div>

        <div id="data-loading">Loading data…</div>
        <div id="assert-banner">price-axis OK</div>
    </div>

    <script>
        // Stub the legacy panelManager (chart.js still references window.panelManager
        // in many places — we keep it absent so guards short-circuit cleanly).
        window.panelManager = undefined;

        // No FastAPI backend in the sandbox.
        window.CHART_API_URL = '';
        // Disable the V9 settings DOM scrape (we're not in V9 here).
        window.__multichartSandbox = true;

        // Minimal stubs for optional chart.js dependencies that V9/dist-v9 normally
        // loads. These are wrapped in try/catch inside chart.js, but the unhandled
        // TypeError pollutes the iframe's console and slows the render loop.
        // chart.js uses both `userStorage.get/set` (object style) AND
        // `userStorage.getItem/setItem` (localStorage Web API style). Use a
        // Proxy that returns a no-op function for ANY unknown method/property,
        // so we never need to enumerate every call site.
        window.userStorage = new Proxy({
            // backing store so set/get round-trips work for the calls that matter
            _kv: {},
        }, {
            get: function (obj, prop) {
                if (prop === 'getItem' || prop === 'get') {
                    return function (k) { return obj._kv[k] !== undefined ? obj._kv[k] : null; };
                }
                if (prop === 'setItem' || prop === 'set') {
                    return function (k, v) { obj._kv[k] = v; return true; };
                }
                if (prop === 'removeItem' || prop === 'remove') {
                    return function (k) { delete obj._kv[k]; return true; };
                }
                if (prop === 'getJSON') {
                    return function (k, def) {
                        const v = obj._kv[k];
                        if (v === undefined) return def;
                        try { return JSON.parse(v); } catch (_) { return def; }
                    };
                }
                if (prop === 'setJSON') {
                    return function (k, v) { obj._kv[k] = JSON.stringify(v); return true; };
                }
                if (prop === 'clear') return function () { obj._kv = {}; };
                if (prop === '_kv') return obj._kv;
                if (typeof prop === 'symbol') return undefined;
                // any other call: no-op function, return undefined for fields
                return function () { return undefined; };
            },
        });
        // Drawing tools / replay / order / compare / indicators are NOT loaded in
        // the sandbox. chart.js checks `typeof X !== 'undefined'` for most of these,
        // but a couple of paths (initDrawingTools) call `new DrawingToolsManager(this)`
        // unconditionally inside try/catch. Stub minimal classes whose instances
        // accept ANY method call as a no-op (Proxy) — that way we never have to
        // chase down "missing method X" loops in chart.js's render path again.
        function makeNoopProxy(seed) {
            const target = Object.assign({
                drawings: [],
                drawingsGroup: null,
                currentTool: null,
                selectedDrawing: null,
                isActive: false,
                favoritesManager: null,
                objectTreeManager: null,
            }, seed || {});
            return new Proxy(target, {
                get: function (obj, prop) {
                    if (prop in obj) return obj[prop];
                    if (typeof prop === 'symbol') return undefined;
                    // Any unknown method: return a no-op function. Any unknown
                    // field: return undefined. chart.js checks both patterns.
                    return function () { return undefined; };
                },
                set: function (obj, prop, val) { obj[prop] = val; return true; },
                has: function () { return true; },
            });
        }
        window.DrawingToolsManager = function (chart) {
            return makeNoopProxy({ chart: chart });
        };
        window.ReplaySystem = function (chart) {
            return makeNoopProxy({ chart: chart, isActive: false });
        };
        window.OrderManager = function () { return makeNoopProxy({}); };
        // Optional ones used in init paths via typeof checks:
        window.ObjectTreeManager   = function () { return makeNoopProxy({}); };
        window.FavoritesManager    = function () { return makeNoopProxy({}); };
        window.CompareOverlay      = function () { return makeNoopProxy({}); };
        window.TimeframeFavorites  = function () { return makeNoopProxy({}); };
        window.ScreenshotManager   = function () { return makeNoopProxy({}); };
    </script>

    <!-- engine -->
    <script src="../chart.js"></script>

    <!-- sandbox-only modules. Cache-busting query string — bump on any sandbox change.
         sample-data.js was deleted in v10 — the sandbox always fetches real
         data from /api/file/{id}/smart now. -->
    <script src="./engine-api-guards.js?v=20260509T1610"></script>
    <script src="./sync-bridge.js?v=20260509T1610"></script>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const chartId   = params.get('id') || ('chart-' + Math.random().toString(36).slice(2, 6));
        const initialTf = params.get('tf') || '1m';
        const verbose   = params.get('verbose') === '1';
        // Optional URL params from the shell. When the shell does "Apply file
        // to all", iframes are recreated with these. When the user changes a
        // per-panel file, we just update local state without recreating the iframe.
        let currentFileId = params.get('fileId') || null;     // null means "no file picked yet"

        const badgeId   = document.getElementById('badge-id');
        const badgeBars = document.getElementById('badge-bars');
        const fileSel   = document.getElementById('file-select');
        const tfSel     = document.getElementById('tf-select');
        const loadingEl = document.getElementById('data-loading');

        badgeId.textContent = chartId;
        tfSel.value = initialTf;
        document.title = 'mc-' + chartId + ' ' + initialTf;

        function setLoading(on) {
            if (on) loadingEl.classList.add('show');
            else    loadingEl.classList.remove('show');
        }
        function setBars(n, isError) {
            badgeBars.textContent = (isError ? 'ERROR · ' : '') + n + ' bars';
            badgeBars.className = 'badge' + (isError ? ' err' : '');
        }

        /**
         * Send a diagnostic line up to the parent shell so it appears in the
         * bottom log even if the iframe's own console isn't open. Iframe
         * messages of this shape are NOT sync events — the manager ignores
         * unknown msg.type, but the shell's own message handler picks them up.
         */
        function reportToShell(level, text) {
            try {
                window.parent.postMessage({
                    type: 'host-log', source: chartId, level: level,
                    text: '[host:' + chartId + '] ' + text,
                }, '*');
            } catch (_) {}
            (level === 'error' ? console.error : console.log).call(console,
                '[chart-host:' + chartId + ']', text);
        }

        /**
         * Fetch a window of OHLC candles from FastAPI's /smart endpoint —
         * exact same query shape chart.js v9 builds in `_buildSmartWindowParams`.
         * Server returns { candles: [{t,o,h,l,c,v}, ...] } with t in either
         * seconds or milliseconds (auto-normalised here to ms).
         */
        async function fetchRealCandles(fid, tf) {
            const qs = new URLSearchParams({
                timeframe: tf,
                limit: '5000',
                anchor: 'end',
                response_format: 'candles',
            });
            const url = '/api/file/' + encodeURIComponent(fid) + '/smart?' + qs.toString();
            reportToShell('info', 'fetching ' + url);
            const resp = await fetch(url, { credentials: 'include', cache: 'no-store' });
            if (!resp.ok) {
                const body = await resp.text().catch(() => '');
                throw new Error('HTTP ' + resp.status + ' on ' + url
                    + ' — body: ' + body.slice(0, 120));
            }
            const ct = (resp.headers.get('content-type') || '').toLowerCase();
            if (ct && !ct.includes('json')) {
                const txt = await resp.text().catch(() => '');
                throw new Error('Expected JSON, got ' + (ct || 'unknown')
                    + ' — body: ' + txt.slice(0, 120));
            }
            const data = await resp.json();
            const raw = (data && (data.candles || data.data)) || [];
            if (!Array.isArray(raw)) {
                throw new Error('Response missing candles[] — keys: '
                    + Object.keys(data || {}).join(','));
            }
            reportToShell('info', '/smart returned ' + raw.length
                + ' raw rows for tf=' + tf + ' (limit=5000, anchor=end)');
            const out = [];
            let dropped = 0;
            for (let i = 0; i < raw.length; i++) {
                const c = raw[i];
                if (!c || typeof c !== 'object') { dropped++; continue; }
                let t = Number(c.t ?? c.time);
                const o = Number(c.o ?? c.open);
                const h = Number(c.h ?? c.high);
                const l = Number(c.l ?? c.low);
                const cl = Number(c.c ?? c.close);
                let v = Number(c.v ?? c.volume);
                if (!Number.isFinite(v)) v = 0;
                if (Number.isFinite(t) && t < 1e11) t *= 1000;     // s -> ms
                if (Number.isFinite(t) && Number.isFinite(o) && Number.isFinite(h)
                 && Number.isFinite(l) && Number.isFinite(cl)) {
                    out.push({ t, o, h, l, c: cl, v });
                } else {
                    dropped++;
                }
            }
            reportToShell('info', 'normalised ' + out.length + ' candles, dropped '
                + dropped + ' invalid rows');
            return out;
        }

        function applyCandles(chart, sym, tf, candles, sourceLabel) {
            chart.rawData = candles.slice();
            chart.data = candles.slice();
            chart.dataVersion++;
            chart.currentSymbol = sym;
            chart.currentTimeframe = tf;
            chart.totalCandles = candles.length;
            try { chart.fitToView && chart.fitToView(); } catch (_) {}
            try { chart.scheduleRender ? chart.scheduleRender() : chart.render(); } catch (_) {}
            try {
                window.dispatchEvent(new CustomEvent('chartDataLoaded', {
                    detail: { symbol: sym, timeframe: tf, source: sourceLabel,
                              candleCount: candles.length },
                }));
            } catch (_) {}
            setBars(candles.length, false);
            reportToShell('info', 'loaded ' + candles.length + ' ' + tf
                + ' candles (' + sourceLabel + ')');
        }

        /**
         * Load real OHLC data for the given fileId+tf into `chart`. v10: there
         * is NO synthetic fallback — if the fetch fails, we surface the error
         * in the per-chart badge and the parent shell log instead of silently
         * showing fake data.
         */
        function loadDataInto(chart, fid, tf) {
            if (!fid) {
                setBars(0, true);
                reportToShell('warn', 'no file selected — pick one from the per-panel dropdown');
                chart.rawData = []; chart.data = []; chart.totalCandles = 0;
                try { chart.scheduleRender ? chart.scheduleRender() : chart.render(); } catch (_) {}
                return;
            }
            setLoading(true);
            // Resolve a friendly symbol label from the cached file list.
            const meta = (window.__filesById && window.__filesById[fid]) || null;
            const sym  = (meta && (meta.symbol || meta.ticker)) || ('#' + fid);
            document.title = 'mc-' + chartId + ' ' + sym + ' ' + tf;

            fetchRealCandles(fid, tf).then(function (candles) {
                setLoading(false);
                if (!candles.length) {
                    setBars(0, true);
                    reportToShell('error', '/smart returned 0 candles for fileId=' + fid + ' tf=' + tf);
                    return;
                }
                applyCandles(chart, sym, tf, candles, 'file#' + fid);
            }).catch(function (e) {
                setLoading(false);
                setBars(0, true);
                reportToShell('error', 'real-data fetch failed: ' + (e && e.message || e));
            });
        }

        /**
         * Format epoch-ms as a YYYY-MM-DD date string for option labels.
         */
        function fmtDate(ms) {
            if (!Number.isFinite(ms)) return '';
            const d = new Date(ms);
            return d.getUTCFullYear() + '-'
                 + String(d.getUTCMonth() + 1).padStart(2, '0') + '-'
                 + String(d.getUTCDate()).padStart(2, '0');
        }

        /**
         * Fetch /api/files once on init, populate the per-panel file dropdown,
         * and cache by id for symbol-label lookups.
         *
         * v10.3: also caches each file's start_ts / end_ts so the per-panel
         * dropdown can show date ranges and so on-change we can warn the
         * user when a selection won't overlap with other panels' ranges.
         */
        async function loadFileList() {
            try {
                const resp = await fetch('/api/files', { credentials: 'include', cache: 'no-store' });
                if (!resp.ok) {
                    const errBody = await resp.text().catch(() => '');
                    throw new Error('HTTP ' + resp.status + ' ' + (resp.statusText || '')
                        + ' — ' + errBody.slice(0, 200));
                }
                // v10.3.2: server may return { files: [], error: "..." } when
                // a row is bad — surface that explicitly instead of silently
                // showing "no files".
                let data;
                try {
                    data = await resp.json();
                } catch (jsonErr) {
                    throw new Error('JSON parse failed: ' + jsonErr.message
                        + ' (server returned non-JSON, possibly NaN)');
                }
                if (data && data.error) {
                    throw new Error('server: ' + data.error);
                }
                const files = (data && (data.files || data)) || [];
                if (!Array.isArray(files) || !files.length) {
                    fileSel.innerHTML = '<option value="">— no files on server —</option>';
                    reportToShell('warn', '/api/files returned 0 files');
                    return [];
                }
                window.__filesById = {};
                fileSel.innerHTML = '';
                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = '— pick a file —';
                fileSel.appendChild(placeholder);
                files.forEach(function (f) {
                    const id = String(f.id ?? f.file_id ?? f.fileId);
                    const sym = f.symbol || f.ticker || '?';
                    const tf  = f.timeframe || f.tf || '';
                    const rows = f.rows || f.row_count || '';
                    const startTs = Number(f.start_ts);
                    const endTs   = Number(f.end_ts);
                    const dateStr = (Number.isFinite(startTs) && Number.isFinite(endTs))
                        ? ' ' + fmtDate(startTs) + '→' + fmtDate(endTs) : '';
                    const label = '#' + id + ' ' + sym + (tf ? ' ' + tf : '')
                        + (rows ? ' (' + Number(rows).toLocaleString() + ')' : '')
                        + dateStr;
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = label;
                    fileSel.appendChild(opt);
                    window.__filesById[id] = {
                        id: id, symbol: sym, timeframe: tf, rows: rows,
                        startTs: Number.isFinite(startTs) ? startTs : null,
                        endTs:   Number.isFinite(endTs)   ? endTs   : null,
                    };
                });
                if (currentFileId && window.__filesById[currentFileId]) {
                    fileSel.value = currentFileId;
                }
                reportToShell('info', '/api/files loaded ' + files.length + ' entries');
                return files;
            } catch (e) {
                fileSel.innerHTML = '<option value="">— /api/files error —</option>';
                reportToShell('error', '/api/files failed: ' + (e && e.message || e));
                return [];
            }
        }

        function start() {
            // chart.js auto-runs `new Chart()` on DOMContentLoaded when
            // #chartCanvas exists. It assigns the instance to window.chart.
            // Reuse that instance — do NOT construct a second one (would
            // double-attach event listeners on the same canvas).
            const chart = window.chart;
            if (!chart) {
                console.error('[multichart-host] window.chart not initialized; aborting');
                return;
            }

            // chart.js's dispatchScrollSync (line 8533) bails out before
            // emitting the 'chartScrolled' CustomEvent unless BOTH:
            //   (a) `window.panelManager` exists AND `currentLayout !== '1'`
            //       (line 8536 guard), AND
            //   (b) `chart.panel` is truthy OR a panelManager panel matches
            //       (line 8593-8608 sourcePanel lookup).
            // Our sandbox has neither — we deliberately removed panelManager
            // and never call `setPanel()`. So pan/zoom never fires the event
            // the sync bridge listens for, and visible-range sync silently
            // does nothing.
            //
            // Fix: replace dispatchScrollSync with a minimal version that
            // always emits `chartScrolled` with the same payload chart.js
            // would emit. This keeps the rest of the panelManager code paths
            // dormant (still safe for our sandbox) while making the bridge work.
            chart.panel = { chartInstance: chart, isMultichartSandbox: true };
            chart.dispatchScrollSync = function (force) {
                if (!this.data || this.data.length === 0) return;
                const startIndex = typeof this.getVisibleStartIndex === 'function'
                    ? this.getVisibleStartIndex() : 0;
                const endIndex = typeof this.getVisibleEndIndex === 'function'
                    ? this.getVisibleEndIndex() : Math.max(0, this.data.length - 1);
                const startTimestamp = this.data[startIndex]?.t ?? 0;
                const barMs = (typeof this.inferBarDurationMs === 'function')
                    ? this.inferBarDurationMs() : 60000;
                const endTimestamp = (this.data[endIndex]?.t ?? 0) + barMs;

                const m = this.margin || { l: 0, r: 60 };
                const spacing = this.getCandleSpacing ? this.getCandleSpacing()
                                                      : (this.candleWidth + 2);
                const rightEdgePx = this.w - m.r;
                const idxAtRight = (rightEdgePx - m.l - this.offsetX) / spacing;
                const i0 = Math.max(0, Math.min(this.data.length - 1, Math.floor(idxAtRight)));
                const i1 = Math.max(i0, Math.min(this.data.length - 1, i0 + 1));
                const t0 = Number(this.data[i0]?.t);
                const t1 = Number(this.data[i1]?.t);
                let rightEdgeTimestamp = t0;
                if (Number.isFinite(t0) && Number.isFinite(t1) && i1 !== i0 && t1 > t0) {
                    const frac = Math.max(0, Math.min(1, idxAtRight - i0));
                    rightEdgeTimestamp = t0 + (t1 - t0) * frac;
                } else if (!Number.isFinite(rightEdgeTimestamp)) {
                    rightEdgeTimestamp = Number(this.data[i0]?.t) || 0;
                }
                const timeSyncEndTimestamp = rightEdgeTimestamp + barMs;

                window.dispatchEvent(new CustomEvent('chartScrolled', {
                    detail: {
                        chart: this,
                        panel: this.panel,
                        startIndex,
                        endIndex,
                        rightEdgeBarIndex: i0,
                        timeSyncEndTimestamp,
                        startTimestamp,
                        endTimestamp,
                        rangeEndExclusive: endTimestamp,
                        offsetX: this.offsetX,
                        candleWidth: this.candleWidth,
                    },
                }));
            };

            // ──────────────────────────────────────────────────────────────
            // v10.2: cross-ticker crosshair sync fix
            //
            // chart.js's `receiveCrosshairSync` (chart.js:20568) positions
            // the vertical line by BAR-INDEX lookup (`dataIndexToPixel(idx)`,
            // chart.js:20621). With cross-ticker sync (panel A=GBPUSD, panel
            // B=ES) trading hours and time coverage differ, so the
            // recipient's "last bar at-or-before synced time" is at a
            // different X than where the synced wall-clock time should
            // actually fall on the time axis.
            //
            // v10.1 attempted to fix this by clamping the crosshair to the
            // nearest visible edge when the synced time was off-screen, but
            // the user reported (2026-05-09) that the dim edge-clamped line
            // looked like the chart had "jumped to the first/last candle" —
            // visually misleading.
            //
            // v10.2 (this version):
            //   • Same wall-clock-time X math as v10.1 (extrapolate from the
            //     nearest bar's pixel: `refX + (syncedMs - refMs)/barMs *
            //     spacing`). When synced time IS within the visible window,
            //     the crosshair lands at the time-correct X with full
            //     opacity — same as v10.1 in the success case.
            //   • When synced time is OUTSIDE the visible window: HIDE the
            //     crosshair entirely (no clamp, no jump, no faint line at
            //     the edge). The recipient panel stays visually unchanged
            //     until the user pans it into the synced time range manually.
            //   • Same-ticker / overlapping ranges still get full crosshair
            //     sync; only off-window cases hide gracefully.
            //
            // OHLC values still come from the recipient's nearest bar (so
            // each panel's header shows its own ticker's prices, not the
            // source ticker's).
            chart.receiveCrosshairSync = function (timestamp, price, sourceCandle) {
                const c = this;
                const container = c.canvas && c.canvas.parentElement;
                if (!container) return;
                const vLine = container.querySelector('.crosshair-vertical');
                const hLine = container.querySelector('.crosshair-horizontal');
                const priceLabel = container.querySelector('.price-label');
                const timeLabel  = container.querySelector('.time-label');
                const hideAll = function () {
                    if (vLine) vLine.style.display = 'none';
                    if (hLine) hLine.style.display = 'none';
                    if (priceLabel) priceLabel.style.display = 'none';
                    if (timeLabel) timeLabel.style.display = 'none';
                };

                // Hide path: shell or peer cleared the crosshair.
                if (timestamp === null || timestamp === undefined) {
                    hideAll();
                    c.currentCrosshairTimestamp = null;
                    return;
                }
                if (c._crosshairPanelSyncAllowed && !c._crosshairPanelSyncAllowed()) return;
                if (!c.data || c.data.length === 0) return;
                if (c.chartSettings && c.chartSettings.showCrosshair === false) {
                    hideAll();
                    return;
                }

                const m = c.margin || { l: 60, r: 60, t: 10, b: 30 };
                const refIdx = (typeof c.findLastDataIndexAtOrBeforeTime === 'function')
                    ? c.findLastDataIndexAtOrBeforeTime(timestamp) : 0;
                const refBar = c.data[refIdx];
                if (!refBar || !Number.isFinite(refBar.t)) { hideAll(); return; }

                const refX = (typeof c.dataIndexToPixel === 'function')
                    ? c.dataIndexToPixel(refIdx)
                    : (m.l + refIdx * (c.candleWidth + 2) + (c.offsetX || 0));
                const barMs = ((typeof c.inferBarDurationMs === 'function')
                    ? c.inferBarDurationMs() : 60000) || 60000;
                const spacing = ((typeof c.getCandleSpacing === 'function')
                    ? c.getCandleSpacing() : (c.candleWidth + 2)) || 1;
                // Normalize both the reference bar time and the synced time to ms.
                const refMs = refBar.t > 1e12 ? refBar.t : refBar.t * 1000;
                const synMs = timestamp   > 1e12 ? timestamp   : timestamp   * 1000;
                const xExact = refX + ((synMs - refMs) / barMs) * spacing;

                const leftEdge  = m.l;
                const rightEdge = (c.w || container.clientWidth || 800) - m.r;
                // v10.2: synced time outside visible window → hide everything,
                // no clamping, no edge artefacts.
                if (xExact < leftEdge || xExact > rightEdge) {
                    hideAll();
                    c.currentCrosshairTimestamp = timestamp;
                    return;
                }

                const candle = (typeof c.getDisplayCandle === 'function')
                    ? c.getDisplayCandle(refIdx) : refBar;
                const crossWidth = Math.max(1, parseInt(
                    c.chartSettings && c.chartSettings.crosshairWidth, 10) || 2);

                // 1) Vertical line at the wall-clock-correct X.
                if (vLine) {
                    vLine.style.cssText =
                        'position:absolute;top:0;width:' + crossWidth + 'px;'
                      + 'height:calc(100% - 30px);'
                      + 'background:repeating-linear-gradient(to bottom,#787b86 0px,'
                      +   '#787b86 4px,transparent 4px,transparent 8px);'
                      + 'pointer-events:none;z-index:100;'
                      + 'left:' + xExact + 'px;display:block;';
                }

                // 2) Horizontal line + price label — anchored to recipient's
                //    own price scale (NEVER read price from source: that's a
                //    forbidden cross-axis leak per Phase 0 Decision 1).
                if (hLine && c.yScale && candle) {
                    const displayPrice = (price !== null && price !== undefined && Number.isFinite(price))
                        ? price : (candle.h + candle.l) / 2;
                    let y;
                    try { y = c.yScale(displayPrice); } catch (_) { y = NaN; }
                    if (Number.isFinite(y) && y >= m.t && y <= (c.h || container.clientHeight) - m.b) {
                        hLine.style.cssText =
                            'position:absolute;left:' + m.l + 'px;'
                          + 'width:' + ((c.w || container.clientWidth) - m.l - m.r) + 'px;'
                          + 'height:' + crossWidth + 'px;'
                          + 'background:repeating-linear-gradient(to right,#787b86 0px,'
                          +   '#787b86 4px,transparent 4px,transparent 8px);'
                          + 'pointer-events:none;z-index:100;'
                          + 'top:' + y + 'px;display:block;';
                        if (priceLabel) {
                            const range = c.yScale.domain ? c.yScale.domain() : [0, 1];
                            const dec = (typeof c.getPriceDecimals === 'function')
                                ? c.getPriceDecimals(Math.abs(range[1] - range[0])) : 4;
                            priceLabel.textContent = displayPrice.toFixed(dec);
                            priceLabel.style.cssText =
                                'position:absolute;right:5px;top:' + (y - 10) + 'px;'
                              + 'background:#363a45;color:#d1d4dc;padding:2px 6px;'
                              + 'font-size:11px;border-radius:2px;z-index:101;'
                              + 'display:block;';
                        }
                    } else {
                        hLine.style.display = 'none';
                        if (priceLabel) priceLabel.style.display = 'none';
                    }
                }

                // 3) Time label — synced wall-clock time at xExact.
                if (timeLabel) {
                    let labelMs = synMs;
                    if (typeof c.normalizeTimestampMs === 'function') {
                        const nt = c.normalizeTimestampMs(timestamp);
                        if (Number.isFinite(nt) && nt > 0) labelMs = nt;
                    }
                    const tzDate = (typeof c.convertToTimezone === 'function')
                        ? c.convertToTimezone(labelMs) : new Date(labelMs);
                    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                                    'Jul','Aug','Sep','Oct','Nov','Dec'];
                    const month = months[tzDate.getUTCMonth()];
                    const day   = tzDate.getUTCDate();
                    const year  = tzDate.getUTCFullYear();
                    let timeStr;
                    if (barMs >= 86400000) {
                        timeStr = month + ' ' + day + ', ' + year;
                    } else {
                        const hh = String(tzDate.getUTCHours()).padStart(2, '0');
                        const mm = String(tzDate.getUTCMinutes()).padStart(2, '0');
                        timeStr = month + ' ' + day + ', ' + year + ', ' + hh + ':' + mm;
                    }
                    const bottomPx = Math.max(2, Math.floor((m.b || 30) * 0.2));
                    timeLabel.textContent = timeStr;
                    timeLabel.style.cssText =
                        'position:absolute;left:' + xExact + 'px;top:auto;'
                      + 'bottom:' + bottomPx + 'px;transform:translateX(-50%);'
                      + 'background:#363a45;color:#d1d4dc;padding:2px 6px;'
                      + 'font-size:11px;border-radius:2px;white-space:nowrap;'
                      + 'z-index:101;display:block;';
                }

                c.currentCrosshairTimestamp = timestamp;
                if (typeof c.updateOHLCFromCandle === 'function' && candle) {
                    try { c.updateOHLCFromCandle(candle); } catch (_) {}
                }
            };

            // Per-panel file picker. Wires AFTER /api/files has populated it.
            // Changing the file is LOCAL to this iframe — it does NOT broadcast
            // a symbol-sync event. Use the shell's "Apply file to all" button
            // for that.
            //
            // v10.3.1: data ALWAYS loads. The shell shows a passive amber
            // banner above the charts when the resulting date ranges don't
            // overlap (informational only, not blocking).
            fileSel.addEventListener('change', function (e) {
                const newId = e.target.value || null;
                currentFileId = newId;
                loadDataInto(chart, newId, tfSel.value);
            });

            // Per-panel timeframe selector — local only, NOT a sync event.
            tfSel.addEventListener('change', function (e) {
                const newTf = e.target.value;
                loadDataInto(chart, currentFileId, newTf);
                try { chart.setTimeframe && chart.setTimeframe(newTf); } catch (_) {}
            });

            // Shell-driven "set this file in this iframe" — used by the
            // "Apply file to all" toolbar button. Shell sends:
            //   { type: 'set-file', fileId: '27' }
            window.addEventListener('message', function (ev) {
                const m = ev.data;
                if (!m || m.type !== 'set-file') return;
                const newId = m.fileId ? String(m.fileId) : null;
                currentFileId = newId;
                if (newId && window.__filesById && window.__filesById[newId]) {
                    fileSel.value = newId;
                }
                loadDataInto(chart, newId, tfSel.value);
            });

            // Initial data fetch — only if a file was passed via URL params.
            // Otherwise we wait for the user to pick one.
            if (currentFileId) {
                loadDataInto(chart, currentFileId, initialTf);
            } else {
                setBars(0, false);
                badgeBars.textContent = 'pick a file →';
            }

            // Assertion banner — listen to bridge reports via parent? No, we
            // also listen locally: the bridge's reportAssertion function posts
            // up to parent, but we want a local indicator. Subscribe via a
            // CustomEvent the bridge could fire. Simpler: just intercept here.
            // We'll fire our own CustomEvent.
            // v10: only show the banner when an assertion FAILS — silent on OK.
            // The shell's counter panel ("Run guard self-test", per-chart loop=0/fail=0)
            // already shows successful pass-throughs aggregated, so an always-flashing
            // green badge in the chart corner is just visual noise.
            window.addEventListener('multichart:assertion', function (ev) {
                if (ev.detail && ev.detail.ok) return;     // success is silent
                const banner = document.getElementById('assert-banner');
                banner.style.display = 'block';
                banner.classList.add('fail');
                banner.textContent = 'LEAK ' + (ev.detail && ev.detail.syncType) + ': '
                    + ((ev.detail && ev.detail.violations) || []).join('; ');
                clearTimeout(window.__assertHide);
                window.__assertHide = setTimeout(function () {
                    banner.style.display = 'none';
                }, 4000);
            });

            // Install bridge
            const bridge = window.MultichartBridge.installBridge(chart, {
                chartId: chartId,
                parentOrigin: '*',
                verbose: verbose,
            });
            window.__multichartBridge = bridge;

            // Mirror bridge assertion reports as local CustomEvent so the
            // banner can update without parent round-trip.
            const origPost = window.parent.postMessage.bind(window.parent);
            window.parent.postMessage = function (msg, target) {
                if (msg && msg.type === 'assertion-report') {
                    try {
                        window.dispatchEvent(new CustomEvent('multichart:assertion', { detail: msg }));
                    } catch (_) {}
                }
                return origPost(msg, target);
            };

            // Symbol-change broadcasts from the shell (sync event) — match
            // by symbol against the cached file list and switch this iframe's
            // file to the first match. We deliberately do NOT propagate this
            // back as another symbol event (the bridge already handles loop
            // suppression).
            window.addEventListener('multichart:symbol-change', function (ev) {
                const sym = ev.detail && ev.detail.symbol;
                if (!sym || !window.__filesById) return;
                const ids = Object.keys(window.__filesById);
                const match = ids.find(function (id) {
                    return (window.__filesById[id].symbol || '').toUpperCase() === sym.toUpperCase();
                });
                if (match) {
                    currentFileId = match;
                    fileSel.value = match;
                    loadDataInto(chart, match, tfSel.value);
                }
            });

            // Kick off the per-iframe file list load. Once it returns, if the
            // iframe was created without a fileId URL param, we leave the
            // user to pick one. If it was created WITH one, the early
            // loadDataInto above already started fetching candles.
            loadFileList();
        }

        // Wait for chart.js auto-init to finish creating window.chart.
        function ready() {
            if (window.chart && typeof d3 !== 'undefined' && window.MultichartBridge) {
                start();
            } else {
                setTimeout(ready, 50);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', ready);
        } else {
            ready();
        }
    })();
    </script>
</body>
</html>
