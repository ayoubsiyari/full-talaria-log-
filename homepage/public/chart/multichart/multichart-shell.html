<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multichart Sandbox — Talaria</title>
    <link rel="stylesheet" href="multichart.css" />
</head>
<body>
<div class="app">

    <header class="topbar">
        <h1>Multichart Sandbox <span style="color:#6ed3a4;font-size:11px;font-weight:600;margin-left:6px">build 2026-05-09T12:42 (v6 — visibleRange sync via patched dispatchScrollSync)</span></h1>

        <div class="group">
            <label>Layout</label>
            <select id="layout-select">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="2x2">2×2</option>
            </select>
        </div>

        <div class="group">
            <label>Symbol</label>
            <select id="symbol-select">
                <option>AAPL</option>
                <option>TSLA</option>
                <option>MSFT</option>
                <option>EURUSD</option>
                <option>BTCUSD</option>
                <option>NQ</option>
            </select>
            <button id="apply-symbol" title="Broadcast this symbol to all charts (sync)">Apply to all</button>
        </div>

        <div class="group">
            <label><input type="checkbox" id="sync-crosshair" checked /> Crosshair</label>
            <label><input type="checkbox" id="sync-visible" checked /> Visible range</label>
            <label><input type="checkbox" id="sync-symbol" checked /> Symbol</label>
        </div>

        <div class="group">
            <button id="self-test">Run guard self-test</button>
            <button id="diagnose" class="primary">Diagnose</button>
            <button id="clear-log">Clear log</button>
        </div>

        <div class="group" style="margin-left:auto">
            <span class="counter" title="user-originated sync events forwarded">out: <span id="ctr-out">0</span></span>
            <span class="counter" title="loop-guard drops">loop: <span id="ctr-loop">0</span></span>
            <span class="counter" title="forbidden-field drops (should always be 0)">fbid: <span id="ctr-fbid">0</span></span>
            <span class="counter" title="price-axis assertion passes">ok: <span id="ctr-ok">0</span></span>
            <span class="counter" title="price-axis assertion failures (should be 0)">fail: <span id="ctr-fail">0</span></span>
        </div>
    </header>

    <section class="charts" id="charts-area"></section>

    <section class="bottom">
        <div class="log" id="log"></div>
        <div class="assertions" id="assertions">
            <h3>Per-chart status</h3>
            <div id="chart-states"></div>
        </div>
    </section>
</div>

<script src="engine-api-guards.js"></script>
<script src="multichart-manager.js"></script>
<script>
(function () {
    const chartsArea = document.getElementById('charts-area');
    const logEl = document.getElementById('log');
    const layoutSel = document.getElementById('layout-select');
    const symbolSel = document.getElementById('symbol-select');

    const ctrOut  = document.getElementById('ctr-out');
    const ctrLoop = document.getElementById('ctr-loop');
    const ctrFbid = document.getElementById('ctr-fbid');
    const ctrOk   = document.getElementById('ctr-ok');
    const ctrFail = document.getElementById('ctr-fail');

    /** Predefined layouts for the verification matrix:
     *  1   — single chart (sanity)
     *  2   — Phase 2/3/4: 1m + 1h side by side
     *  3   — Phase 5.2: 1m + 5m + 1h
     *  2x2 — Phase 5.2 stretch: four mismatched timeframes
     */
    const LAYOUTS = {
        '1':   { gridCols: '1fr',                   gridRows: '1fr',       dividers: 0,
                 charts: [
                     { id: 'A', symbol: 'AAPL', tf: '1m' },
                 ] },
        '2':   { gridCols: '1fr 14px 1fr',          gridRows: '1fr',       dividers: 1,
                 charts: [
                     { id: 'A', symbol: 'AAPL', tf: '1m' },
                     { id: 'B', symbol: 'AAPL', tf: '1h' },
                 ] },
        '3':   { gridCols: '1fr 14px 1fr 14px 1fr', gridRows: '1fr',       dividers: 2,
                 charts: [
                     { id: 'A', symbol: 'AAPL', tf: '1m' },
                     { id: 'B', symbol: 'AAPL', tf: '5m' },
                     { id: 'C', symbol: 'AAPL', tf: '1h' },
                 ] },
        '2x2': { gridCols: '1fr 14px 1fr', gridRows: '1fr 14px 1fr', dividers: 4,
                 charts: [
                     { id: 'A', symbol: 'AAPL', tf: '1m' },
                     { id: 'B', symbol: 'AAPL', tf: '15m' },
                     { id: 'C', symbol: 'AAPL', tf: '1h' },
                     { id: 'D', symbol: 'AAPL', tf: '1d' },
                 ] },
    };

    let manager = null;
    const chartStates = {};

    function appendLog(entry) {
        const div = document.createElement('div');
        div.className = 'row ' + entry.level;
        const ts = new Date(entry.ts).toISOString().slice(11, 23);
        div.innerHTML = '<span class="ts">' + ts + '</span>'
                      + '[' + entry.level.toUpperCase() + '] '
                      + escapeHtml(entry.text);
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
        // Cap log size to avoid unbounded growth during stress tests.
        while (logEl.childElementCount > 1500) logEl.removeChild(logEl.firstChild);
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
        });
    }

    function refreshCounters() {
        if (!manager) return;
        ctrOut.textContent  = manager.counters.outFromUser;
        ctrLoop.textContent = manager.counters.droppedLoop;
        ctrFbid.textContent = manager.counters.droppedForbidden;
        ctrOk.textContent   = manager.counters.assertionsOk;
        ctrFail.textContent = manager.counters.assertionsFail;
    }
    setInterval(refreshCounters, 250);

    function renderChartStates() {
        const host = document.getElementById('chart-states');
        host.innerHTML = '';
        if (!manager) return;
        for (const c of manager.getCharts()) {
            const s = c.state || {};
            const div = document.createElement('div');
            div.className = 'item ' + (c.ready ? 'pass' : 'fail');
            const readyMark = c.ready ? '\u2713 ready' : '\u26A0 NOT ready';
            div.innerHTML =
                '<span class="name">' + c.id + ' <small style="color:#5a5e69">' + readyMark + '</small></span>' +
                '<span class="val">' + (s.symbol || '?') + ' / ' + (s.timeframe || '?') +
                ' / ' + (s.candleCount || 0) + ' bars</span>';
            host.appendChild(div);
        }
    }
    setInterval(renderChartStates, 500);

    /** Build the chart cells + dividers for a layout. */
    function applyLayout(name) {
        const cfg = LAYOUTS[name];
        if (!cfg) return;

        // Tear down existing manager + DOM
        if (manager) manager.dispose();
        chartsArea.innerHTML = '';

        chartsArea.style.gridTemplateColumns = cfg.gridCols;
        chartsArea.style.gridTemplateRows    = cfg.gridRows;

        manager = new MultichartManager({
            container: chartsArea,
            onLog:    appendLog,
            onState:  function (id, state) { chartStates[id] = state; },
            onAssertion: function (msg) { /* counters are read off manager.counters */ },
        });
        window.__manager = manager;

        // Build cells in the order: cell, divider, cell, divider, cell ...
        // For 2x2 we lay out manually.
        if (name === '2x2') {
            // 3 cols × 3 rows (cell, div, cell × 3 rows)
            const positions = [
                { col: 1, row: 1, chart: cfg.charts[0] },
                { col: 3, row: 1, chart: cfg.charts[1] },
                { col: 1, row: 3, chart: cfg.charts[2] },
                { col: 3, row: 3, chart: cfg.charts[3] },
            ];
            for (const p of positions) {
                const cell = makeCell(p.chart);
                cell.style.gridColumn = String(p.col);
                cell.style.gridRow    = String(p.row);
                chartsArea.appendChild(cell);
                manager.addChart(p.chart, cell);
            }
            // Vertical divider (col 2, all rows)
            const vDiv = makeDivider('col');
            vDiv.style.gridColumn = '2';
            vDiv.style.gridRow    = '1 / span 3';
            chartsArea.appendChild(vDiv);
            // Horizontal divider (row 2, all cols)
            const hDiv = makeDivider('row');
            hDiv.style.gridRow    = '2';
            hDiv.style.gridColumn = '1 / span 3';
            chartsArea.appendChild(hDiv);

            installDividerDrag(vDiv, 'col');
            installDividerDrag(hDiv, 'row');
        } else {
            for (let i = 0; i < cfg.charts.length; i++) {
                const cell = makeCell(cfg.charts[i]);
                chartsArea.appendChild(cell);
                manager.addChart(cfg.charts[i], cell);
                if (i < cfg.charts.length - 1) {
                    const div = makeDivider('col');
                    chartsArea.appendChild(div);
                    installDividerDrag(div, 'col');
                }
            }
        }

        // initial sync mode
        manager.setSyncMode({
            crosshair: document.getElementById('sync-crosshair').checked,
            visibleRange: document.getElementById('sync-visible').checked,
            symbol: document.getElementById('sync-symbol').checked,
        });

        // Diagnostic: confirm the dividers are present + interactive.
        setTimeout(function () {
            const divs = chartsArea.querySelectorAll('.divider');
            appendLog({ ts: Date.now(), level: 'info',
                text: 'layout=' + name + ': ' + divs.length + ' divider(s) installed; '
                    + 'gridCols="' + chartsArea.style.gridTemplateColumns + '" '
                    + 'gridRows="' + chartsArea.style.gridTemplateRows + '"' });
            divs.forEach(function (d, i) {
                const r = d.getBoundingClientRect();
                appendLog({ ts: Date.now(), level: 'info',
                    text: 'divider[' + i + '] rect={x:' + r.x.toFixed(0)
                        + ', y:' + r.y.toFixed(0)
                        + ', w:' + r.width.toFixed(0)
                        + ', h:' + r.height.toFixed(0) + '}' });
            });
        }, 100);
    }

    function makeCell(chartCfg) {
        const cell = document.createElement('div');
        cell.className = 'chart-cell';
        cell.setAttribute('data-id', chartCfg.id);
        const lbl = document.createElement('div');
        lbl.className = 'chart-cell-label';
        lbl.textContent = chartCfg.id + ' · ' + chartCfg.symbol + ' · ' + chartCfg.tf;
        cell.appendChild(lbl);
        return cell;
    }

    function makeDivider(orient) {
        const d = document.createElement('div');
        d.className = 'divider' + (orient === 'row' ? ' row' : '');
        // Inline styles so we don't depend on the user having deployed the
        // updated multichart.css. (drag-fix v3 deployment race.)
        d.style.background    = '#ff3366';     // unmissable bright pink
        d.style.position      = 'relative';
        d.style.zIndex        = '100';
        d.style.touchAction   = 'none';
        d.style.cursor        = orient === 'row' ? 'row-resize' : 'col-resize';
        d.style.display       = 'flex';
        d.style.alignItems    = 'center';
        d.style.justifyContent = 'center';
        d.style.userSelect    = 'none';
        d.style.fontFamily    = 'monospace';
        d.style.color         = '#fff';
        d.style.fontSize      = '14px';
        d.textContent         = orient === 'row' ? '⋯⋯ DRAG ⋯⋯' : '⋮';
        // Widen the hit area without changing visual width.
        d.title = 'Drag me to resize';
        return d;
    }

    /**
     * Notify each iframe's chart.js that its container resized.
     * chart.js listens for `resize` on its OWN window (chart.js:588) — so we
     * must dispatch the event INSIDE each iframe's contentWindow, not the
     * parent shell. Same-origin iframes allow this directly.
     *
     * Step 5.1 deliverable: "When a chart's container resizes (because the
     * user moved the divider), the chart must recompute its price axis to
     * fit its visible candles."
     */
    let _resizeRaf = 0;
    let _resizeLogCount = 0;
    function notifyChartsResized() {
        if (_resizeRaf) return;
        _resizeRaf = requestAnimationFrame(function () {
            _resizeRaf = 0;
            if (!manager) return;
            const calls = [];
            for (const c of manager.getCharts()) {
                try {
                    const cw = c.frame && c.frame.contentWindow;
                    if (!cw) { calls.push(c.id + ':no-cw'); continue; }
                    const ch = cw.chart;
                    if (!ch) {
                        // Fall back to event dispatch if chart instance not exposed.
                        const Ev = cw.Event || Event;
                        cw.dispatchEvent(new Ev('resize'));
                        calls.push(c.id + ':event-only(no-chart)');
                        continue;
                    }
                    // Direct call — bypass any event throttling chart.js might
                    // do internally and avoid the synthetic-event ordering quirk.
                    if (typeof ch.resize === 'function') ch.resize();
                    if (typeof ch.scheduleRender === 'function') ch.scheduleRender();
                    else if (typeof ch.render === 'function') ch.render();
                    // Also dispatch the event for any other listeners that may rely on it.
                    const Ev = cw.Event || Event;
                    cw.dispatchEvent(new Ev('resize'));
                    calls.push(c.id + ':direct-resize(w=' + (ch.w || '?') + ',h=' + (ch.h || '?') + ')');
                } catch (e) {
                    console.warn('[shell] resize call failed for', c.id, e);
                    calls.push(c.id + ':ERROR ' + e.message);
                }
            }
            // Log only one in every ~30 calls to avoid spamming during the drag,
            // but always log the first few so the user sees confirmation.
            _resizeLogCount++;
            if (_resizeLogCount < 5 || _resizeLogCount % 30 === 0) {
                appendLog({ ts: Date.now(), level: 'info',
                    text: 'notifyChartsResized #' + _resizeLogCount + ': ' + calls.join(' | ') });
            }
        });
    }

    /**
     * Drag a divider. We can't just set `style.width` on the neighbour
     * cells because CSS grid (`grid-template-columns: 1fr 6px 1fr`) ignores
     * child widths — the grid tracks dictate cell sizes. Instead, update
     * `chartsArea.style.gridTemplateColumns` (or rows) to explicit pixel
     * sizes for each track during drag.
     */
    function installDividerDrag(divEl, orient) {
        let dragging = false;
        let startPos = 0;
        let prevSize = 0, nextSize = 0, prevEl = null, nextEl = null;
        let totalSize = 0;
        let prevTrackIdx = -1, nextTrackIdx = -1;

        function getTracks() {
            const cs = window.getComputedStyle(chartsArea);
            const tpl = orient === 'col' ? cs.gridTemplateColumns : cs.gridTemplateRows;
            // Computed value is space-separated px values, e.g. "504px 6px 504px"
            return tpl.split(/\s+/).map(s => parseFloat(s) || 0);
        }
        function setTracks(tracks) {
            const css = tracks.map(v => v + 'px').join(' ');
            if (orient === 'col') chartsArea.style.gridTemplateColumns = css;
            else                  chartsArea.style.gridTemplateRows    = css;
        }

        // Pointer Events API gives us reliable cross-iframe drag tracking via
        // setPointerCapture: once captured, ALL pointermove events for that
        // pointer are routed to the divider element until release, even if the
        // pointer is over an iframe. This is the modern equivalent of the
        // pointer-events:none-on-iframes trick and is the canonical way to
        // implement drag handles next to iframes.
        let activePointerId = null;
        divEl.addEventListener('pointerdown', function (e) {
            if (e.button !== 0) return;
            dragging = true;
            activePointerId = e.pointerId;
            try { divEl.setPointerCapture(e.pointerId); } catch (_) {}
            divEl.classList.add('dragging');
            startPos = (orient === 'col' ? e.clientX : e.clientY);
            prevEl = divEl.previousElementSibling;
            nextEl = divEl.nextElementSibling;

            const kids = Array.prototype.slice.call(chartsArea.children);
            prevTrackIdx = kids.indexOf(prevEl);
            nextTrackIdx = kids.indexOf(nextEl);

            const tracks = getTracks();
            prevSize  = tracks[prevTrackIdx] || 0;
            nextSize  = tracks[nextTrackIdx] || 0;
            totalSize = prevSize + nextSize;

            // Belt-and-braces: also kill iframe pointer events so even if
            // setPointerCapture isn't honoured we still get mousemove on parent.
            const frames = chartsArea.querySelectorAll('iframe');
            for (let i = 0; i < frames.length; i++) {
                frames[i].style.pointerEvents = 'none';
            }
            document.body.style.userSelect = 'none';

            console.log('[shell] divider pointerdown', {
                orient: orient, startPos: startPos,
                prevTrackIdx: prevTrackIdx, nextTrackIdx: nextTrackIdx,
                prevSize: prevSize, nextSize: nextSize,
                tracks: tracks,
            });
            appendLog('drag start (' + orient + ') tracks=[' + tracks.join(',') + ']');
            e.preventDefault();
        });
        divEl.addEventListener('pointermove', function (e) {
            if (!dragging || e.pointerId !== activePointerId) return;
            const cur = (orient === 'col' ? e.clientX : e.clientY);
            const delta = cur - startPos;
            const newPrev = Math.max(120, Math.min(totalSize - 120, prevSize + delta));
            const newNext = totalSize - newPrev;
            const tracks = getTracks();
            tracks[prevTrackIdx] = newPrev;
            tracks[nextTrackIdx] = newNext;
            setTracks(tracks);
            notifyChartsResized();
        });
        function endDrag(e) {
            if (!dragging) return;
            if (e && e.pointerId !== activePointerId) return;
            dragging = false;
            try { divEl.releasePointerCapture(activePointerId); } catch (_) {}
            activePointerId = null;
            divEl.classList.remove('dragging');

            const frames = chartsArea.querySelectorAll('iframe');
            for (let i = 0; i < frames.length; i++) {
                frames[i].style.pointerEvents = '';
            }
            document.body.style.userSelect = '';

            const tracks = getTracks();
            console.log('[shell] divider pointerup, final tracks=', tracks);
            appendLog('drag end (' + orient + ') tracks=[' + tracks.join(',') + ']');

            notifyChartsResized();
            setTimeout(notifyChartsResized, 130);
        }
        divEl.addEventListener('pointerup',     endDrag);
        divEl.addEventListener('pointercancel', endDrag);

        // Also keep a window-level mouseup as a final safety net for older browsers.
        window.addEventListener('mouseup', function () {
            if (dragging) endDrag(null);
        });
    }

    // Also handle the parent window itself resizing (browser zoom, window
    // resize). Forward to all iframes so each chart re-fits.
    window.addEventListener('resize', notifyChartsResized);

    // ─── Wire UI controls ────────────────────────────────────────────────
    layoutSel.addEventListener('change', function () { applyLayout(layoutSel.value); });

    document.getElementById('apply-symbol').addEventListener('click', function () {
        if (!manager) return;
        const sym = symbolSel.value;
        // Treat as if originated from a virtual "shell" source — fan out to all
        manager.broadcastSymbol('__shell__', sym);
    });

    function setSyncMode() {
        if (!manager) return;
        manager.setSyncMode({
            crosshair: document.getElementById('sync-crosshair').checked,
            visibleRange: document.getElementById('sync-visible').checked,
            symbol: document.getElementById('sync-symbol').checked,
        });
    }
    document.getElementById('sync-crosshair').addEventListener('change', setSyncMode);
    document.getElementById('sync-visible').addEventListener('change', setSyncMode);
    document.getElementById('sync-symbol').addEventListener('change', setSyncMode);

    document.getElementById('self-test').addEventListener('click', function () {
        if (manager) manager.runGuardSelfTest();
    });

    document.getElementById('diagnose').addEventListener('click', function () {
        if (!manager) { alert('No manager'); return; }
        const charts = manager.getCharts();
        const cellsInDom = chartsArea.querySelectorAll('.chart-cell').length;
        const iframesInDom = chartsArea.querySelectorAll('.chart-cell iframe').length;
        const dividers = chartsArea.querySelectorAll('.divider');
        const lines = [];
        lines.push('Layout selected: ' + layoutSel.value);
        lines.push('Chart cells in DOM: ' + cellsInDom);
        lines.push('iframes in DOM:     ' + iframesInDom);
        lines.push('Charts in manager:  ' + charts.length);
        lines.push('');
        lines.push('Dividers in DOM: ' + dividers.length);
        const csa = window.getComputedStyle(chartsArea);
        lines.push('  computed grid-template-columns: ' + csa.gridTemplateColumns);
        lines.push('  computed grid-template-rows:    ' + csa.gridTemplateRows);
        lines.push('  inline   grid-template-columns: ' + chartsArea.style.gridTemplateColumns);
        lines.push('  inline   grid-template-rows:    ' + chartsArea.style.gridTemplateRows);
        dividers.forEach(function (d, i) {
            const r = d.getBoundingClientRect();
            const cs = window.getComputedStyle(d);
            const fromPoint = document.elementFromPoint(r.x + r.width / 2, r.y + r.height / 2);
            lines.push('  divider[' + i + ']: rect=(' + r.x.toFixed(0) + ',' + r.y.toFixed(0)
                     + ' ' + r.width.toFixed(0) + 'x' + r.height.toFixed(0) + ') '
                     + 'pointer-events=' + cs.pointerEvents + ' '
                     + 'z-index=' + cs.zIndex + ' '
                     + 'cursor=' + cs.cursor);
            lines.push('    elementFromPoint(center) → '
                     + (fromPoint ? (fromPoint.tagName + '.' + fromPoint.className) : 'null'));
        });
        lines.push('');
        lines.push('Per-chart:');
        for (const c of charts) {
            lines.push('  ' + c.id + ':');
            lines.push('    cfg:    ' + JSON.stringify(c.cfg));
            lines.push('    ready:  ' + c.ready);
            lines.push('    state:  ' + JSON.stringify(c.state));
            lines.push('    iframe: ' + (c.frame && c.frame.src ? c.frame.src : 'NONE'));
        }
        lines.push('');
        lines.push('Counters: ' + JSON.stringify(manager.counters));
        const txt = lines.join('\n');
        console.log('=== DIAGNOSE ===\n' + txt);
        appendLog({ ts: Date.now(), level: 'info', text: '=== DIAGNOSE ===\n' + txt });
        alert(txt);
    });
    document.getElementById('clear-log').addEventListener('click', function () {
        logEl.innerHTML = '';
        if (manager) {
            manager.counters.outFromUser = 0;
            manager.counters.droppedLoop = 0;
            manager.counters.droppedForbidden = 0;
            manager.counters.assertionsOk = 0;
            manager.counters.assertionsFail = 0;
        }
    });

    // ─── Boot ────────────────────────────────────────────────────────────
    applyLayout(layoutSel.value);
})();
</script>
</body>
</html>
