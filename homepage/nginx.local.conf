proxy_cache_path /tmp/nginx_tile_cache levels=1:2
    keys_zone=tiles:32m max_size=2g inactive=24h use_temp_path=off;

limit_req_zone $cookie_chart_session_id zone=per_user:10m rate=60r/s;
limit_req_zone $binary_remote_addr     zone=per_ip:10m  rate=20r/s;

# Auth endpoints sit behind the host TLS proxy in production. Key auth limits by
# the real client IP that proxy forwards; otherwise a launch crowd can all look
# like one Docker/host proxy address and trip the limit together.
map $http_x_forwarded_for $auth_forwarded_client_ip {
    "~^[[:space:]]*([^,[:space:]]+)" $1;
    default "";
}

map $auth_forwarded_client_ip $auth_forwarded_or_real_ip {
    default $auth_forwarded_client_ip;
    ""      $http_x_real_ip;
}

map $auth_forwarded_or_real_ip $auth_client_ip {
    default $auth_forwarded_or_real_ip;
    ""      $binary_remote_addr;
}

# Login/signup only — do NOT rate-limit /api/auth/me (chart polls it every load).
# Keep login strict for credential stuffing, but allow signup bursts during launches.
limit_req_zone $auth_client_ip zone=auth_login:10m rate=10r/m;
limit_req_zone $auth_client_ip zone=auth_signup:10m rate=120r/m;

# 1 = bypass cache (default), 0 = cache hit path for tile URLs
map $uri $is_tile {
    default                             1;
    ~^/api/file/[0-9]+/tile/            0;
}

# Honor the TLS-terminating proxy in front (host nginx / ALB / Cloudflare): if it
# sends X-Forwarded-Proto, pass that through to the backends so HTTPS is detected
# and Secure cookies work. When there is no upstream proxy (local dev on :80),
# fall back to this server's own $scheme. This is what lets sessions persist over
# https://www.talaria-log.com without the login-loop.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Rate-limit responses should be 429, not 503 (503 looks like server down).
    limit_req_status 429;

    # Enterprise security headers (securty/nginx-security-headers.conf)
    include /etc/nginx/conf.d/security-headers.conf;

    # Custom page when upstream is unreachable (502) or overloaded (503/504)
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Next static export emits /404.html for app/not-found.tsx — use it instead of always falling back to /index.html
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Allow larger request lines/query strings so stale long chart URLs don't fail with 414.
    # App code now trims drawings URL params, but this keeps existing bookmarked URLs recoverable.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    # Gzip compression. Do NOT gzip application/octet-stream: the chart's bar/tile
    # payloads are binary (poorly compressible), and gzipping them on every multichart
    # request burned a full nginx core on this CPU-limited VPS. Bandwidth is plentiful
    # (16 TB), CPU is the constraint — so compress text/JSON/JS only, and skip tiny bodies.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Keep admin datasets URL stable while actual page is served by trading-chart.
    # Unified admin dashboard
    location = /dashboard/admin {
        return 302 /chart/admin-dashboard.html;
    }

    location = /dashboard/admin/ {
        return 302 /chart/admin-dashboard.html;
    }

    location = /chart/admin_dashboard.html {
        return 302 /chart/admin-dashboard.html;
    }

    location = /dashboard/admin/datasets {
        return 302 /chart/admin-dashboard.html#datasets;
    }

    location = /dashboard/admin/datasets/ {
        return 302 /chart/admin-dashboard.html#datasets;
    }

    location = /dashboard/admin/users {
        return 302 /chart/admin-dashboard.html#users;
    }

    location = /dashboard/admin/users/ {
        return 302 /chart/admin-dashboard.html#users;
    }

    # Legacy duplicate dashboard pages → single V16 root
    location = /dashboard/trades { return 301 /dashboard/?view=trades; }
    location = /dashboard/trades/ { return 301 /dashboard/?view=trades; }
    location = /dashboard/backtest { return 301 /dashboard/?view=sessions; }
    location = /dashboard/backtest/ { return 301 /dashboard/?view=sessions; }
    location = /dashboard/backtest/analytics { return 301 /dashboard/; }
    location = /dashboard/backtest/analytics/ { return 301 /dashboard/; }
    location = /dashboard/strategies { return 301 /dashboard/?view=stratbank; }
    location = /dashboard/strategies/ { return 301 /dashboard/?view=stratbank; }

    # Chart static: serve from Next export (homepage/public/chart → out/chart) when present.
    # Multichart loads 4× (index.html + chart.js + 40 modules); serving locally avoids
    # saturating gunicorn workers and prevents 504 on iframe HTML under load.
    # Missing paths (admin-dashboard.html, uploads, …) fall through to trading-chart.
    location ^~ /chart/ {
        try_files $uri $uri/ @chart_upstream;
        # Short TTL — chart assets are cache-busted via ?v= on each deploy.
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location @chart_upstream {
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 100M;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # WebSocket (support inbox pings, chart stream) — must be before generic location /
    location /ws/ {
        proxy_pass http://trading-chart:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 86400s;
    }

    # Chart preferences / settings / drawings — served by journal-backend
    location ^~ /api/chart/ {
        proxy_pass http://journal-backend:5000/api/chart/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Strict rate limit on credential endpoints only (not /api/auth/me).
    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://trading-chart:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $auth_client_ip;
        proxy_set_header X-Forwarded-For $auth_client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 100M;
    }

    location = /api/auth/signup {
        limit_req zone=auth_signup burst=60 nodelay;
        proxy_pass http://trading-chart:8000/api/auth/signup;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $auth_client_ip;
        proxy_set_header X-Forwarded-For $auth_client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 100M;
    }

    location ^~ /api/auth/ {
        proxy_pass http://trading-chart:8000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 100M;
    }

    location ^~ /api/ {
        proxy_pass http://trading-chart:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 100M;
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;

        # Tile cache: $is_tile=0 for /api/file/N/tile/... URLs, 1 for all others
        proxy_cache            tiles;
        proxy_cache_bypass     $is_tile;
        proxy_no_cache         $is_tile;
        proxy_cache_valid      200 24h;
        proxy_cache_key        $uri;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale  error timeout updating;
        proxy_ignore_headers   Set-Cookie;
        add_header             X-Cache-Status $upstream_cache_status;

        limit_req zone=per_user burst=200 nodelay;
        limit_req zone=per_ip  burst=40  nodelay;
    }

    # Proxy journal API requests directly to backend (^~ prevents regex matching)
    location ^~ /journal/api/ {
        client_max_body_size 64m;
        proxy_pass http://journal-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Authorization $http_authorization;
        # Forward cookies so Flask can read the httpOnly journal_token cookie
        # (auth hardening). Bearer header still forwarded for the rollout window.
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Legacy journal SPA removed — send UI paths to Next (API stays on journal-backend above).
    location = /journal/pricing {
        return 301 /pricing/;
    }
    location = /journal/pricing/ {
        return 301 /pricing/;
    }
    location = /journal/subscription-status {
        return 301 /pricing/?browse=1;
    }
    location = /journal/subscription-status/ {
        return 301 /pricing/?browse=1;
    }
    location = /journal {
        return 301 /dashboard/journal/;
    }
    location = /journal/ {
        return 301 /dashboard/journal/;
    }
    location = /journal/login {
        return 301 /login/?next=%2Fdashboard%2Fjournal%2F;
    }
    location = /journal/login/ {
        return 301 /login/?next=%2Fdashboard%2Fjournal%2F;
    }
    location ^~ /journal/ {
        return 301 /dashboard/journal/;
    }

    # Handle Next.js static export routing (homepage). Do not fall back to /index.html — that hides real 404s.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
