services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  questdb:
    image: questdb/questdb:8.2.2
    restart: unless-stopped
    # QuestDB was the only steady-state CPU hog (~36% idle). Root cause: its worker
    # pools auto-size to the host core count and busy-spin while idle. Capping the
    # pools and forcing threads to sleep (yield/sleep threshold=1) drops idle CPU to
    # low single digits without hurting ingest/query throughput at our volume.
    # 4g: QuestDB used ~2.6g under heavy ingest, so a 2g cap risks an OOM-kill /
    # restart loop mid-ingest. Keep headroom; lower only if the host is memory-tight.
    mem_limit: ${QUESTDB_MEM_LIMIT:-4g}
    environment:
      QDB_PG_USER: ${QUESTDB_PG_USER:-admin}
      QDB_PG_PASSWORD: ${QUESTDB_PG_PASSWORD:-quest}
      QDB_PG_ENABLED: "true"
      QDB_LINE_TCP_ENABLED: "true"
      QDB_HTTP_MIN_ENABLED: "true"
      # PG wire can queue when large SAMPLE BY / rebuild jobs run — allow more concurrent clients.
      QDB_PG_NET_CONNECTION_LIMIT: "64"
      # ── Idle-CPU containment (see https://github.com/questdb/questdb/issues/3512) ──
      # Bound the shared pool instead of letting it grab every core, and make idle
      # workers sleep instead of spin.
      QDB_SHARED_WORKER_COUNT: ${QDB_SHARED_WORKER_COUNT:-2}
      QDB_SHARED_WORKER_YIELD_THRESHOLD: "1"
      QDB_SHARED_WORKER_SLEEP_THRESHOLD: "1"
      QDB_PG_WORKER_COUNT: ${QDB_PG_WORKER_COUNT:-2}
      QDB_HTTP_WORKER_COUNT: ${QDB_HTTP_WORKER_COUNT:-2}
      # ILP/TCP ingest pool is the biggest idle spinner — pin it small and sleepy.
      QDB_LINE_TCP_WRITER_WORKER_COUNT: "1"
      QDB_LINE_TCP_WRITER_WORKER_YIELD_THRESHOLD: "1"
      QDB_LINE_TCP_WRITER_WORKER_SLEEP_THRESHOLD: "1"
      QDB_LINE_TCP_IO_WORKER_COUNT: "1"
      QDB_LINE_TCP_IO_WORKER_YIELD_THRESHOLD: "1"
      QDB_LINE_TCP_IO_WORKER_SLEEP_THRESHOLD: "1"
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      # Official image has no curl/wget — use bash /dev/tcp (PG wire port).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8812' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talaria}
      POSTGRES_USER: ${POSTGRES_USER:-talaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talaria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talaria} -d ${POSTGRES_DB:-talaria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  journal-backend:
    # Defaults to the locally-built image name (zero friction for `docker compose build`).
    # For pull-based CI deploys, set JOURNAL_BACKEND_IMAGE=ghcr.io/<owner>/talaria-journal-backend:<tag>
    # (scripts/deploy.sh does this) so the VPS pulls instead of compiling.
    image: ${JOURNAL_BACKEND_IMAGE:-talaria-journal-backend:latest}
    build:
      context: ./journal-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talaria}:${POSTGRES_PASSWORD:-talaria}@db:5432/${POSTGRES_DB:-talaria}
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      # Must be 32+ chars in production (journal-backend refuses weak defaults)
      SECRET_KEY: ${SECRET_KEY:-local-docker-journal-secret-minimum-32-characters-long}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-journal-jwt-secret-minimum-32-characters}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,https://talaria-log.com,https://www.talaria-log.com}
      # Allow HTTP Stripe return URLs when frontend is served over HTTP (set true behind HTTPS only)
      STRIPE_REDIRECT_REQUIRE_HTTPS: ${STRIPE_REDIRECT_REQUIRE_HTTPS:-false}
      DOMAIN_EMAIL_SMTP_SERVER: ${DOMAIN_EMAIL_SMTP_SERVER:-smtp.gmail.com}
      DOMAIN_EMAIL_SMTP_PORT: ${DOMAIN_EMAIL_SMTP_PORT:-587}
      DOMAIN_EMAIL_USERNAME: ${DOMAIN_EMAIL_USERNAME:-}
      DOMAIN_EMAIL_PASSWORD: ${DOMAIN_EMAIL_PASSWORD:-}
      DOMAIN_EMAIL_USE_TLS: "true"
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-contact@talaria.services}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Context = repo root: Dockerfile runs `npm run build:live:chart` in talaria-design (V9 bundle + ?v= bump).
  # IMPORTANT: the V9/Terser builds inside this image take ~15–20 min of CPU. Build them in
  # CI (see .github/workflows/build-images.yml) and deploy with `docker compose pull && up -d`
  # so this never compiles on the production VPS.
  trading-chart:
    # Local build name by default; set TRADING_CHART_IMAGE=ghcr.io/<owner>/talaria-trading-chart:<tag>
    # for pull-based deploys (see scripts/deploy.sh).
    image: ${TRADING_CHART_IMAGE:-talaria-trading-chart:latest}
    build:
      context: .
      dockerfile: chart v 1.4/chart/Dockerfile.local
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    volumes:
      - chart_uploads:/app/uploads
      - chart_data:/app/data
    command:
      [
        "sh",
        "-c",
        "exec gunicorn api_server:app -w $${WEB_CONCURRENCY:-2} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 1800 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100",
      ]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-talaria}:${POSTGRES_PASSWORD:-talaria}@db:5432/${POSTGRES_DB:-talaria}
      REDIS_URL: "redis://redis:6379"
      # Comma-separated browser origins (no paths). Set in .env for production — do not use * on a public site.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # PATCH /api/sessions/:id/state can 403 if Origin is not trusted; set explicit origins in production.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      AUTH_ENABLED: "true"
      SESSION_COOKIE_NAME: "chart_session_id"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: "lax"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      APP_ROLE: "api"
      # Bar window cache (BACKTEST_BARS_CACHE_*) shared across gunicorn workers via Redis above.
      # Skip scanning all datasets for missing binaries/tiles on every container restart (saves CPU on deploy).
      # Set false in .env when you need a full repair pass after data migration.
      SKIP_BINARY_BACKFILL_ON_STARTUP: ${SKIP_BINARY_BACKFILL_ON_STARTUP:-true}
      # FirstRate nightly delta sync (admin can override via uploads/firstrate_schedule.json)
      FIrstrate_SCHEDULE_ENABLED: ${FIrstrate_SCHEDULE_ENABLED:-true}
      FIrstrate_SCHEDULE_NIGHTLY_UTC_HOUR: ${FIrstrate_SCHEDULE_NIGHTLY_UTC_HOUR:-2}
      FIrstrate_SCHEDULE_PERIOD: ${FIrstrate_SCHEDULE_PERIOD:-week}
      FIrstrate_SCHEDULE_ADAPTIVE_PERIOD: ${FIrstrate_SCHEDULE_ADAPTIVE_PERIOD:-true}
      FIrstrate_SCHEDULE_AUTO_REPAIR: ${FIrstrate_SCHEDULE_AUTO_REPAIR:-true}
      FIrstrate_SCHEDULE_TICK_SEC: ${FIrstrate_SCHEDULE_TICK_SEC:-120}
      BINARY_BUILD_MODE: ${BINARY_BUILD_MODE:-queue}
      # 5s (was 2s): jobs still wake instantly via Redis BRPOP; this only widens the
      # idle fallback poll so we issue fewer "claim next job" queries against Postgres.
      BINARY_QUEUE_POLL_SECONDS: ${BINARY_QUEUE_POLL_SECONDS:-5.0}
      BINARY_ONLY_RUNTIME: ${BINARY_ONLY_RUNTIME:-false}
      BACKTEST_SMART_RATE_PER_MINUTE: ${BACKTEST_SMART_RATE_PER_MINUTE:-90}
      BACKTEST_WHATIF_RATE_PER_MINUTE: ${BACKTEST_WHATIF_RATE_PER_MINUTE:-30}
      BACKTEST_SESSION_PATCH_RATE_PER_MINUTE: ${BACKTEST_SESSION_PATCH_RATE_PER_MINUTE:-60}
      BACKTEST_BARS_CACHE_ENABLED: ${BACKTEST_BARS_CACHE_ENABLED:-true}
      BACKTEST_BARS_CACHE_TTL_SEC: ${BACKTEST_BARS_CACHE_TTL_SEC:-300}
      BACKTEST_BARS_CACHE_MAX_BYTES: ${BACKTEST_BARS_CACHE_MAX_BYTES:-8000000}
      BACKTEST_WHATIF_ASYNC: ${BACKTEST_WHATIF_ASYNC:-true}
      BACKTEST_WHATIF_CACHE_TTL_SEC: ${BACKTEST_WHATIF_CACHE_TTL_SEC:-900}
      BACKTEST_WHATIF_DRAIN_ON_API: ${BACKTEST_WHATIF_DRAIN_ON_API:-false}
      SESSION_JOURNAL_SQL_PRIMARY: ${SESSION_JOURNAL_SQL_PRIMARY:-true}
      SESSION_STRIP_JOURNAL_FROM_STATE_JSON: ${SESSION_STRIP_JOURNAL_FROM_STATE_JSON:-true}
      MAX_JOURNAL_TRADES_PER_SESSION: ${MAX_JOURNAL_TRADES_PER_SESSION:-5000}
      TILE_CDN_BASE_URL: ${TILE_CDN_BASE_URL:-}
      TILE_CDN_REDIRECT: ${TILE_CDN_REDIRECT:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Same secret as journal-backend — mints Bearer tokens for /journal/api/* from chart cookie sessions
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-journal-jwt-secret-minimum-32-characters}
      # Google Sign-In (OAuth client ID from Google Cloud Console — Web application)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Billing portal return_url allowlist (api_server). Until DNS is live, use the origin you open in the browser (e.g. http://localhost:3000). Production: https://www.talaria-log.com
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRIPE_REDIRECT_ALLOWED_ORIGINS: ${STRIPE_REDIRECT_ALLOWED_ORIGINS:-}
      QUESTDB_ENABLED: ${QUESTDB_ENABLED:-true}
      QUESTDB_READ_PRIMARY: ${QUESTDB_READ_PRIMARY:-false}
      QUESTDB_TILES_FALLBACK: ${QUESTDB_TILES_FALLBACK:-true}
      # Keep OFF on this ingest-heavy stack. Rebuilding aggregates runs a SAMPLE BY
      # over the whole PARTITION BY YEAR ohlcv_1m PLUS a full table copy (QuestDB has
      # no DELETE) on EVERY ingest — that compounds ingest CPU. Read-side SAMPLE BY is
      # cheaper here; the real read fix is repartitioning to MONTH/DAY (see notes).
      QUESTDB_REBUILD_AGGREGATES: ${QUESTDB_REBUILD_AGGREGATES:-false}
      # Do NOT push 1m rows into QuestDB during binary builds while the chart reads from
      # binary tiles (READ_PRIMARY=false). This ingest (1m+ ILP rows + a 600s flush wait
      # per dataset) was the main worker/QuestDB CPU storm. Flip to true only for a
      # deliberate one-off QuestDB backfill, or set QUESTDB_READ_PRIMARY=true.
      QUESTDB_SYNC_ON_BUILD: ${QUESTDB_SYNC_ON_BUILD:-false}
      QUESTDB_PG_URL: postgresql://${QUESTDB_PG_USER:-admin}:${QUESTDB_PG_PASSWORD:-quest}@questdb:8812/qdb
      QUESTDB_PG_CONNECT_TIMEOUT: ${QUESTDB_PG_CONNECT_TIMEOUT:-30}
      QUESTDB_ILP_HOST: questdb
      QUESTDB_ILP_PORT: "9009"
    # Optional: inject FINNHUB (and other keys) from chart/.env — required:false so compose works if file is missing.
    env_file:
      - path: "./chart v 1.4/chart/.env"
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
      journal-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

  trading-chart-worker:
    # Same image as trading-chart (only the command differs) — no separate build/compile.
    image: ${TRADING_CHART_IMAGE:-talaria-trading-chart:latest}
    build:
      context: .
      dockerfile: chart v 1.4/chart/Dockerfile.local
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    command:
      [
        "gunicorn",
        "api_server:app",
        "-w",
        "1",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "--bind",
        "0.0.0.0:8000",
        "--timeout",
        "1800",
      ]
    volumes:
      - chart_uploads:/app/uploads
      - chart_data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-talaria}:${POSTGRES_PASSWORD:-talaria}@db:5432/${POSTGRES_DB:-talaria}
      REDIS_URL: "redis://redis:6379"
      APP_ROLE: "worker"
      SKIP_BINARY_BACKFILL_ON_STARTUP: "true"
      FIrstrate_SCHEDULE_ENABLED: ${FIrstrate_SCHEDULE_ENABLED:-true}
      FIrstrate_SCHEDULE_NIGHTLY_UTC_HOUR: ${FIrstrate_SCHEDULE_NIGHTLY_UTC_HOUR:-2}
      FIrstrate_SCHEDULE_PERIOD: ${FIrstrate_SCHEDULE_PERIOD:-week}
      FIrstrate_SCHEDULE_ADAPTIVE_PERIOD: ${FIrstrate_SCHEDULE_ADAPTIVE_PERIOD:-true}
      FIrstrate_SCHEDULE_AUTO_REPAIR: ${FIrstrate_SCHEDULE_AUTO_REPAIR:-true}
      FIrstrate_SCHEDULE_TICK_SEC: ${FIrstrate_SCHEDULE_TICK_SEC:-120}
      BINARY_BUILD_MODE: ${BINARY_BUILD_MODE:-queue}
      BINARY_QUEUE_POLL_SECONDS: ${BINARY_QUEUE_POLL_SECONDS:-5.0}
      # Single build thread keeps the worker off the CPU when traffic is sustained;
      # raise only if the binary backlog grows and CPU headroom exists.
      BINARY_WORKER_THREADS: ${BINARY_WORKER_THREADS:-1}
      BINARY_JOB_MAX_MINUTES: ${BINARY_JOB_MAX_MINUTES:-120}
      BINARY_STUCK_PROCESSING_MINUTES: ${BINARY_STUCK_PROCESSING_MINUTES:-75}
      BINARY_ONLY_RUNTIME: ${BINARY_ONLY_RUNTIME:-false}
      BACKTEST_WHATIF_ASYNC: ${BACKTEST_WHATIF_ASYNC:-true}
      BACKTEST_WHATIF_CACHE_TTL_SEC: ${BACKTEST_WHATIF_CACHE_TTL_SEC:-900}
      AUTH_ENABLED: "false"
      QUESTDB_ENABLED: ${QUESTDB_ENABLED:-true}
      QUESTDB_READ_PRIMARY: ${QUESTDB_READ_PRIMARY:-false}
      QUESTDB_TILES_FALLBACK: ${QUESTDB_TILES_FALLBACK:-true}
      QUESTDB_REBUILD_AGGREGATES: ${QUESTDB_REBUILD_AGGREGATES:-false}
      QUESTDB_SYNC_ON_BUILD: ${QUESTDB_SYNC_ON_BUILD:-false}
      QUESTDB_PG_URL: postgresql://${QUESTDB_PG_USER:-admin}:${QUESTDB_PG_PASSWORD:-quest}@questdb:8812/qdb
      QUESTDB_PG_CONNECT_TIMEOUT: ${QUESTDB_PG_CONNECT_TIMEOUT:-30}
      QUESTDB_ILP_HOST: questdb
      QUESTDB_ILP_PORT: "9009"
    env_file:
      - path: "./chart v 1.4/chart/.env"
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
      journal-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  homepage:
    image: ${HOMEPAGE_IMAGE:-talaria-homepage:latest}
    build:
      context: .
      dockerfile: homepage/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3000:80"
    volumes:
      - ./homepage/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      journal-backend:
        condition: service_started
      trading-chart:
        condition: service_healthy

volumes:
  postgres_data:
  questdb_data:
  chart_uploads:
  chart_data:
